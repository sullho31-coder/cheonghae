<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청해대학교 — 해방 10년</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece6db; --paper:#f8f4ec; --ink:#2a2930; --sub:#6c6876; --line:#d9d1c3;
  --navy:#1d2833; --accent:#b0553a; --gold:#c49a3c; --good:#3d7a5a; --bad:#a8443a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--paper);box-shadow:0 0 40px rgba(0,0,0,.08)}
header{background:var(--navy);color:#f1ebe0;padding:10px 14px 9px;flex:none}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.when{font-family:'Gowun Batang',serif;font-weight:700;font-size:16px;letter-spacing:-.2px}
.money{font-weight:700;color:#f3d48a;font-variant-numeric:tabular-nums}
.who{font-size:12px;color:#b9b2a5;margin-top:1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.st{font-size:11px;color:#cfc7b8}
.st b{color:#fff;font-weight:500;font-variant-numeric:tabular-nums;float:right}
.bar{height:4px;background:rgba(255,255,255,.14);border-radius:2px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#e7c46a;border-radius:2px;transition:width .4s}
.st.stress .bar i{background:#e0715a}
.hbtn{background:rgba(255,255,255,.1);color:#f1ebe0;border:0;border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.hbtn:active{background:rgba(255,255,255,.2)}
#log{flex:1;overflow-y:auto;padding:16px 16px 8px}
.ln{margin:0 0 9px;animation:fi .35s ease both;font-family:'Gowun Batang',serif;font-size:15.5px;color:#3a3842}
.hd{margin:18px 0 12px;text-align:center;font-family:'Gowun Batang',serif;font-weight:700;color:var(--navy);font-size:15px;letter-spacing:.5px;animation:fi .35s both}
.hd::before,.hd::after{content:'';display:inline-block;width:28px;height:1px;background:var(--line);vertical-align:middle;margin:0 10px}
.sys{margin:2px 0 12px;font-size:12.5px;color:var(--sub);animation:fi .35s both}
.sys span{display:inline-block;background:#efe8db;border-radius:6px;padding:2px 8px}
.dl{margin:0 0 10px;display:flex;flex-direction:column;align-items:flex-start;animation:fi .35s both}
.dl .nm{font-size:12px;font-weight:700;margin:0 0 2px 4px}
.dl .tx{background:#fff;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:7px 12px;max-width:92%}
.dl.me{align-items:flex-end}
.dl.me .tx{background:#f3e3d4;border-color:#e6cdb6;border-radius:14px 4px 14px 14px}
.pick{margin:4px 0 12px;text-align:right;font-size:13px;color:var(--accent);font-weight:500;animation:fi .25s both}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#panel{flex:none;border-top:1px solid var(--line);background:#f2ede3;padding:10px 12px calc(10px + env(safe-area-inset-bottom));max-height:52vh;overflow-y:auto}
#panel:empty{display:none}
.ptitle{font-size:12px;color:var(--sub);margin:0 2px 7px;display:flex;justify-content:space-between}
.choices{display:flex;flex-direction:column;gap:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.btn{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;font:inherit;font-size:14.5px;color:var(--ink);cursor:pointer;transition:transform .08s,border-color .15s}
.btn:hover{border-color:#bfb29c}
.btn:active{transform:scale(.985)}
.btn small{display:block;font-size:11.5px;color:var(--sub);margin-top:1px}
.choices.compact{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.choices.compact .btn{padding:8px 10px;font-size:14px}
.choices.compact .btn:first-child{grid-column:1/-1}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.main{background:var(--navy);color:#f6efe3;border-color:var(--navy);text-align:center;font-weight:700}
.btn.ghost{background:transparent;text-align:center;color:var(--sub)}
.btn .ic{margin-right:6px}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(20,22,28,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9;animation:fi .2s}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:86dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
.sheet h2{font-family:'Gowun Batang',serif;font-size:19px;margin-bottom:4px}
.sheet .hint{font-size:12.5px;color:var(--sub);margin-bottom:12px}
.card{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fffaf0;border:2.5px solid #999;font-size:23px;line-height:1}
.card .nm{font-weight:700}
.card .sp{font-size:12px;color:var(--sub)}
.card .ds{font-size:13px;margin-top:2px}
.hearts{color:#c9473b;letter-spacing:1px;font-size:13px}
.hearts em{color:#d8cfc0;font-style:normal}
.unk .av{background:#e6e0d4!important;border-color:#b8b0a2!important;filter:grayscale(1);opacity:.6}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;background:#efe8db;color:#6c6876;vertical-align:1px}
.tag.lv{background:#f6d9d2;color:#b0453a}
.card .pl{font-size:12px;color:#8a6a4a;margin-top:3px}
.card .nx{font-size:12px;color:#3d6a5a;margin-top:2px}
.card details{font-size:12.5px;margin-top:4px;color:#4a4752}
.card summary{cursor:pointer;color:#6c6876}
.card ol{padding-left:18px;margin-top:3px}
/* setup */
.setup{padding:4px 2px 20px;animation:fi .4s}
.title{text-align:center;padding:26px 0 18px}
.title h1{font-family:'Gowun Batang',serif;font-size:30px;letter-spacing:-.5px;color:var(--navy)}
.title p{color:var(--sub);font-size:13px;margin-top:4px}
.lede{font-family:'Gowun Batang',serif;font-size:14.5px;color:#4a4752;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:5px}
.fld input[type=text],.fld select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.note{font-size:12px;color:var(--sub);margin-top:5px}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.end{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin:10px 0 18px;animation:fi .5s}
.egal{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.egal summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.egal summary::-webkit-details-marker{display:none}
.egal .end h3,.egal .end .sub{display:none}
.egal .end{padding:6px 12px}
.egal summary span{font-size:12px;color:var(--ink2,#888);white-space:nowrap}
.end h3{font-family:'Gowun Batang',serif;font-size:20px;text-align:center;color:var(--navy)}
.end .sub{text-align:center;font-size:12.5px;color:var(--sub);margin-bottom:12px}
.end table{width:100%;font-size:13.5px;border-collapse:collapse}
.end td{padding:5px 2px;border-bottom:1px dashed var(--line)}
.end td:last-child{text-align:right;font-weight:500}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:7px 14px;border-radius:20px;font-size:13px;z-index:20;animation:fi .2s}
</style>
</head>
<body>
<div id="app">
  <header id="hud" style="display:none">
    <div class="hrow">
      <div><div class="when" id="when"></div><div class="who" id="who"></div></div>
      <div style="text-align:right"><div class="money" id="money"></div>
        <div style="margin-top:4px;display:flex;gap:5px;justify-content:flex-end">
          <button class="hbtn" id="bChars">인물</button><button class="hbtn" id="bMenu">메뉴</button>
        </div></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <main id="log"></main>
  <section id="panel"></section>
</div>
<script>
/* ===================== 기본 유틸 ===================== */
const $=s=>document.querySelector(s);
const LOG=$('#log'), PANEL=$('#panel');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const SAVE_KEY='cheonghae_save_v1';
let P=null, FAST=false, skipBatch=false;
function J(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+b;return w+(((c-0xAC00)%28)?a:b);}
const isH=()=>P.sp==='human', isM=()=>P.sp==='mixed', isB=()=>P.sp==='beast';
const N=()=>P.name;

/* ===================== 데이터: 전공·동아리·장소 ===================== */
const MAJORS={
  elec:{n:'전자공학과',b:{study:2}}, comp:{n:'컴퓨터공학과',b:{study:2}},
  police:{n:'경찰행정학과',b:{body:2}}, sport:{n:'체육학과',b:{body:3}},
  hotel:{n:'호텔경영학과',b:{charm:2}}, ocean:{n:'해양학과',b:{body:1,study:1}}, econ:{n:'경제학과',b:{study:2}}
};
const CLUBS={
  shoot:{n:'사격부',b:{body:3},d:'국가대표 상비군도 있는 실전파'},
  boxing:{n:'복싱부',b:{body:4},d:'땀 냄새와 고함의 동아리방'},
  robot:{n:'로봇공학회',b:{study:4},d:'새벽까지 불이 꺼지지 않는 공대 동아리'},
  movie:{n:'영화감상회',b:{charm:3},d:'매주 목요일 밤 상영회'},
  tarot:{n:'점술 동아리 「오늘의 운세」',b:{charm:3},d:'타로·주사위·포춘쿠키'},
  rights:{n:'인권동아리 「같은 땅」',b:{charm:2,study:1},d:'해방 이후를 이야기하는 사람들'},
  rotc:{n:'학군단(ROTC)',b:{body:4},d:'교관들이 하나같이 거구다. 인간은 후보생 대신 ‘보조병 체험 과정’만 들을 수 있다.'}
};
const JOBS={
  j_gukbap:{n:'복희네 국밥집',ic:'🍲',w:12,st:3,hm:1,mm:1,d:'인간 손님도, 인간 알바도 차별 없는 영도 시장 골목 국밥집',e:{body:1}},
  j_store:{n:'무인편의점 야간 관리',ic:'🏪',w:14,st:7,hm:.5,mm:.75,d:'새벽 진열과 재고 정리',e:{}},
  j_bar:{n:'바 「침향」',ic:'🍸',w:20,st:10,hm:.5,mm:.75,d:'호텔 가람 21층 고급 바. 밤 근무',e:{charm:2}},
  j_port:{n:'북항 하역장',ic:'⚓',w:26,st:16,hm:.5,mm:.75,d:'시급은 높지만 위험한 야간 하역',e:{body:3}},
  j_salon:{n:'시내 헤어살롱 보조',ic:'💇',w:11,st:6,hm:.6,mm:.8,d:'이른 아침 샴푸·드라이 보조',e:{charm:2}},
  j_park:{n:'놀이공원',ic:'🎡',w:13,st:8,hm:.5,mm:.75,d:'안전바 점검과 줄 안내',e:{charm:1}},
  j_center:{n:'적응지원센터 근로장학',ic:'🏢',w:9,st:3,hm:1,mm:1,d:'행정 보조. 인간·혼혈도 제값을 받는다',e:{study:1}}
};
const OUTS={
  o_library:{n:'도서관 야간열람실',ic:'📖',e:{study:3,stress:-3},f:['자정 가까운 열람실은 조용했다.','형광등 아래에서 책장을 넘겼다.']},
  o_lab:{n:'공대 실습실',ic:'🔧',e:{study:2,stress:-2},f:['납땜 냄새가 밴 실습실에 들렀다.','누군가 두고 간 회로 기판들이 쌓여 있었다.']},
  o_gym:{n:'체육관',ic:'🥊',e:{body:3,stress:-4},f:['체육관에서 땀을 흘렸다.','샌드백 치는 소리가 울렸다.']},
  o_range:{n:'사격장',ic:'🎯',e:{body:1,stress:-4},f:['흡음재로 덮인 사격장. 총성이 둔하게 울렸다.']},
  o_cafe:{n:'학생식당',ic:'🍚',e:{stress:-5,money:-1},f:['학생식당에서 밥을 먹었다.','오늘의 메뉴는 수인 기준 대(大)자 제육이었다.']},
  o_mount:{n:'뒷산 산책로',ic:'🌲',e:{body:1,stress:-8},f:['학교 뒷산을 걸었다. 바람에 솔 냄새가 났다.']},
  o_coast:{n:'방파제',ic:'🌊',e:{charm:1,stress:-9},f:['바다를 보러 방파제에 나갔다.','파도가 테트라포드에 부서졌다.']},
  o_lake:{n:'새벽 호수공원',ic:'🌙',e:{stress:-8},f:['새벽 두 시의 호수공원. 아무도 없었다.']},
  o_center:{n:'적응지원센터',ic:'🏢',e:{stress:-4},f:['캠퍼스 안의 인간·혼혈 학생 적응지원센터에 들렀다.'],cond:()=>!isB()},
  o_gate:{n:'정문 앞 거리',ic:'🚪',e:{stress:-4,money:-1},f:['정문 앞 거리를 걸었다. 가판대에서 단내가 났다.']},
  o_downtown:{n:'시내 번화가',ic:'🏙️',e:{charm:2,stress:-6,money:-2},f:['시내 번화가로 나갔다. 촬영 현장과 팝업스토어가 줄지어 있었다.']},
  o_rotc:{n:'학군단 연병장',ic:'🎖️',e:{body:3,stress:-1},f:['학군단 연병장. 구령 소리가 쩌렁쩌렁 울렸다.']},
  o_hospital:{n:'대학병원',ic:'🏥',e:{body:2,stress:-3},f:['대학병원에서 건강검진을 받았다.','소독약 냄새가 나는 복도를 걸었다.']},
  o_dorm:{n:'기숙사 로비',ic:'🛏️',e:{stress:-6},f:['기숙사 로비 소파에 늘어져 있었다.']},
  o_alley:{n:'북항 뒷골목',ic:'🌫️',e:{stress:3},f:['북항 뒷골목. 비린내와 담배 연기가 섞여 있었다.','젖은 골목 끝에서 철문이 삐걱거렸다.']},
  o_forest:{n:'숲 깊은 곳',ic:'🌳',e:{body:1,stress:-6},f:['학교 뒷산을 넘어 숲 깊은 곳까지 들어갔다.']}
};
const SEASON=['🌸','🍂'];

/* ===================== 인물(공략 가능) ===================== */
const CH={
haean:{id:'haean',name:'구해안',color:'#4a6378',likes:'study',
 sp:'귀상어 수인 · 맹수형',role:'전자공학과 3학년 · 22세',
 desc:'‘계산기’라는 별명의 선배. 누구에게나 존댓말, 누구에게나 욕.',
 un:'남색 니트 조끼를 입은 귀상어 수인',
 at:()=>({lecture:P.major==='elec'?.45:P.major==='comp'?.15:0, club:P.club==='robot'?.55:0, o_lab:.6, o_library:.3, j_store:.2}),
 ev:[
 {need:0,run:()=>({l:['공대 실습실 문을 열자 납땜 냄새가 훅 끼쳤다.','작업대 앞의 귀상어 수인이 고개도 돌리지 않고 말했다.','@haean|문 닫으세요. 바람 들어오면 인두 온도 떨어집니다.','돌아보지도 않았는데, 내가 들어온 걸 정확히 알고 있었다.',
   isH()?'@haean|인간 학생이네요. 등급 같은 건 관심 없습니다. 손만 안 떨면 됩니다.':''],
  c:[{t:'"죄송해요. 뭐 만드세요?"',a:8,r:['@haean|드론 개조요. 설명해 드려도 이해 못 하실 테니 그냥 보세요.','@haean|…근데 손 모양은 나쁘지 않네요. 그 집게 좀 잡아 주시죠.']},
     {t:'조용히 문을 닫고 옆에서 구경한다',a:10,r:['@haean|말 없는 분이네요. 좋습니다.','@haean|머리 나쁜 놈들은 꼭 쓸데없는 질문부터 하거든요.']},
     {t:'"인사 정도는 하셔도 되잖아요."',a:4,r:['@haean|아, 씨발. 예의 바르시네요. 구해안입니다. 됐습니까?','그런데 입꼬리가 아주 조금, 올라간 것 같았다.']}]})},
 {need:25,run:()=>({l:['밤 열한 시. 해안이 개조한 드론이 공중에서 두 바퀴 돌다가 그대로 추락했다.','@haean|씨발. 아니, 젠장. 아니다, 염병.',`@haean|${N()} 씨, 거기 수첩 좀 잡으세요. 제가 부르는 숫자 받아 적으시면 됩니다.`],

 {need:50,run:()=>({l:['북항, 밤 열 시. 해월상사 창고 앞에 도해가 서 있었다.','손가락마다 금반지를 낀 곰치 수인이 다가왔다.','@yeongcheol|심 교수님, 아니 심 경감님이라 캐야 되나. 옛날엔 같이 다루던 물건 아이가.','곰치의 처진 눈이 나에게서 멈췄다.'],

/* ===================== 렌더링 ===================== */
function addLine(raw){
  if(!raw)return;if(typeof fx==='function'&&typeof P!=='undefined'&&P&&raw.includes('{N}'))raw=fx(raw);
  const d=document.createElement('div');
  if(raw.startsWith('##')){d.className='hd';d.textContent=raw.slice(2);}
  else if(raw.startsWith('#')){d.className='sys';d.innerHTML='<span></span>';d.firstChild.textContent=raw.slice(1);}
  else if(raw.startsWith('>')){d.className='pick';d.textContent='▸ '+raw.slice(1);}
  else if(raw.startsWith('@')){
    const i=raw.indexOf('|');const id=raw.slice(1,i);const tx=raw.slice(i+1);
    const me=id==='me';const sp=me?{name:P.name,color:'#a0583c'}:(CH[id]||SP[id]||{name:id,color:'#555'});
    d.className='dl'+(me?' me':'');
    const nm=document.createElement('div');nm.className='nm';nm.textContent=sp.name;nm.style.color=sp.color;
    const t=document.createElement('div');t.className='tx';t.textContent=tx;
    d.append(nm,t);
  } else {d.className='ln';d.textContent=raw;}
  LOG.appendChild(d);
  LOG.scrollTop=LOG.scrollHeight;
}
async function say(arr){
  skipBatch=false;
  for(const raw of arr.flat()){if(!raw)continue;addLine(raw);if(!skipBatch&&!FAST)await sleep(raw.startsWith('#')?160:430);else await sleep(15);}
}
LOG.addEventListener('click',()=>{skipBatch=true;});
function choose(opts,title,compact){
  return new Promise(res=>{
    PANEL.innerHTML='';
    if(title){const t=document.createElement('div');t.className='ptitle';t.innerHTML=title;PANEL.appendChild(t);}
    const box=document.createElement('div');box.className='choices'+(compact?' compact':'');
    opts.forEach(o=>{
      const b=document.createElement('button');b.className='btn'+(o.cls?' '+o.cls:'');
      b.innerHTML=(o.ic?`<span class="ic">${o.ic}</span>`:'')+esc(o.t)+(o.sub?`<small>${esc(o.sub)}</small>`:'');
      if(o.dis){b.disabled=true;}
      b.onclick=()=>{PANEL.innerHTML='';if(!o.silent)addLine('>'+o.t);res(o);};
      box.appendChild(b);
    });
    PANEL.appendChild(box);
    requestAnimationFrame(()=>{LOG.scrollTop=LOG.scrollHeight;});
  });
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1600);}

/* ===================== 상태 변화 ===================== */
const STN={study:'학업',body:'체력',charm:'매력',stress:'스트레스',money:'돈'};
function eff(e,silent){
  const parts=[];
  for(const k of ['study','body','charm','stress']) if(e[k]){P[k]=Math.max(0,Math.min(100,P[k]+e[k]));parts.push(`${STN[k]} ${e[k]>0?'+':''}${e[k]}`);}
  if(e.money){P.money+=e.money;parts.push(`돈 ${e.money>0?'+':''}${e.money}만`);}
  if(e.aff) for(const id in e.aff){const v=e.aff[id];P.aff[id]=Math.max(0,Math.min(100,(P.aff[id]||0)+v));parts.push(`${CH[id].name} ♥${v>=0?'+':''}${v}`);}
  hud();
  if(!silent&&parts.length)addLine('#'+parts.join(' · '));
}
function hud(){
  $('#hud').style.display='';
  $('#when').textContent=`${({s1:'🌱',s2:'🌸',s3:'☔',a1:'🍃',a2:'🍂',a3:'❄️'})[subSeason()]} ${P.year}학년 ${P.sem}학기 · ${P.week>8?'방학':P.week+'주차'}`;
  $('#who').textContent=`${P.name} · ${spLabel()} · ${MAJORS[P.major].n}`;
  $('#money').textContent=`₩ ${P.money}만`;
  $('#money').style.color=P.money<0?'#ff9b8a':'';
  $('#stats').innerHTML=['study','body','charm','stress'].map(k=>`<div class="st ${k}">${STN[k]}<b>${P[k]}</b><div class="bar"><i style="width:${P[k]}%"></i></div></div>`).join('');
}
function spLabel(){
  if(isH())return '인간(3등급)';

/* ===================== 메인 루프 ===================== */
async function run(){
  while(true){
    if(P.year>4){await graduation();return;}
    if(P.week===1&&!P.flags['start'+P.year+P.sem])await semStart();
    hud();
    if(P.flags.sick){P.flags.sick=0;await say([`##${P.year}학년 ${P.sem}학기 ${P.week}주차`,'몸살이 났다. 일주일 내내 기숙사에서 앓았다.']);eff({stress:-30});}
    else{
      if(P.week===4&&!P.flags['world'+P.year+P.sem])await worldEvent();
      const act=await chooseAction();
      await doAction(act);
    }
    await upkeep();
    P.week++;
    if(P.week>8){await semEnd();P.week=1;P.sem++;if(P.sem>2){P.sem=1;P.year++;}}
    save();
  }
}
async function semStart(){
  P.flags['start'+P.year+P.sem]=1;
  const tu=isH()?30:isM()?45:60;
  await say([`##${P.year}학년 ${P.sem}학기`,P.sem===1?'벚꽃이 바다 쪽으로 흩날렸다.':'바닷바람이 서늘해졌다.',
   isH()?`등록금 ${tu}만 원 납부. 해방 장학금이 절반을 덮어 주었다.`:isM()?`등록금 ${tu}만 원 납부. 혼혈 학생 감면이 조금 붙었다.`:`등록금 ${tu}만 원 납부. 수인 학생은 감면이 없다.`]);
  eff({money:-tu});
  if(P.money<0)await say([`#학자금 대출 안내 문자가 왔다. 잔액 −${-P.money}만 원. 적응지원센터 근로장학과 복희네 국밥집은 빚 있는 학생에게 시급을 더 쳐준다.`]);
}
async function worldEvent(){
  P.flags['world'+P.year+P.sem]=1;
  let idx=[...Array(WORLD.length).keys()].filter(i=>!P.worldUsed.includes(i));
  if(!idx.length){P.worldUsed=[];idx=[...Array(WORLD.length).keys()];}
  const i=pick(idx);P.worldUsed.push(i);
  const w=WORLD[i]();await say(['##이번 주 소식',...w.l]);eff(w.e);
}

  const wk=`<span>${P.year}학년 ${P.sem}학기 ${P.week}주차 — 이번 주에는?</span><span>${P.stress>=70?'⚠ 스트레스 높음':''}</span>`;
  while(true){

async function meet(c,pl){

  const o=await choose([{t:met?`${c.name}에게 말을 건다`:'말을 걸어 본다',k:1},{t:'그냥 지나친다',k:0}]);
  if(!o.k){await say(['못 본 척 지나쳤다.']);return;}
  const st=P.stage[c.id]||0,a=P.aff[c.id]||0;
  if(st<c.ev.length&&a>=c.ev[st].need){
    const ev=c.ev[st].run(pl);
    await say(ev.l);
    const opts=ev.c.map(ch=>{let dis=false,sub='';if(ch.req)for(const k in ch.req)if(P[k]<ch.req[k]){dis=true;sub=`${STN[k]} ${ch.req[k]} 필요`;}return {...ch,dis,sub:sub||undefined};});
    const ch=await choose(opts);

    const e={...(ch.s||{}),aff:{[c.id]:ch.a}};if(ch.m)e.money=ch.m;
    eff(e);
    P.stage[c.id]=st+1;
    if(st===0){P.log.met++;toast(`${c.name} — 인물 목록에 추가됨`);}
  } else {
    const all=c.chat();const i=(P.ci[c.id]||0)%all.length;P.ci[c.id]=i+1;
    await say(all[i]);
    let g=rnd(3,5);if(P[c.likes]>=50)g+=2;
    eff({aff:{[c.id]:g},stress:-2});
  }
}

 end:()=>['폐탑 꼭대기에 둥지가 하나 더 생겼다. 담요와 쿠션이 산처럼 쌓인.','남지광은 여전히 숲에서 잃어버린 사람들을 찾았다. 찾은 사람은 전부 집으로 돌려보냈다.','폭우가 오는 날이면 그는 날개로 나를 덮고 하루 종일 탑에 있었다. 그런 날을 그는 제일 좋아했다.']},

 {need:25,run:()=>({l:['열람실. 성애가 경제학 과제를 펴 놓고 계산기도 없이 숫자를 채우고 있었다.','@seongae|이거요? 금방 해요. 숫자는 쉬워요. 오래 하는 게 힘들 뿐이지.','@seongae|…배고파서 머리가 안 돌아가네요.'],

 {need:50,run:()=>({l:['@seongae|있잖아요. 기관에서는 왜 그래야 하냐고 묻는 게 금지였어요.','@seongae|근데 속으로는 계속 물었어요. 왜 그래야 하지. 왜 우리가.','@seongae|해방되고 처음으로 소리 내서 물어본 게 경제학 수업이었어요. ‘최저임금은 왜 종족마다 달라요?’',isB()?'그녀가 내 귀를 보고, 아주 약하게 웃었다.':'그녀가 아주 약하게 웃었다.'],

 {need:25,run:()=>({l:['야간 응급실 휴게실. 태제한이 오른쪽 손목을 주무르고 있었다. 오래된 흉터가 보였다.','@jehan|오래 수술하면 저려. 스물넷에 붕괴 현장에서 다친 거야.','@jehan|매몰된 수인 꺼내다가. 꺼냈어. 그건 잘했지.'],
  c:[{t:'따뜻한 수건을 가져다준다',a:15,r:['@jehan|…따뜻하고 축축한 거 좋아하는 거 어떻게 알았어.','@jehan|귀찮게 생겼네, 너.','그 말을 하는 그의 꼬리가 아주 천천히 흔들렸다.']},

 {need:50,run:()=>({l:['구급차가 들어왔다. 인간 환자였다. 다른 의사가 수인 환자부터 보라고 소리쳤다.','태제한은 대답 없이 인간 환자의 침대를 끌었다.','@jehan|순서는 중증도로 정해. 종족으로 안 정해. 몇 번을 말해, 씨발.','수술은 4시간 걸렸다. 그가 나왔을 때, 나는 아직 복도에 있었다.'],

 {need:50,run:()=>({l:['@haeseong|어머니께 연락이 왔습니다. 조류형 수인 댁에서 봉제 일을 하세요. 해방 후에도 그 집에 남으셨습니다.','@haeseong|저는 그게 이해가 안 됐습니다. 근데 지금은 조금 압니다. 익숙한 곳에 있고 싶은 마음.','그가 나를 봤다. 웃음선이 아주 약하게 그려졌다. 이번엔 감정이 있는 것 같았다.'],

  c:[{t:'"반가워. 반말해도 돼."',a:10,r:['@yuhong|헉, 진짜요? 아니, 진짜? …아, 어렵다. 그냥 존댓말 할래요. 이게 편해서.','꼬리가 더 빠르게 흔들렸다.']},
     {t:'펜을 빌려준다',a:12,r:['@yuhong|천사다…','그는 펜을 수업 내내 소중하게 쥐고 있다가, 끝나고 깨끗이 닦아서 돌려줬다.']},
     {t:'"꼬리가 의자 쳐요."',a:6,r:['@yuhong|앗, 죄송해요!','그가 꼬리를 두 손으로 붙잡았다. 꼬리는 손 안에서도 계속 흔들렸다.']}]})},
 {need:25,run:()=>({l:['학생식당. 유홍이 아빠가 싸 준 도시락을 열었다. 빈틈없이 정리된 반찬이었다.','@yuhong|아빠가 요리를 엄청 잘하세요. 근데 저는 집안일 하면 맨날 뭘 깨요.','@yuhong|아빠는 회장님 비서라 바쁘셔서… 집에선 둘뿐이라 좀 외로워요. 헤헤.'],
  c:[{t:'반찬을 나눠 먹는다',a:12,r:['@yuhong|맛있죠? 우리 아빠 최고죠?','그가 코끝을 내 소매에 살짝 비볐다. 친해졌다는 표시 같았다.']},
     {t:'"외로우면 연락해."',a:15,r:['귀가 쫑긋 서더니, 그가 팔을 활짝 벌렸다.','@yuhong|안아도 돼요? 아, 물어보고 안는 거 맞죠?']},
     {t:'"아빠랑 사이 좋네."',a:8,r:['@yuhong|좋아요! 근데 아빠가 저한테도 존댓말 써요. 유홍 씨, 이러면서. 웃기죠?']}]})},
 {need:50,run:()=>({l:['유홍이 오늘따라 조용했다. 꼬리가 바닥에 처져 있었다.','@yuhong|과제 망쳤어요. 교수님한테 혼났어요.','눈도 못 마주치고 작은 소리로 말했다.'],
  c:[{t:'꼭 안아 준다',a:15,r:['그가 품에 파고들었다. 덩치는 나보다 훨씬 큰데.','@yuhong|…이러면 금방 괜찮아져요. 진짜로.','꼬리가 천천히, 다시 흔들리기 시작했다.']},
     {t:'과제를 같이 다시 한다',req:{study:40},a:15,r:['@yuhong|다시 하니까 되네요! 같이 하니까!','그가 감격해서 작게 으르렁거렸다. 놀라거나 기쁠 때 나오는 소리라고 했다.']},
     {t:'"다음엔 잘하면 돼."',a:8,r:['@yuhong|…네. 다음엔 꼭이요.']}]})}],
 chat:()=>[['@yuhong|오늘 점심 같이 먹어요! 같이 먹어 줄 거죠?'],['유홍이 멀리서 나를 발견하고 꼬리부터 흔들었다. 얼굴보다 꼬리가 먼저 웃는 사람이었다.'],['@yuhong|아빠가 주말에 집에 데려오래요. 아빠 앞에선 좀 무서울 수도 있어요. 존댓말 엄청 쓰시거든요.']],
 cf:()=>['졸업식 날, 유홍이 꽃다발을 두 개 들고 뛰어왔다. 하나는 내 거였다.','@yuhong|저 많이 생각했어요. 사랑받고 싶으면 내가 먼저 노력해야 된다고. 그래서 4년 동안 노력했어요.','@yuhong|좋아해요. 엄청요.','@yuhong|…안아도 돼요? 이번엔 대답 안 기다릴래요.'],
 end:()=>['유홍은 레오스 그룹에 입사했다. 여전히 존댓말을 썼고, 여전히 꼬리가 먼저 웃었다.','하치열은 주말마다 셋 몫의 밥을 차렸다. “유홍 씨, 그릇은 제가 옮기겠습니다.”','유홍은 가끔 아직도 그릇을 깼다. 그럴 때마다 둘이 같이 치웠다.']},

 ev:[
 {need:0,run:()=>({l:['누군가 내 어깨를 붙잡았다. 셔츠 단추를 두세 개 풀어헤친 검은 사자 수인이었다. 허리에 권총집이 보였다.','@jeil|여기 학생이 올 데 아닌데. 뭐 잃어버렸어?','그가 웃었다. 나른한 웃음인데, 눈은 웃지 않았다.'],
  c:[{t:'"그냥 지나가던 길이에요."',a:6,r:['@jeil|그래? 그럼 계속 지나가. 큰길까지.','@jeil|…데려다줄게. 귀찮게 하지 말고.']},
     {t:'"형사님이세요?"',a:10,r:['@jeil|어떻게 알았어. 총 때문에? 아니면 내 얼굴이 정의롭게 생겨서?','@jeil|농담이야. 정의 같은 거 별로 안 믿어. 결과만 믿지.']},
     {t:'순순히 따라 나온다',a:12,r:['@jeil|말 잘 듣네. 마음에 든다.','큰길에 도착하자 그가 하품을 했다.','@jeil|다음엔 낮에 와. 밤엔 사람 사라지는 동네야, 씨발.']}]})},
 {need:25,run:()=>({l:['특강이 끝나고, 태제일이 강단에서 내려와 나를 불렀다.','@jeil|너 그때 그 학생이지. 기억력은 좋아, 나.','@jeil|커피 사 줄게. 질문 있으면 해. 없으면 내가 할게.'],
  c:[{t:'"인간 구조하는 일, 힘들어요?"',a:12,r:['그가 잠시 말이 없었다.','@jeil|구하는 건 쉬워. 구한 다음이 어렵지.','@jeil|구해 놓고 보면 갈 데가 없거든. 그 구조를 만든 게 나 같은 수인이고. …그게 좀, 엿 같지.']},
     {t:'"형제가 있어요?"',a:10,r:['@jeil|형 하나, 동생 하나. 형은 교육관, 동생은 의사. 우리 집은 가족이라기보단 경쟁자야.','@jeil|그래도 동생한텐 다친 애 맡겨. 걘 잘 고치거든.']},
     {t:'커피만 조용히 마신다',a:8,r:['@jeil|말 없는 것도 좋네. 편해.']}]})},
 {need:50,run:()=>({l:['비 오는 날. 태제일이 오른쪽 어깨를 붙잡고 벤치에 앉아 있었다.','@jeil|오래된 상처야. 비 오면 쑤셔.','@jeil|…너 우산 없지? 이리 와. 사자 갈기, 생각보다 비 잘 막아.'],
  c:[{t:'옆에 붙어 앉는다',a:15,r:['그의 체온이 높았다. 꼬리가 느리게 내 다리를 감았다.','@jeil|이러면 좀 덜 아프네. 이상하게.']},
     {t:'어깨를 주물러 준다',a:12,r:['@jeil|어, 거기. 시원하다, 씨발.','그가 눈을 감고 웃었다. 이번엔 눈도 같이 웃었다.']},
     {t:'우산을 사 온다',a:8,r:['@jeil|착하네. 근데 난 붙어 있는 게 더 좋았는데.']}]})}],
 chat:()=>[['@jeil|또 보네. 우연이야, 아니면 나 따라다니는 거야? 둘 다 괜찮아.'],['태제일이 순찰차에 기대 하품을 하고 있었다. 나를 보자 입꼬리만 비틀어 올렸다.'],['@jeil|밥 먹었어? 형사는 아무 때나 먹어. 같이 먹어 줘.']],
 cf:()=>['졸업식 날, 태제일이 순찰차를 정문에 대 놓고 기다리고 있었다.','@jeil|나 욕심나면 양심 없어지는 거 알아. 그래서 4년 참았어. 졸업할 때까지는.','@jeil|이제 졸업했지?','@jeil|…내 옆에 있어. 그 말이 제일 맞겠다.'],
 end:()=>['태제일은 여전히 강력계에 있었다. 구한 사람들이 갈 데가 없으면, 같이 갈 데를 찾았다.','비 오는 날이면 그는 일찍 퇴근했다. 어깨가 쑤신다는 핑계였다.','핑계라는 걸 둘 다 알았다.']},

 {need:25,run:()=>({l:['어두운 복도. 현창오가 문 앞에 서 있었다. 그의 사람들이 나를 막으려 하자 그가 짧게 말했다.','@changoh|비켜.','@changoh|…놀라셨죠. 저 사람들한테는 이렇게 말해야 합니다. 당신한테는 안 그럴 겁니다.'],
  c:[{t:'"무슨 일 하세요?"',a:8,r:['@changoh|진실은 무기가 아니라 짐입니다. 모르시는 게 좋아요.','@changoh|당신한테 그 짐을 지우고 싶지 않습니다.']},
     {t:'"외로워 보여요."',a:15,r:['그의 꼬리가 멈췄다.','@changoh|…오래 계산하고서야 말하는 편인데, 당신 앞에선 계산이 안 됩니다.','@changoh|맞아요. 외롭습니다.']},
     {t:'고개만 숙이고 지나간다',a:5,r:['@changoh|…그래요. 그게 현명합니다.']}]})},
 {need:50,run:()=>({l:['새벽, 북항 뒷골목. 현창오가 나를 골목 안쪽으로 끌어당겼다. 바로 옆으로 단속반 차량이 지나갔다.','@changoh|오늘 밤 이쪽엔 오지 마세요. …아무것도 아닙니다.','@changoh|제 부모 중 한 분은 인간이었습니다. 아무한테도 말한 적 없어요.'],
  c:[{t:'"그럼 왜 이런 일을 해요?"',a:10,r:['@changoh|힘과 돈이 없으면 혼혈은 보호막이 없으니까요. 부모님이 돌아가신 날 배웠습니다.','@changoh|…당신이 그렇게 물으면, 대답할 말이 없어지네요.']},
     {t:'말없이 그의 손을 잡는다',a:15,r:['재규어의 큰 손이 떨렸다.','@changoh|이 손은 깨끗하지 않습니다.','@changoh|…그래도 놓지 말아 주세요.']},
     {t:'"그만두면 안 돼요?"',a:12,r:['@changoh|…생각해 보겠습니다. 오래 계산해 보고.','그는 정말로 그날 밤 경매장에 가지 않았다.']}]})}],
 chat:()=>[['@changoh|밥은 드셨습니까. 안 드셨으면… 아닙니다. 드셨겠죠.'],['멀리서 현창오가 나를 보고 있었다. 다가오지는 않았다. 내가 큰길로 나갈 때까지 그 자리에 있었다.'],['@changoh|담배는 당신 앞에선 안 피웁니다. 집에서도 안 피우고요. 당신이 있는 곳은 다 집 같아서.']],

 end:()=>['현창오는 작은 경호 회사를 차렸다. 합법적인 일만 받는다고, 몇 번이고 강조했다.','밤마다 둘이 산책을 했다. 그는 여전히 큰길로만 다녔다.','어느 날 그가 오래된 사진 한 장을 보여 주었다. 인간 어머니와 어린 재규어. “당신한테 처음 보여 주는 겁니다.”']},

/* ---- 조우 ---- */
async function encounter(pl){
  ensure();
  const cands=Object.values(CH).filter(c=>{const p=c.at()[pl]||0;return p>0&&Math.random()<p;}).sort(()=>Math.random()-.5);
  if(cands.length>=2){
    const g=cands.slice(0,3);
    const hot=g.filter(c=>met(c)&&(P.aff[c.id]||0)>=40);
    if(hot.length>=2&&Math.random()<.45)return rival(hot[0],hot[1]);
    return meetGroup(g,pl);
  }
  if(cands.length===1)return meet(cands[0],pl);
  const sups=SUPS.filter(s=>s.at.includes(pl)&&(!s.cond||s.cond()));
  if(sups.length&&Math.random()<.5)return pick(sups).run();
  if(pl==='o_alley'&&!isB()&&Math.random()<.25){await say(['골목 끝에서 수인 몇이 길을 막았다. 지갑을 내주고 나서야 지나갈 수 있었다.']);eff({money:-5,stress:8});return;}
  await say([pick(['별다른 일은 없었다.','아는 얼굴은 보이지 않았다.','조용한 한 주였다.'])]);
}
async function meet(c,pl){
  await say([met(c)?`${J(c.name,'이','가')} 보인다.`:`${J(c.un,'이','가')} 보인다.`]);
  const o=await choose([{t:met(c)?`${c.name}에게 말을 건다`:'말을 걸어 본다',k:1},{t:'그냥 지나친다',k:0}]);
  if(!o.k){await say(['못 본 척 지나쳤다.']);return;}
  return talk(c,pl);
}
async function meetGroup(g,pl){
  const desc=g.map(c=>met(c)?c.name:c.un);
  await say([`${desc.slice(0,-1).join(', ')}${desc.length>2?',':''} 그리고 ${J(desc[desc.length-1],'이','가')} 함께 있다.`]);
  const metG=g.filter(met);
  const opts=g.map(c=>({t:met(c)?`${c.name}에게 말을 건다`:`처음 보는 쪽에게 말을 걸어 본다`,sub:met(c)?undefined:c.un,k:c.id}));
  if(metG.length>=2)opts.push({t:'다 같이 어울린다',sub:'모두의 호감도가 조금씩 오른다',k:'all'});
  opts.push({t:'그냥 지나친다',k:0});
  const o=await choose(opts);
  if(o.k===0){await say(['인사만 하고 지나쳤다.']);return;}
  if(o.k==='all'){
    const lines=[pick(GROUP[pl]||GROUP.default)];
    metG.forEach(c=>{
      if((isLover(c.id)||(P.aff[c.id]||0)>=60)&&Math.random()<.5)lines.push(loveLine(c));
      else{const all=c.chat();const e=pick(all.slice(0,Math.min(tierOf(P.aff[c.id]||0),all.length-1)+1));lines.push(e.find(x=>x.startsWith('@'))||e[0]);}
    });
    g.filter(c=>!met(c)).forEach(c=>lines.push(`${J(c.un,'도','도')} 슬쩍 끼어 있었다. 이름은 아직 모른다.`));
    await say(lines);
    const af={};metG.forEach(c=>af[c.id]=rnd(3,4)+(isLover(c.id)?1:0));
    eff({aff:af,stress:-7});P.log.groups=(P.log.groups||0)+1;return;
  }
  return talk(CH[o.k],pl);
}

/* ---- 대화 ---- */
async function talk(c,pl){
  ensure();
  const st=P.stage[c.id]||0,a=P.aff[c.id]||0;
  if(st<c.ev.length&&a>=c.ev[st].need)return runEvent(c,pl,st);
  if(!isLover(c.id)&&st>=c.ev.length&&a>=75&&wkAbs()>=(P.flags['cf_'+c.id]||0))return midConfess(c);
  const ak='ask_'+c.id+'_'+P.year+P.sem;
  if(a>=45&&!P.flags[ak]&&Math.random()<.35){P.flags[ak]=1;return dateInvite(c);}
  return chatTalk(c,pl);
}
async function runEvent(c,pl,st){
  const ev=c.ev[st].run(pl);
  await say(ev.l);
  const opts=ev.c.map(ch=>{let dis=false,sub='';if(ch.req)for(const k in ch.req)if(P[k]<ch.req[k]){dis=true;sub=`${STN[k]} ${ch.req[k]} 필요`;}return {...ch,dis,sub:sub||undefined};});
  const ch=await choose(opts);
  await say(ch.r);
  const e={...(ch.s||{}),aff:{[c.id]:ch.a}};if(ch.m)e.money=ch.m;
  eff(e);
  P.stage[c.id]=st+1;
  if(st===0){P.log.met=(P.log.met||0)+1;toast(`${c.name} — 인물 목록에 추가됨`);}
}
async function chatTalk(c){
  const a=P.aff[c.id]||0,all=c.chat();
  if((isLover(c.id)||a>=60)&&X[c.id]&&Math.random()<.45){

function endCard(ps,L){
  const tag=[L.debt?(L.broke?'빈손으로':'빚과 함께'):'',L.burn?'쉬어 간 생':''].filter(Boolean);
  const key=(ps&&ps.length?ps.map(c=>c.id).sort().join('+'):'solo')+(tag.length?'#'+tag.join('#'):'');
  let got=[];try{got=JSON.parse(localStorage.getItem(ENDKEY)||'[]');}catch(e){}
  if(!got.includes(key))got.push(key);try{localStorage.setItem(ENDKEY,JSON.stringify(got));}catch(e){}
  const dt=new Date();const date=`${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
  const data={key,date,title:(ps&&ps.length?joinNames(ps)+' 엔딩':'홀로 걷는 엔딩')+(tag.length?' — '+tag.join(' · '):''),sub:L.broke?'헤어짐':ps&&ps.length?'함께한 생':'나의 길',
    rows:[['이름',P.name],['종족',spLabel()],['전공',MAJORS[P.major].n],['졸업 후',[L.job,L.married,...L.kids.map(k=>k.nm+'('+k.sp+')')].filter(Boolean).join(' · ')||'-'],
      ['데이트 / 여행 / 신경전',`${P.log.dates||0} / ${P.log.trips||0} / ${P.log.rivals||0}`],['재학 중 연인',(P.lovers||[]).map(id=>CH[id].name).join(', ')||'-']],
    ranks:Object.entries(P.aff).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>[CH[k].name,v])};
  saveEndCard(data);
  const d=document.createElement('div');d.className='end';
  d.innerHTML=endCardHTML(data,got.length);
  LOG.appendChild(d);LOG.scrollTop=LOG.scrollHeight;
  clearSave();
  choose([{t:'새 학번으로 다시 입학하기',k:1,cls:'main',silent:1}]).then(()=>location.reload());
}

  j_bar:[['침향 카운터. 상윤이 비싼 양주를 시켜 놓고는 손도 안 대고 있었다. 얼굴은 이미 빨갰다. 맥주 두 잔 마신 거였다.','@sangyun|어? 너 여기서 일해? …이 술은 그냥 장식이야. 묻지 마.']],
  j_port:[['북항 하역장 근처. 상윤이 순찰하듯 골목을 둘러보고 있었다. 표정이 평소보다 딱딱했다.','@sangyun|…여기 오래 있지 마. 이 동네, 내가 좀 알거든.']],
  lecture:[['강의실 뒷자리. 상윤이 다리를 꼬고 앉아 수업 대신 휴대폰으로 오토바이 부품을 보고 있었다.','@sangyun|쉿. 교수님한텐 비밀. 아, 너 필기했지? 나중에 좀 보여 줘.']],
  club:[['복싱부. 상윤이 신입생들 앞에서 시범을 보이다 나를 보고 윙크했다.','@sangyun|자, 다들 봐. 이게 에이스의 자세야. …꼬맹이 너도 와서 봐.']]},
 t:{food:['밥? 나 하루 다섯 끼 먹어. 지금 네 번째 끼니 찾는 중이었어.','근데 너 먹는 거 보면 나 배불러. 이상하지? 아니다, 그래도 먹긴 먹을 거야.'],
  work:['요즘? 에이스로서 바쁘지. 체육대회 계주, 복싱부 시범, 오토바이 정비.','…사실 서울에서 연락 왔었어. 형한테서. 안 받았어. 받을 이유가 없으니까.'],
  worry:['고민? 나한테? 내가 고민할 게 뭐가 있어. 잘생겼지, 잘하지.','…무시당하는 게 싫어. 그거 하나. 근데 너는 날 무시 안 하더라. 그래서 편해.'],
  hobby:['오토바이. 새벽에 해안도로 달리는 거. 그거 하나면 다 풀려.','다음엔 너 태워 줄게. 진짜로. 헬멧은… 하나 더 사지 뭐.'],
  tease:['어쭈, 지금 나 놀려? 귀엽네.','아 미안미안, 화났어? …아니라고? 그럼 다행이고. 대신 육포 하나 줄게.'],
  praise:['그치? 내가 말했잖아. 나 원래 잘해.','…야, 그런 말 진지하게 하면 어떡해. 할 말이 없어지잖아.']},
 c:['어, 뭐야. 가까이 오네? 너 은근 대담하다?','…야. 너 가까이 오면 심장 소리 다 들려. 네 거 말고, 내 거.']},

gangsik:{o:{
  o_cafe:[['학생식당. 사강식 앞에 식판 다섯 개가 탑처럼 쌓여 있었다. 전부 비어 있었다. 그가 여섯 번째를 받으러 일어나다 나를 봤다.','@gangsik|{N} 씨. 같이 드시겠습니까. 제가 받아 오겠습니다. 몇 인분 드십니까.'],
          ['식당 줄. 강식이 하나뿐인 흰 셔츠를 입고 줄 맨 앞에 서 있었다. 내가 들어오자 그가 망설임 없이 내 자리까지 걸어와 뒤에 섰다.','@gangsik|줄을 다시 섰습니다. {N} 씨 뒤가 좋습니다.']],
  j_gukbap:[['복희네 국밥집. 강식이 동생들 이야기를 하며 국밥을 비우고 있었다. 할머니가 혀를 찼다.','@bokhui|이 총각은 우리 집 쌀독 거덜 낼 끼다.','@gangsik|죄송합니다. 그래도 맛있습니다.']],
  o_gym:[['체육관. 강식이 아무 표정 없이 철문 경첩을 맨손으로 고치고 있었다. 관리실에서 부탁했다고 했다.','@gangsik|문은 경첩부터입니다. 이것은 진리입니다.']],
  o_range:[['사격장 대기석. 강식이 귀마개를 거꾸로 끼고 있었다.','@gangsik|이렇게 껴도 들립니다. 문제없습니다. …거꾸로였습니까. 감사합니다.']],
  lecture:[['경찰행정 수업. 교수가 “범인을 문 앞에서 기다려라”라고 하자, 강식이 진지하게 손을 들었다.','@gangsik|질문 있습니다. 몇 시간 기다리면 됩니까?','강의실이 웃음바다가 됐다. 강식은 왜 웃는지 모르는 얼굴로 나를 돌아봤다.']],
  club:[['동아리방. 강식이 샌드백을 너무 세게 쳐서 체인이 끊어져 있었다.','@gangsik|부쉈습니다. 보고하겠습니다. 그리고 {N} 씨, 오늘도 좋아합니다.']]},
 t:{food:['네. 먹었습니다. 여섯 인분입니다. 아직 배는 반쯤 찼습니다.','동생이 넷입니다. 어릴 때부터 밥을 한 솥씩 했습니다. {N} 씨 몫도 할 수 있습니다. 하겠습니다.'],
  work:['요즘은 문 여는 연습을 합니다. 잠긴 문을 가장 빨리 여는 게 목표입니다.','두 번째 목표는 {N} 씨와 사귀는 것입니다. 이건 매주 말씀드리고 있습니다.'],
  worry:['고민 없습니다. 아, 하나 있습니다. 농담을 못 알아듣습니다.','{N} 씨가 웃을 때 왜 웃는지 알고 싶습니다. 같이 웃고 싶어서입니다.'],
  hobby:['밥 짓기입니다. 그리고 문 열기입니다.','{N} 씨가 하는 말을 수첩에 적는 것도 있습니다. 잊지 않으려고 합니다. 하나도.'],
  tease:['…그것은 농담입니까?','농담이었군요! 하하하하! 이번엔 알아들었습니다. 연습한 보람이 있습니다.'],
  praise:['감사합니다. 칭찬을 받으면 기분이 좋습니다. 솔직히 말씀드립니다.','{N} 씨에게 받는 칭찬이 가장 좋습니다. 이유는 좋아하기 때문입니다.']},
 c:['가까이 오셨습니다. 좋습니다. 저는 피하지 않습니다.','심장이 빨리 뜁니다. 숨기지 않겠습니다. {N} 씨 때문입니다.']},

dohae:{o:{
  o_coast:[['방파제 끝. 도해가 낚싯대를 드리운 채 담배를 비벼 끄고 있었다. 양동이는 비어 있었다.','@dohae|왔나. 오늘은 고기가 내 얼굴 보고 도망간다. 니 얼굴 보면 올라올랑가.'],
           ['비 오는 밤바다. 도해가 우산도 없이 방파제에 서 있었다. 은색 눈이 어둠 속에서 청록빛으로 번뜩였다.','@dohae|비 오는 밤바다가 젤 좋다. 니도 와 봐라. 젖어도 된다.']],
  j_gukbap:[['복희네 구석 자리. 도해가 오징어 숙회를 앞에 두고 소주를 비우고 있었다. 할머니가 그의 그릇에 밥을 더 얹었다.','@dohae|할매, 내 이제 마흔다섯이다. …마, 앉아라. 이거 묵어라.']],
  j_port:[['북항 하역장. 도해가 컨테이너 번호를 하나하나 눈으로 훑고 있었다. 뭔가를 세는 사람처럼.','@dohae|여 와서 뭐 하노. …알바? 퍼뜩 하고 들어가라. 밤엔 여기 니 같은 거 오는 데 아이다.']],
  lecture:[['해양안전 수업. 도해가 칠판에 표준어로 적다가 중간부터 사투리로 바꿔 버렸다.','@dohae|…마, 다들 알아들었제? 시험엔 표준어로 써라.']]},
 t:{food:['묵었다. 숙회에 소주. 니는? 밥은 묵고 다니나?','…요새 어데서 자노. 아이다, 그냥 물어본 기다. 니 안 굶으면 됐다.'],
  work:['수업하고, 낚시하고. 겸임이 다 그렇다. 월급은 쥐꼬리고.','옛날 일 하던 버릇이 남아서, 항구 지나가면 컨테이너 숫자부터 센다. 안 좋은 버릇이다.'],
  worry:['고민? 연금. 정년까지 안 잘리고 버티는 거.','…그라고 니. 니가 요새 내 고민이다. 웃지 마라, 진담이다. 아이다, 농담이다. 니 알아서 들어라.'],
  hobby:['낚시. 혼자 배 빌려서 먼바다 나가는 거.','은퇴하면 내 배 하나 살 끼다. 그때 되면… 니도 한 번 태워 주꾸마.'],
  tease:['마, 니 지금 내 놀리나? 간이 배 밖에 나왔네.','하하. 니 같은 거 옛날 같으면… 아이다. 그냥 웃자.'],
  praise:['칭찬은 고마 해라. 내 그런 거 안 어울린다.','…그래도 기분은 나쁘지 않네. 니한테 들으니까.']},
 c:['마, 너무 붙지 마라. 내 덩치에 니 깔린다.','…니 거기 서 있어라. 내 옆에. 딴 데 가지 말고.']},

gihyeon:{o:{
  j_bar:[['침향 21층. 기현이 바 안쪽에서 새로 들어온 위스키 라벨을 확인하고 있었다. 혀끝이 잠깐 나왔다 들어갔다.','@gihyeon|왔어. 오늘 위층 손님이 많아. 넌 내 뒤에 있으면 돼.'],
         ['마감 후의 침향. 기현이 창가 난방기 앞에 앉아 있었다. 변온동물이라 밤에는 몸이 굳는다고 했다.','@gihyeon|이리 와. 따뜻한 데 앉아. 오늘 수익표는 나중에 보자.']],
  lecture:[['호텔경영학과 특강. 강단에 선 기현이 원가 구조를 설명하다가 나와 눈이 마주쳤다. 말이 아주 잠깐 멈췄다.','@gihyeon|…다음 슬라이드. 질문은 끝나고 받을게. 너는 따로.']],
  o_coast:[['한낮의 방파제. 기현이 수트 재킷을 벗어 두고 볕에 앉아 있었다. 비늘이 햇빛에 흑녹색으로 빛났다.','@gihyeon|볕 좋다. 이리 와. 데워 줄게. 아니, 네가 날 데워 주는 건가.']]},
 t:{food:['먹었어. 덜 익힌 고기로 4인분. 너는? 접시 위에 제일 좋은 부위는 네 거야.','디저트는 안 먹어. 근데 네가 먹는 건 구경하고 싶어. 접시째.'],
  work:['기산이랑 1달씩 번갈아 바를 맡아. 이번 달은 내 차례. 수익표 보면 재밌어.','기산이는 발로 뛰고 나는 머리로 이겨. …근데 요즘은 네가 있는 달이 수익이 더 좋더라.'],
  worry:['고민 같은 건 오래 안 해. 손해면 잘라 내니까.','…잘라 내지 못하는 게 하나 생겼어. 그게 고민이라면 고민이지.'],
  hobby:['일광욕. 온욕. 수익표 보기. 순서는 그날 기분대로.','네 목덜미 근처에서 냄새 맡는 것도 추가할까. …농담 아닌데.'],
  tease:['그래? 재밌네. 계속 해 봐.','…삼키고 싶네. 장난칠 때 표정이.'],
  praise:['고마워. 거짓말 안 하는 얼굴이라 더 고맙네.','칭찬은 행동으로 갚을게. 볕 좋은 자리 하나 비워 둘게, 늘.']},
 c:['천천히 와. 난 기다리는 거 잘하니까.','그 거리, 좋다. 이제 한 걸음만 더. …아니다. 그냥 내가 갈게.']},

gisan:{o:{
  j_bar:[['침향 21층 무대 앞 카운터. 기산이 셰이커를 신나게 흔들다가 나를 보고 꼬리로 바닥을 탁탁 쳤다.','@gisan|우리 막내 왔다~ 앉아 앉아. 오늘 신메뉴 있어. 무알콜로.'],
         ['무대 조명이 바뀌었다. 기산이 사다리 위에서 조명을 직접 손보고 있었다.','@gisan|어때? 저번보다 예쁘지? 노래인형 얼굴 잘 보이게 바꿨어.']],
  lecture:[['호텔경영학과 강의실. 기산이 맨 앞자리에서 꾸벅꾸벅 졸다가 내가 들어오자 눈을 번쩍 떴다.','@gisan|아, 막내! 여기 앉아. 아침엔 내가 몸이 안 풀려서. 체온이 낮거든.']],
  o_cafe:[['학생식당. 기산이 디저트만 세 개를 쌓아 놓고 있었다. 내 디저트에도 이미 포크가 와 있었다.','@gisan|한 입만~ 아, 이미 먹었네. 미안. 대신 내 거 다 먹어.']],
  o_coast:[['방파제 위. 기산이 오토바이 뒷자리를 손바닥으로 두드리며 웃고 있었다.','@gisan|타. 바다 보러 가자. 아, 여기가 바다구나. 그럼 더 먼 바다.']]},
 t:{food:['나? 4인분 몰아 먹고 이틀 굶는 코모도식 식단~','근데 네 거 뺏어 먹는 게 제일 맛있어. 단 거면 더.'],
  work:['형이랑 매출 내기 중이야. 이번 달은 무조건 내가 이겨.','형은 머리로 이기려고 하잖아. 근데 술은 발로 파는 거야. …너도 응원해 줄 거지?'],
  worry:['고민? 지루한 거. 같은 자리에 오래 있으면 미칠 것 같아.','…근데 너랑 있으면 오래 앉아 있어도 안 지루해. 그게 좀 신기해.'],
  hobby:['수영! 칵테일 개발! 형 도발하기!','그리고 너 뒤에서 끌어안기… 아직 안 해 봤으니까 취미 예정.'],
  tease:['오, 화났다? 아니, 장난이야? 귀엽네~','우리 막내 큰일 났네. 장난도 귀엽게 치네.'],
  praise:['그치그치? 나 좀 멋있지?','…야, 진지하게 그러면 나 얼굴 다 드러나잖아. 나 감정 숨기는 거 못 한다고.']},
 c:['오~ 다가오네? 꼬리 감는다? 진짜 감는다?','이리 와. 오늘은 안 놔줄 거야. 말로만 그러는 거 아닌 거 알지?']},

jaeha:{o:{
  o_lake:[['새벽 두 시, 호수공원. 재하가 벤치 끝에 앉아 있었다. 후드를 깊이 눌러쓰고, 내 쪽은 보지 않은 채.','@jaeha|…왔네. 아니, 우연이야. 나 원래 이 시간에 여기 있어.'],
          ['호수 위로 가로등 불빛이 흔들렸다. 재하가 미지근하게 식힌 캔음료를 두 개 들고 서 있었다.','@jaeha|하나 남아서. 탄산. 너 거.']],
  j_store:[['새벽 무인편의점. 재하가 탄산음료 열 개와 초콜릿을 바구니에 담다가 굳었다.','@jaeha|…또 사람 있네. 너만 있으면, 괜찮아.']],
  o_lab:[['실습실 서버 랙 앞. 재하가 노트북 여섯 개를 동시에 띄워 놓고 있었다. 꼬리가 바닥을 천천히 쓸었다.','@jaeha|아. 거기 있는 줄 몰랐어. …거짓말이야. 알았어.']],

 t:{food:['분식! 떡볶이, 순대, 튀김! 엄마는 치킨집 하시지만 나는 분식파야.','너 많이 먹어야 돼. 내가 사 줄게. 통장은… 괜찮아, 아마.'],

async function chatTalk(c,pl){
  const d=D[c.id];const a=P.aff[c.id]||0;const lover=isLover(c.id);
  if(!d){const all=c.chat();await say(pick(all));eff({aff:{[c.id]:rnd(3,5)},stress:-2});return;}
  await say(opener(c,pl));
  if(lover&&Math.random()<.4)await say([loveLine(c)]);
  // 1단계: 화제
  const ks=shuf(ALLT).slice(0,3);
  const r1=await choose(ks.map(k=>({t:pick(TOPICS[k]),k})));
  await say([dl(c,d.t[r1.k][0])]);
  let g=(r1.k==='tease'&&a<20)?-2:1;
  // 2단계: 이어 가기
  const alt=pick(ALLT.filter(k=>k!==r1.k));
  const r2=await choose([{t:'조금 더 이야기를 들어 본다',k:'deep'},{t:`화제를 바꾼다 — ${pick(TOPICS[alt])}`,k:'alt'},{t:'가까이 다가간다',k:'close'},{t:'"이만 가 볼게요."',k:'bye'}]);
  if(r2.k==='deep'){await say([dl(c,d.t[r1.k][1])]);g+=2;}
  else if(r2.k==='alt'){await say([dl(c,d.t[alt][0])]);g+=2;}
  else if(r2.k==='close'){const hi=lover||a>=55;await say([hi?`${c.name}에게 한 걸음 다가섰다. 피하지 않았다.`:`${c.name}에게 한 걸음 다가섰다.`,dl(c,d.c[hi?1:0])]);g+=hi?3:(a>=25?0:-3);}
  else{await say([farewellLine(c,a)]);finishChat(c,g);return;}
  // 3단계: 마무리
  const o3=[{t:'"다음에 또 봐요."',k:'see'}];
  if(a>=25)o3.push({t:'말없이 조금 더 곁에 머문다',k:'stay'});
  if(a>=40||lover)o3.push({t:'"이번 주말에 시간 있어요?"',sub:'내가 먼저 데이트 신청',k:'date'});
  if(r2.k==='alt')o3.push({t:'그 이야기를 더 들어 본다',k:'deep2'});
  const r3=await choose(o3);
  if(r3.k==='see'){await say([farewellLine(c,a)]);g+=1;}
  else if(r3.k==='stay'){await say([pick(['한동안 둘 다 말이 없었다. 바람 소리만 들렸다.','아무 말 없이 나란히 서 있었다. 이상하게 어색하지 않았다.','시간이 조금 느리게 흘렀다.']),a>=50?loveLine(c):'']);g+=2;eff({stress:-3},true);}
  else if(r3.k==='deep2'){await say([dl(c,d.t[alt][1])]);g+=3;}
  else if(r3.k==='date'){
    if(a>=45||lover){await say([`${J(c.name,'은','는')} 잠깐 눈을 크게 떴다가 고개를 끄덕였다.`]);finishChat(c,g+2);return runDate(c);}
    await say([`${J(c.name,'은','는')} 잠깐 망설이더니, 아직은 이르다는 듯 웃으며 다음을 기약했다.`]);
  }
  finishChat(c,g);
}

/* ===================== 서사 엔진: 장(章)·장소·관계 단계 ===================== */
const LEGACY_T=['첫 만남','가까워지다','속마음'];
function route(c){
  if(ROUTE[c.id])return ROUTE[c.id];
  const ps=EVP[c.id]||[];
  return c.ev.map((e,i)=>({t:LEGACY_T[i]||('이야기 '+(i+1)),p:ps[i]||null,n:e.need,ev:i,legacy:true}));
}
const chP=ch=>ch&&ch.p?(Array.isArray(ch.p)?ch.p:[ch.p]):null;
function nextCh(c){const r=route(c),st=P.stage[c.id]||0;return st<r.length?r[st]:null;}
function rel(c){
  const st=P.stage[c.id]||0,a=P.aff[c.id]||0,L=route(c).length;
  if(isLover(c.id))return '연인';
  if(st===0)return '모르는 사이';
  if(a>=60&&st>=Math.max(2,L-2))return '썸';
  if(st>=Math.ceil(L/2)&&a>=30)return '친구';
  return '아는 사이';
}
function pendingHere(c,pl){if(!met(c))return false;const ch=nextCh(c);return !!(ch&&chP(ch)&&chP(ch).includes(pl)&&(P.aff[c.id]||0)>=ch.n&&wkAbs()>=(P.flags['cf_'+c.id]||0));}
function canAppear(c,pl){
  const p=c.at()[pl]||0;if(p<=0)return 0;
  if(pendingHere(c,pl))return Math.max(p,.85); /* 다음 이야기가 이 장소에서 기다리고 있으면 거의 확실히 나타남 */
  if((P.stage[c.id]||0)===0){const ps=chP(route(c)[0]);if(ps&&!ps.includes(pl))return 0;}
  return p;
}
function logStory(c,title,what){P.story=P.story||{};(P.story[c.id]=P.story[c.id]||[]).push(`「${title}」 ${what}`);}

/* 조우: 첫 만남 전에는 첫 장의 장소에서만 등장 */
async function encounter(pl){
  ensure();
  const cands=Object.values(CH).filter(c=>{const p=canAppear(c,pl);return p>0&&Math.random()<p;}).map(c=>[c,Math.random()+(pendingHere(c,pl)?2:0)]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  if(cands.length>=2){
    const g=cands.slice(0,3);
    const hot=g.filter(c=>met(c)&&(P.aff[c.id]||0)>=40);
    if(hot.length>=2&&Math.random()<.4)return rival(hot[0],hot[1]);
    return meetGroup(g,pl);
  }
  if(cands.length===1)return meet(cands[0],pl);
  const sups=SUPS.filter(s=>s.at.includes(pl)&&(!s.cond||s.cond()));
  if(sups.length&&Math.random()<.5)return pick(sups).run();
  if(pl==='o_alley'&&!isB()&&Math.random()<.25){await say(['골목 끝에서 수인 몇이 길을 막았다. 지갑을 내주고 나서야 지나갈 수 있었다.']);eff({money:-5,stress:8});return;}
  await say([pick(['별다른 일은 없었다.','아는 얼굴은 보이지 않았다.','조용한 한 주였다.'])]);
}

async function talk(c,pl){
  ensure();
  const st=P.stage[c.id]||0,a=P.aff[c.id]||0,ch=nextCh(c);
  if(st>0)await say([`#${c.name} — ${rel(c)}`]);
  if(st>0&&P.money<0&&a>=30&&MONEY[c.id]&&P.flags['mw_'+c.id]!==P.year*10+P.sem){P.flags['mw_'+c.id]=P.year*10+P.sem;await say(['@'+c.id+'|'+fx(MONEY[c.id].w)]);eff({stress:-3});}
  if(ch&&a>=ch.n&&(!chP(ch)||chP(ch).includes(pl))&&wkAbs()>=(P.flags['cf_'+c.id]||0))return runChapter(c,ch,st,pl);
  if(ch&&st>0&&a>=ch.n&&chP(ch)&&P.flags['hint_'+c.id]!==wkAbs()){P.flags['hint_'+c.id]=wkAbs();
    await say([`${J(c.name,'이','가')} 무언가 말을 꺼내려다 주위를 둘러보고 입을 다물었다. 여기서 할 이야기는 아닌 모양이다.`,`(다음 이야기 「${ch.t}」 · 📍 ${chP(ch).map(placeName).join(' · ')})`]);}
  if(!ROUTE[c.id]&&!isLover(c.id)&&!ch&&a>=75&&wkAbs()>=(P.flags['cf_'+c.id]||0))return midConfess(c);
  const ak='ask_'+c.id+'_'+P.year+P.sem;
  if(st>0&&a>=45&&!P.flags[ak]&&Math.random()<.3){P.flags[ak]=1;return dateInvite(c);}
  return chatTalk(c,pl);
}

async function runChapter(c,ch,st,pl){
  let lines,opts,q2=null;
  if(ch.ev!==undefined){const ev=c.ev[ch.ev].run(pl);lines=[...(ch.pre||[]),...ev.l];opts=ev.c;q2=ch.q2?ch.q2():null;}
  else{const o=ch.run();lines=o.s;opts=o.q||[];q2=o.q2||null;}
  await say([`##${c.name} · ${ch.t}`,...lines.map(fx)]);
  if(ch.conf){
    const ok=await confessDecision(c);
    if(ok){P.stage[c.id]=st+1;logStory(c,ch.t,'고백을 받아들였다');}
    else{P.flags['cf_'+c.id]=wkAbs()+6;logStory(c,ch.t,'고백에 답하지 못했다');}
    return;
  }
  const o=await choose(opts.map(x=>{let dis=false,sub='';if(x.req)for(const k in x.req)if(P[k]<x.req[k]){dis=true;sub=`${STN[k]} ${x.req[k]} 필요`;}return {...x,dis,sub:sub||undefined};}));
  await say(o.r.map(fx));
  let a=o.a;if(ch.legacy&&a<=5)a-=6;
  const e={...(o.s||{}),aff:{[c.id]:a,...(o.aff2||{})}};if(o.m)e.money=o.m;eff(e);
  if(o.f)P.flags['rt_'+c.id+'_'+o.f]=1;
  P.stage[c.id]=st+1;logStory(c,ch.t,o.t.replace(/"/g,''));
  if(st===0){P.log.met=(P.log.met||0)+1;toast(`${c.name} — 인물 목록에 추가됨`);}
  if(o.end)return;
  if(!q2){const d=D[c.id];if(!d)return;
    q2=[{t:'이야기를 더 나눈다',a:3,r:['@'+c.id+'|'+d.t[pick(['worry','hobby','work'])][st===0?0:1]]},
        {t:'조용히 곁에 있어 준다',a:2,r:[pick(['말없이 옆에 있었다. 그것만으로 충분해 보였다.','한동안 같은 곳을 바라봤다.']),'@'+c.id+'|'+d.c[(P.aff[c.id]||0)>=50?1:0]]},
        {t:'자리를 정리하고 일어선다',a:0,r:[farewellLine(c,P.aff[c.id]||0)]}];}
  const f=await choose(q2);
  await say(f.r.map(fx));
  if(f.a)eff({aff:{[c.id]:f.a}});
}

async function confessDecision(c){
  const others=P.lovers.filter(id=>id!==c.id).map(id=>CH[id]);
  const opts=others.length?[{t:'솔직하게 말하고 받아들인다',sub:`이미 ${joinNames(others)}와(과) 사귀는 중 · 다자 연애 제안`,k:'poly'},{t:'다른 연인 몰래 받아들인다',sub:'들키면 큰일 난다',k:'secret'},{t:'거절한다',k:'no'}]
    :[{t:'받아들인다',k:'yes'},{t:'"아직은 잘 모르겠어요."',k:'no'}];
  const o=await choose(opts);
  if(o.k==='no'){await say([`${J(c.name,'은','는')} 고개를 끄덕였다. 쉽게 포기할 얼굴은 아니었다.`]);eff({aff:{[c.id]:-4}});return false;}
  if(o.k==='yes'||o.k==='secret'){
    P.lovers.push(c.id);if(o.k==='secret')P.secret.push(c.id);
    await say([`${J(c.name,'과','와')} 사귀기 시작했다.`,...firstKiss(c)]);eff({aff:{[c.id]:8},stress:-6});toast(`♥ ${c.name}와(과) 연인이 되었다`);return true;}
  await say([`이미 마음을 준 사람이 있다고, ${c.name}에게 솔직하게 말했다.`]);
  if((P.aff[c.id]||0)>=85||Math.random()<.55){
    await say([`${J(c.name,'은','는')} 한참 말이 없다가 대답했다.`,'@'+c.id+'|…그래도 좋아. 나도 거기 끼워 줘.']);
    P.lovers.push(c.id);eff({aff:{[c.id]:6}});
    for(const o2 of others){
      if((P.aff[o2.id]||0)>=70||Math.random()<.5){await say([`${o2.name}에게도 털어놓았다. 오래 침묵하던 ${J(o2.name,'이','가')} 결국 고개를 끄덕였다.`,'@'+o2.id+'|'+fx(X[o2.id].jeal),'…그래도 떠나지는 않았다.']);eff({aff:{[o2.id]:-4}});}
      else{await say([`${o2.name}에게도 털어놓았다. ${J(o2.name,'은','는')} 아무 말 없이 돌아섰다. 그걸로 끝이었다.`]);P.lovers=P.lovers.filter(x=>x!==o2.id);eff({aff:{[o2.id]:-20},stress:10});}
    }
    if(P.lovers.length>=2){P.poly=true;toast('다자 연애가 시작되었다');}
    return true;
  }
  await say(['@'+c.id+'|…그건 싫어. 나만 보는 게 아니면.',`${J(c.name,'은','는')} 그렇게 말하고 돌아섰다.`]);eff({aff:{[c.id]:-6},stress:6});
  return false;
}
async function midConfess(c){
  P.flags['cf_'+c.id]=wkAbs()+8;
  await say(['##고백',`${J(c.name,'이','가')} 걸음을 멈췄다. 평소와 다른 얼굴이었다.`,'@'+c.id+'|'+fx(X[c.id].conf)]);
  return confessDecision(c);
}

/* 일상 대화 호감도: 이야기(장) 없이 같은 사람과 매주 수다만 떨면 효과가 줄어든다 */
function finishChat(c,g){
  if(P[c.likes]>=50)g+=1;if(isLover(c.id))g+=1;
  const k='lt_'+c.id;if(P.flags[k]&&wkAbs()-P.flags[k]<=1&&g>0)g=Math.floor(g/2);P.flags[k]=wkAbs();
  const nc=nextCh(c);if(nc&&ROUTE[c.id]&&g>0&&(P.aff[c.id]||0)>=nc.n+12)g=0; /* 다음 이야기를 보기 전엔 수다만으로 더 가까워지지 않음 */
  eff({aff:{[c.id]:Math.max(-4,g)},stress:isLover(c.id)?-4:-2});
}

    const pl=Object.entries(c.at()).filter(([k,p])=>p>0&&(!OUTS[k]||!OUTS[k].cond||OUTS[k].cond())).sort((x,y)=>y[1]-x[1]).map(([k])=>placeName(k));

  }).join('');

};

      {t:'"…멋있는데요?"',a:5,r:['@jaeha|멋있어? 이게?','그의 꼬리가 바닥을 한 번 쓸었다.','@jaeha|다들 무섭다고 하는데. 아니, 다들 몰라. 아는 사람이 없으니까.']},
      {t:'"이거 불법 아니에요?"',a:2,r:['@jaeha|맞아.','@jaeha|규칙은 남들이 합의해 둔 거잖아. 나는 합의한 적이 없어. …근데 너한테 들키니까 좀 부끄럽네. 이상하다.']}],
   q2:[{t:'"사람이 왜 그렇게 불편해요?"',a:4,r:['@jaeha|어릴 때 다들 내 얼굴을 빤히 들여다봤어. 그때부터 눈 마주치는 게 싫어졌어.','@jaeha|11살에 학교 성적 서버에 들어가 봤는데, 사람은 기록으로 읽는 게 훨씬 쉽더라.']},
       {t:'"밥은 먹었어요? 감자튀김 사 올게요."',a:4,r:['@jaeha|…응. 식혀서. 뜨거운 거 못 먹어.','돌아왔을 때 노트북 여섯 대가 전부 꺼져 있었다. 나를 위해 비워 둔 책상 한 칸이 생겨 있었다.']}]})},
 {t:'새벽 두 시',p:['o_lake'],n:30,ev:1,q2:()=>[

   {t:'"엄마한테는 연락해요?"',a:4,r:['@jaeha|몇 년에 한 번. ‘밥은 먹고 다니니. 짧게라도 답해주렴.’ 그게 다야.','@jaeha|…오늘은 답장해 볼까. ‘응.’ 한 글자.','그가 정말로 휴대폰을 꺼내 한 글자를 보냈다.']}]},
 {t:'지워 준 기록',p:['o_lab','o_library'],n:45,ev:2,q2:()=>[

 {t:'렌즈 너머',p:['o_lake','o_lab'],n:60,run:()=>({
   s:['재하의 연락이 일주일째 없었다. 새벽 호수공원 벤치에 그가 앉아 있었다. 눈 밑이 검었다.','@jaeha|미안. 일이 좀 있었어.','@jaeha|어떤 수인이 너 뒤를 캐고 있었어. 기숙사, 수업, 알바 시간까지. 그래서 그놈 약점을 모아서… 익명으로 보냈어. 이제 다신 안 올 거야.','그가 아무렇지 않게 말했다. 나를 지키려고 누군가의 인생을 쥐고 흔들었다는 이야기를.',rf('jaeha','boundary')?'@jaeha|네 카메라는 끈 채로 했어. 그건 지켰어.':'@jaeha|네가 어디 있는지는… 계속 보고 있었어. 그래서 알았던 거야.'],
   q:[{t:'"지켜 줘서 고마워요. 근데 다음엔 같이 해요."',a:10,r:['@jaeha|같이?','@me|혼자 다 짊어지지 말고. 나도 알 권리가 있잖아요.','재하가 처음으로 고개를 들고 내 눈을 봤다. 5초쯤. 그게 그의 최대치였다.','@jaeha|…알았어. 다음엔 말할게. 화면 말고, 입으로.']},
      {t:'"이제 저 보는 거 그만해요."',a:-4,f:'cut',r:['@jaeha|…응.','그가 휴대폰을 꺼내 무언가를 지웠다. 손가락이 오래 머뭇거렸다.','@jaeha|다 지웠어. 이제 너는, 내 화면 밖에 있어.','그 말이 생각보다 쓸쓸하게 들렸다.']},
      {t:'"…무서워요, 당신이."',a:-8,end:true,r:['그의 귀가 완전히 납작해졌다.','@jaeha|응. 맞아. 무서운 거 맞아.','그가 일어나 후드를 깊이 눌러썼다. 그 뒤로 몇 주 동안, 그는 호수공원에 나오지 않았다.']}],
   q2:[{t:'"밤새웠죠? 같이 아침 먹어요."',a:4,r:['@jaeha|아침… 햇빛 싫은데.','그래도 그는 따라왔다. 편의점 컵라면을 미지근하게 식혀서, 해 뜨는 걸 등지고 먹었다.']},
       {t:'옆에 기대 잠깐 눈을 감는다',a:5,r:['재하의 숨이 멎는 게 느껴졌다. 그리고 아주 조심스럽게, 은회색 꼬리가 내 무릎을 덮었다.']}]})},
 {t:'커튼을 열면',p:['o_lake'],n:75,conf:true,run:()=>({
   s:['새벽 두 시, 호수공원. 재하가 후드를 벗고 벤치에 앉아 있었다. 나를 똑바로 보고 있었다. 처음이었다.',
     rf('jaeha','cut')?'@jaeha|네 기록 다 지웠잖아. 근데 하나도 안 잊혀. 기록이 없어도 기억이 다 하더라.':'@jaeha|화면으로 너 보는 거 4년 동안 했는데, 이렇게 보는 게 더 좋아. 무서운데, 더 좋아.',
     '@jaeha|'+X.jaeha.conf]})}
];

 {t:'물의 날',p:['o_mount'],n:30,run:()=>({

 {t:'주사위',p:['o_library'],n:60,run:()=>({
   s:['도서관 대출 데스크. 내가 동기 차정결과 웃으며 이야기하다 돌아보니, 상기가 노란 주사위를 굴리고 있었다.','주사위가 데스크 위에서 멈췄다. 1. 그는 수첩에 정결의 이름을 적었다. 그리고 그 옆에 무언가를 쓰다 말았다.','@sanggi|…아. 봤어?','@sanggi|버릇이야. 거슬리는 사람이 생기면 주사위로 정해. 어떻게 할지.'],

      {t:'짐승형인 그를 품에 안는다',a:9,r:['커다란 퓨마의 머리가 내 무릎에 놓였다. 골골골, 하는 소리가 빗소리에 섞였다.','@husan|(사람 모습이 되며) …찾으러 왔다. 너도.']},
      {t:'"감기 걸려. 빨리 기숙사 가자."',a:3,r:['@husan|…응.','그는 순순히 따라왔다. 그런데 기숙사 앞에서 한참 돌아보지 않았다. 비 오는 숲 쪽을.']}],
   q2:[{t:'"친부모 찾고 싶어?"',a:3,r:['@husan|몰라. 휴산은 이름도 몰라. 생일도 몰라.','@husan|…주워진 날을 생일로 할래. 너도 그날 축하해 줄 거야?']},
       {t:'"그 할머니 보고 싶어?"',a:4,r:['@husan|응. 방학 때 갈 거야. 할머니한테 너 얘기 할 거야. 냄새 좋은 애 있다고.']}]})},
 {t:'돌, 깃털, 나뭇잎',p:['o_mount'],n:45,ev:2,q2:()=>[
   {t:'"나도 휴산한테 줄 게 있어."',a:5,r:['주머니에 있던 머리끈 하나를 건넸다.','@husan|…이거 너 냄새 나.','그가 머리끈을 손목에 감았다. 그 뒤로 한 번도 풀지 않았다.']},
   {t:'"무리에선 짝이 되면 뭐가 달라져?"',a:3,r:['@husan|같이 자. 같이 먹어. 같이 사냥해. 아프면 핥아 줘.','@husan|…학교에선 핥으면 안 된대. 휴산 그거 배웠어.']}]},
 {t:'야생 출신',p:['o_cafe'],n:60,run:()=>({
   s:['학생식당. 수인 학생 몇이 휴산의 식판을 일부러 엎었다.','“야생 냄새 나서 밥이 안 넘어가.” 웃음이 터졌다.','휴산의 윤곽이 흐려졌다. 순식간에 거대한 검은 퓨마가 테이블 위에 서 있었다. 송곳니가 드러났다. 식당이 비명으로 가득 찼다.'],
   q:[{t:'퓨마의 목덜미를 천천히 쓰다듬는다',a:10,r:['털이 곤두선 목덜미에 손을 얹었다. 으르렁거림이 조금씩 낮아졌다.','@me|휴산. 나 봐.','퓨마가 나를 봤다. 붉은 눈의 세로 동공이 천천히 넓어졌다. 그리고 사람 모습으로 돌아와 내 어깨에 이마를 묻었다.','@husan|…휴산이 무서웠어? 미안. 휴산도 무서웠어.']},
      {t:'학생처에 같이 가서 변호한다',req:{charm:40},a:12,r:['징계 위원회가 열렸다. 휴산은 고개를 숙이고 있었다.','나는 식판을 엎은 학생들과 그들이 한 말을 그대로 증언했다. 처장 태성우가 한참 서류를 보다 말했다.','“양쪽 다 반성문. 퇴학 사유는 아니다.”','@husan|…휴산 안 쫓겨나? 너 때문에?']},
      {t:'놀라서 뒤로 물러선다',a:-8,f:'fear',end:true,r:['나는 나도 모르게 뒷걸음질 쳤다. 퓨마의 귀가 그걸 들었다.','휴산은 사람 모습으로 돌아와 아무 말 없이 식당을 나갔다. 그 주 내내 그는 나무 위에서 내려오지 않았다.']}],
   q2:[{t:'"휴산 잘못 아니야."',a:5,r:['@husan|…진짜?','@husan|휴산은 짐승이 되면 생각을 잘 못 해. 근데 너 목소리는 들려. 그거 하나는 들려.']},
       {t:'같이 새 식판을 받으러 간다',a:3,r:['그가 내 옆에 바짝 붙어 줄을 섰다. 꼬리가 내 다리에 감겼다. 이번엔 아무도 웃지 않았다.']}]})},
 {t:'첫 짝',p:['o_mount'],n:75,conf:true,run:()=>({
   s:['겨울의 끝, 뒷산. 휴산이 나무 위에서 뛰어내렸다. 손에 매끈한 돌 하나를 쥐고 있었다. 처음 만난 날 고르던 그 돌이었다.',
     rf('husan','fear')?'@husan|그때 너 뒤로 갔을 때, 휴산은 끝인 줄 알았어. 근데 너 다시 왔어. 냄새 맡고 알았어. 무서워도 오는 애구나.':'@husan|휴산이 짐승이 돼도 너는 안 도망갔어. 그래서 결정했어.',
     '@husan|'+X.husan.conf]})}
];

   {t:'"총 쏘는 거 좀 무서워요."',a:1,r:['@gunha|무섭지. 그래서 정확해야 돼. 난 정확해.','그가 헤드기어를 내 머리에 씌워 주었다. 귀가 먹먹해졌다.']}]},
 {t:'콩알',p:['o_gym'],n:15,run:()=>({
   s:['체육관 웨이트존. 건하가 벤치에 앉아 수건을 목에 걸고 있었다. 평소보다 조용했다.','@gunha|야. 내가 왜 너 콩알이라고 부르는지 알아?','@gunha|우리 집에 인간이 하나 있었어. 해방 전에. 나랑 같이 컸어. 나보다 작아서 콩알이라고 불렀거든.','@gunha|내가 열다섯 때 부모님이 기관에 보냈어. 운동에 집중하라고. 난 아무 말도 안 했어.'],
   q:[{t:'"찾아보고 싶어요?"',a:6,r:['@gunha|…찾았어. 작년에. 기관 기록에 있더라.','@gunha|근데 못 갔어. 무슨 얼굴로 가. 보낼 때 말리지도 않은 놈이.','그의 꼬리가 바닥을 한 번 쳤다.']},

      {t:'"그 사람 대신은 싫어요."',a:5,r:['@gunha|…대신 아니야.','@gunha|그 말 들으니까 확실해졌어. 대신이면 이렇게 신경 안 쓰여.']}],
   q2:[{t:'"그때 열다섯이었잖아요. 어쩔 수 없었어요."',a:4,r:['@gunha|그 말 듣고 싶었는지도 모르겠다.','@gunha|…고마워. 이거 다른 데 말하면 죽는다.']},
       {t:'"콩알이라고 불러도 돼요. 괜찮아요."',a:3,r:['@gunha|…진짜? 그럼 계속 부른다. 콩알.']}]})},
 {t:'손은 안 떨리는데',p:['o_range','o_gym','club'],n:30,ev:1,q2:()=>[
   {t:'"기록 안 나와도 건하 씨는 건하 씨예요."',a:5,r:['@gunha|…그런 말 하지 마. 울컥하잖아.','정말로 은빛 눈이 붉어졌다. 그는 고기를 입에 잔뜩 넣고 아무 말도 안 했다.']},
   {t:'"다음 기록 나오면 고기 사 줘요."',a:3,r:['@gunha|콜. 열 인분.']}]},
 {t:'손 떨렸다, 다시',p:['o_range'],n:45,run:()=>({
   s:['사격장. 백발에 가까운 회색 머리의 퓨마 수인이 건하의 뒤에 서 있었다. 전 국가대표이자 아버지 강진호였다.','@jinho|손 떨렸다. 다시.','건하가 다시 쐈다. 10.9점. 만점이었다.','@jinho|어깨가 굳었다. 다시.','건하의 꼬리가 바닥을 사납게 쳤다. 그가 총을 내려놓았다.','@gunha|…지금은 선수가 아니고 아들인데요, 선생님?'],
   q:[{t:'건하 옆에 가서 선다',a:8,r:['강진호가 나를 봤다. 건하가 내 앞을 반쯤 막아섰다.','@gunha|제 친구예요. 오늘은 여기까지 할게요.','강진호가 한참 둘을 보다가, 처음으로 웃었다.','@jinho|…그래. 친구 데려온 건 처음이구나.']},
      {t:'"방금 만점이었잖아요."',a:6,r:['@jinho|만점은 기본이다.','@gunha|들었지? 우리 집은 이래.','그런데 강진호가 돌아서며 혼잣말처럼 말했다. “…잘 쐈다.” 건하의 귀가 쫑긋 섰다.']},
      {t:'끼어들지 않고 기다린다',a:2,r:['연습은 2시간 더 이어졌다. 끝나고 나온 건하는 아무 말도 하지 않았다.','@gunha|…기다렸어? 바보같이.','그래도 그는 내 가방을 대신 들었다.']}],
   q2:[{t:'"아버지 좋아해요?"',a:4,r:['@gunha|좋아해. 근데 칭찬 한 번 들어 보고 싶어. 그게 다야.','@gunha|…이런 말은 너한테만 한다.']},
       {t:'"고깃집 가요. 제가 살게요."',a:4,r:['@gunha|네가? …좋아. 콩알이 사는 고기는 처음이다.']}]})},
 {t:'0.1점',p:['o_range','o_gym','club'],n:60,ev:2,q2:()=>[
   {t:'"다음 선발전, 같이 준비해요."',a:5,r:['@gunha|같이? 너 총도 못 쏘잖아.','@gunha|…그래도 와. 옆에 있어. 그게 준비야.']},
   {t:'그의 머리를 쓰다듬는다',a:5,r:['@gunha|…애 취급하지 말라니까.','그러면서 그는 고개를 숙여 내 손에 머리를 맡겼다.']}]},
 {t:'표적 대신',p:['o_range'],n:75,conf:true,run:()=>({

];

 {t:'늘 먹던 것',p:['j_gukbap'],n:30,run:()=>({
   s:['복희네 국밥집. 단호가 메뉴판 앞에서 오래 서 있었다. 늘 먹던 순대국 말고 다른 걸 골라 보겠다고 했었다.','@danho|…못 고르겠어요. 고르는 게 제일 어려워요.','@bokhui|이 총각은 5년째 순대국만 묵는다.'],
   q:[{t:'"제가 골라 줄게요." 섞어국밥을 시킨다',a:8,r:['국밥이 나왔다. 단호가 한 숟가락 떠먹고, 멈췄다.','@danho|…맛있어요.','@danho|이거, 내일도 먹어도 돼요? 아니, 제가 정할게요. 내일도 먹을 거예요.']},

   q2:[{t:'"배부르면 배부르다고 말해요."',a:4,r:['@danho|배부른 것도 늦게 알아요. 그래서 늘 한 그릇만 먹어요. 실수할까 봐.','@danho|…오늘은 한 그릇 더 먹어 볼게요. 배부르면 말할게요.']},

 {t:'유단태',p:['o_center','o_lab'],n:45,run:()=>({
   s:['적응지원센터 게시판 앞. 단호가 숙소 거주자 명단 한 줄을 오래 보고 있었다. 손가락이 그 이름 위에서 떨렸다.','‘유단태, 32세.’','@danho|형이에요. 10살에 헤어졌어요. 여기, 이 센터 숙소에 있대요.',P.stage.dantae>0?'@danho|…혹시 아세요? 아시는구나. 표정 보니까.':'@danho|가까이 있었는데, 몰랐어요.','@danho|무슨 말부터 해야 할지 모르겠어요.'],
   q:[{t:'"같이 가요. 지금."',a:8,r:['숙소 복도 끝 방. 단호가 문 앞에서 세 번 숨을 골랐다. 노크는 내가 했다.','문이 열리고, 단호와 닮았지만 조금 작은 남자가 나왔다. 둘은 한참 서로를 봤다. 아무도 말을 못 했다.','먼저 운 건 형이었다.']},
      {t:'"편지부터 써 봐요."',a:7,r:['단호가 삐뚤빼뚤한 글씨로 세 줄을 썼다. ‘형. 저 단호예요. 밥은 먹었어요?’','@danho|이게 다예요. 더 못 쓰겠어요.','@me|그게 다면 충분해요.','다음 날 센터 우편함에 답장이 와 있었다. ‘먹었어. 너는.’']},
      {t:'"준비되면 그때 가요."',a:3,r:['@danho|…네. 아직 무서워요.','그는 명단 사진을 찍어 두었다. 그 사진을 가끔 꺼내 보는 걸 봤다.']}],
   q2:[{t:'"형이 좋아할 거예요."',a:4,r:['@danho|그럴까요. 저는 형한테 아무것도 못 해 줬는데.','@danho|…그래도, 옆에 계셔서 갈 수 있었어요.']},
       {t:'그의 등을 토닥인다',a:4,r:['커다란 등이 조금씩 떨리다 멎었다.','@danho|…이러면 기대고 싶어져요. 벽 말고.']}]})},
 {t:'정문의 고함',p:['o_gate'],n:60,ev:2,q2:()=>[
   {t:'"억울하면 억울하다고 해도 돼요."',a:5,r:['@danho|…억울해요.','처음 듣는 그의 큰 목소리였다. 시위대 쪽이 아니라, 하늘을 보고 한 말이었다.']},

 {t:'못생겼다',p:['o_hospital'],n:15,run:()=>({

   q:[{t:'"그거 칭찬이에요?"',a:7,r:['@jehan|진단이야.','@jehan|…진단인데, 신경 쓰이는 환자한테만 해.','그가 자기 커피를 내 손에 쥐여 주고, 하나를 더 사러 들어갔다.']},
      {t:'"선생님도 못생겼거든요."',a:8,r:['오드아이가 아주 조금 커졌다.','@jehan|…그렇게 말한 사람은 처음이야.','그가 고개를 돌렸다. 검은 갈기 사이로 귀가 한 번 움찔했다.','@jehan|좋아. 서로 못생긴 걸로.']},
      {t:'상처받은 얼굴로 돌아선다',a:-2,r:['@jehan|…야.','등 뒤에서 그가 불렀다. 돌아보지 않았다.','다음 날, 학교 적응지원센터 앞에 비타민 한 통이 놓여 있었다. 메모는 없었다.']}],
   q2:[{t:'"밥은 선생님이 먹어요. 꼬리가 처졌어요."',a:4,r:['@jehan|…꼬리 보지 마.','@jehan|36시간째야. 구내식당 같이 가. 너도 안 먹었잖아.']},
       {t:'"다른 사람한텐 뭐라고 해요?"',a:3,r:['@jehan|아무 말도 안 해. 환자번호 부르고 끝.','@jehan|…그러니까 감사하게 생각해.']}]})},
 {t:'오른 손목',p:['o_hospital'],n:30,ev:1,q2:()=>[
   {t:'"그 수인, 지금도 연락해요?"',a:4,r:['@jehan|매년 그날 귤 한 박스 보내. 붕괴 현장에서 꺼낸 날.','@jehan|난 귤 안 좋아해. 근데 다 먹어.']},
   {t:'"아프면 아프다고 해요."',a:4,r:['@jehan|의사가 아프다고 하면 환자가 불안해해.','@jehan|…너한테만 말할게. 아파. 오늘은 좀 많이.']}]},
 {t:'중증도',p:['o_hospital'],n:45,ev:2,q2:()=>[
   {t:'"아까 그 의사한테 욕했잖아요."',a:3,r:['@jehan|했지.','@jehan|그 새끼 내일 경위서 써. 나도 쓰고. 공평하지.']},
   {t:'"인간 환자, 살았어요?"',a:5,r:['@jehan|살았어.','그가 피 묻은 장갑을 벗으며 처음으로 웃었다. 아주 피곤한 웃음이었다.','@jehan|오늘은 잘했지. 그치?']}]},
 {t:'형 둘',p:['o_hospital','o_center'],n:60,run:()=>({
   s:['병원 옥상. 태제한이 전화를 받고 있었다. 수화기 너머로 나른한 목소리가 들렸다.','“형, 칼 맞은 놈 하나 보낸다. 범인이야. 살려 놔. 조서 받아야 돼.”','@jehan|…제일아. 내가 너 시다바리냐.','전화를 끊고 그가 한숨을 쉬었다.','@jehan|동생이야. 형사. 위에 형이 하나 더 있어. 교수. 셋 다 검은 사자.','@jehan|…가족 모임에 같이 갈래? 아니, 그냥 물어본 거야.'],
   q:[{t:'"갈게요."',a:10,r:['@jehan|…진짜?','@jehan|형은 너 보고 논문 얘기 할 거고, 제일이는 너 신원조회 할 거야. 각오해.','그가 말하면서도 꼬리를 숨기지 못했다. 바닥을 몇 번이나 쓸고 있었다.']},
      {t:'"그거 데이트 신청이에요?"',a:8,r:['@jehan|…아니. 가족 모임이야.','@jehan|데이트는 따로 해. 밥 먹고, 걷고. 그건 다음 주 목요일.','그가 말하고 나서야 자기가 무슨 말을 했는지 깨달은 얼굴이 되었다.']},
      {t:'"가족은 좀 부담스러워요."',a:-3,f:'family',r:['@jehan|그래. 그렇지.','그가 담담하게 고개를 끄덕였다. 그런데 그 뒤로 몇 주 동안, 그는 “못생겼다”는 말을 하지 않았다.']}],
   q2:[{t:'"동생 부탁, 결국 들어줄 거죠?"',a:3,r:['@jehan|당연하지. 범인이어도 환자야.','@jehan|살려 놓고, 제일이한테 넘겨. 그 다음은 걔 일.']},
       {t:'옥상 바람에 갈기가 흩날린다. 정리해 준다',a:5,r:['그가 가만히 있었다. 사자 수인이 갈기를 남에게 맡기는 건 흔한 일이 아니라고 들었다.','@jehan|…손 차갑네. 못생긴 손.']}]})},
 {t:'반대말',p:['o_hospital'],n:75,conf:true,run:()=>({
   s:['새벽 다섯 시, 응급실 뒷문. 밤샘 수술을 끝낸 태제한이 스크럽 차림 그대로 나왔다. 나를 보더니 걸음을 멈췄다.',
     rf('jehan','family')?'@jehan|가족 모임은 안 가도 돼. 나만 보면 돼. 그거면 돼.':'@jehan|형이 너 마음에 든대. 제일이는 신원조회 깨끗하대. 이제 남은 건 나야.',
     '@jehan|못생겼다고 하는 거, 4년 동안 했잖아. 근데 그거 다 거짓말이었어.','@jehan|'+X.jehan.conf]})}
];

ROUTE.haeseong=[
 {t:'방송 소리',p:['o_dorm'],n:0,ev:0,q2:()=>[
   {t:'"손가락, 뭘 세고 있었어요?"',a:4,r:['@haeseong|…숫자입니다. 일곱까지 세고 다시 하나.','@haeseong|기관에서 방송이 나오면 늘 무슨 일이 생겼습니다. 몸이 아직 그걸 기억합니다.']},
   {t:'"이름 물어봐도 돼요?"',a:3,r:['@haeseong|이해성입니다. 30살. 자유전공. 늦게 왔습니다.','@haeseong|…감사합니다. 방금 것.']}]},
 {t:'원하는 것',p:['j_store','o_dorm'],n:15,run:()=>({
   s:['새벽 무인편의점. 해성이 진열대 앞에서 5분째 서 있었다. 손에 아무것도 들려 있지 않았다.','@haeseong|…고르는 중입니다.','@haeseong|기관에서는 주는 걸 먹었습니다. 원하는 게 뭐냐고 물으면 대답하면 안 됐습니다. ‘아무거나’가 정답이었습니다.','@haeseong|그래서 아직, 원하는 게 뭔지 잘 모릅니다.'],
   q:[{t:'"하나씩 다 먹어 보면 되죠."',a:8,r:['그날 우리는 컵라면 다섯 종류를 한 입씩 먹었다.','@haeseong|…세 번째가 좋습니다.','@me|그게 원하는 거예요.','@haeseong|원하는 것. 세 번째 컵라면. …기억하겠습니다.']},
      {t:'"제가 좋아하는 거 같이 먹어 볼래요?"',a:6,r:['@haeseong|당신이 좋아하는 것.','그가 내가 고른 과자를 아주 천천히 먹었다.','@haeseong|맛은 잘 모르겠습니다. 근데 당신이 웃는 건 좋습니다. 이것도 원하는 거에 들어갑니까.']},
      {t:'"아무거나 골라요. 빨리."',a:-4,r:['@haeseong|…예.','그가 손에 잡히는 대로 하나를 집었다. 계산을 하고, 먹지 않고 가방에 넣었다.']}],
   q2:[{t:'"원하는 거 생기면 제일 먼저 말해 줘요."',a:4,r:['@haeseong|약속하겠습니다. 처음으로 하는 약속입니다.']},
       {t:'"서두를 필요 없어요."',a:4,r:['@haeseong|…서두르지 않아도 된다.','그가 그 말을 입 속으로 한 번 더 굴렸다. 손가락이 멈춰 있었다.']}]})},
 {t:'보이차',p:['j_store'],n:30,ev:1,q2:()=>[
   {t:'"차는 언제부터 좋아했어요?"',a:4,r:['@haeseong|좋아하는지는 모릅니다. 어머니가 일하시는 댁에서 남은 찻잎을 얻어 오셨습니다.','@haeseong|…그 냄새가 나면, 아무 일도 안 생겼습니다. 그래서 마십니다.']},
   {t:'보온병 뚜껑에 한 잔 더 따라 달라고 한다',a:5,r:['그의 입가에 웃음선이 아주 희미하게 생겼다.','@haeseong|두 잔째는 처음입니다. 누가 더 달라고 한 게.']}]},
 {t:'영화관의 어둠',p:['o_library','o_dorm'],n:45,run:()=>({
   s:['도서관 지하 시청각실. 조명을 낮춘 작은 상영회였다. 해성이 맨 뒷줄 구석에 앉아 있었다.','영화 중간, 화면 속에서 사이렌이 울렸다. 해성의 몸이 굳었다. 손가락이 빠르게 움직이기 시작했다.'],
   q:[{t:'그의 손가락 위에 손을 겹친다',a:10,r:['그의 손가락이 내 손바닥 밑에서 멈췄다. 일곱까지 세던 숫자가 끊겼다.','어둠 속에서 그가 아주 작게 숨을 내쉬었다.','@haeseong|…처음입니다. 세지 않고 멈춘 건.']},
      {t:'"나갈까요?" 하고 속삭인다',a:6,r:['복도의 낮은 조명 아래, 그가 벽에 기대 한참 숨을 골랐다.','@haeseong|미안합니다. 영화를 망쳤습니다.','@me|영화보다 해성 씨가 중요해요.','@haeseong|…중요. 그 말은 처음 듣습니다.']},
      {t:'모른 척 영화를 계속 본다',a:-3,r:['영화가 끝나고 불이 켜졌을 때, 해성은 이미 자리에 없었다.','다음 날 그는 평소처럼 인사했다. 표정은 늘 그렇듯 아무것도 말해 주지 않았다.']}],
   q2:[{t:'"다음엔 사이렌 없는 영화로 골라요."',a:4,r:['@haeseong|…당신이 고르십시오. 아니, 같이 고르겠습니다.','@haeseong|원하는 게 하나 더 생겼습니다. 당신이랑 영화 보는 것.']},
       {t:'"그 소리, 무슨 기억이에요?"',a:3,r:['@haeseong|탈출 시도한 사람이 있으면 그 소리가 났습니다. 다음 날 그 사람은 없었습니다.','@haeseong|…말하고 나니까 좀 가볍습니다. 이상합니다.']}]})},
 {t:'어머니',p:['o_dorm','o_library','j_store'],n:60,ev:2,q2:()=>[
   {t:'"어머니 일하시는 댁, 같이 가 봐요."',a:5,r:['주말. 깃털이 하얀 조류형 수인의 저택 뒷문. 작은 인간 여자가 해성을 보자마자 재봉 가위를 떨어뜨렸다.','@haeseong|…어머니. 이쪽은, 제가 원하는 사람입니다.','어머니가 내 손을 오래 잡았다. 그 손가락에도 해성과 똑같은 바늘 굳은살이 있었다.']},
   {t:'"익숙한 곳, 해성 씨한테는 어디예요?"',a:5,r:['@haeseong|…모르겠습니다. 근데 최근에는.','그가 말을 멈추고 나를 봤다. 대답 대신이었다.']}]},
 {t:'처음 원하는 것',p:['o_dorm','j_store'],n:75,conf:true,run:()=>({
   s:['졸업 전날 밤, 기숙사 로비. 천장 스피커에서 졸업 축하 방송이 흘러나왔다. 해성이 그 아래 앉아 있었다. 손가락이 움직이지 않았다.','@haeseong|들립니까. 방송. 이제 괜찮습니다. 당신 덕분입니다.','@haeseong|4년 동안 원하는 걸 찾았습니다. 세 번째 컵라면. 두 잔째 보이차. 사이렌 없는 영화. 그리고 마지막 하나.','@haeseong|'+X.haeseong.conf]})}
];

 {t:'아빠 도시락',p:['o_cafe'],n:15,ev:1,q2:()=>[

 {t:'체육관의 실수',p:['o_gym'],n:30,run:()=>({
   s:['교양 체육 시간. 배구 시합 중이었다. 유홍이 신나서 뛰어오르다 공 대신 같은 팀 인간 학생의 어깨를 쳤다.','쿵. 학생이 넘어졌다. 체육관이 조용해졌다. 누군가 중얼거렸다. “역시 맹수형은…”','유홍의 귀가 머리에 붙었다. 꼬리가 다리 사이로 말려 들어갔다.','@yuhong|죄, 죄송해요. 일부러 그런 게 아니라…'],
   q:[{t:'넘어진 학생을 같이 일으키며 유홍 편을 든다',a:9,r:['@me|공 보다가 그런 거잖아. 나도 봤어.','넘어진 학생이 어깨를 털며 일어났다. “괜찮아. 놀라기만 했어.”','유홍이 나를 봤다. 눈이 그렁그렁했다.','@yuhong|…고마워요. 진짜로.']},
      {t:'"유홍아, 사과 제대로 하자. 같이."',a:7,r:['유홍이 학생 앞에서 고개를 깊이 숙였다. 나도 옆에서 같이 숙였다.','@yuhong|다치게 해서 죄송해요. 다음엔 조심할게요.','학생이 웃었다. “너 진짜 착하다. 다음 판 같은 팀 하자.”','@yuhong|…헤헤. 같은 팀이래요.']},
      {t:'수군거리는 쪽에 끼어 웃는다',a:-8,f:'laugh',end:true,r:['나도 모르게 따라 웃었다. 유홍의 눈이 나를 찾았다가, 멈췄다.','그날 이후 유홍은 강의실에서 내 옆자리에 앉지 않았다. 꼬리는 늘 얌전히 말려 있었다.']}],
   q2:[{t:'"힘 조절, 같이 연습할래?"',a:4,r:['@yuhong|연습요? 어떻게요?','그날 오후, 체육관 구석에서 우리는 풍선으로 배구를 했다. 유홍은 풍선을 열한 개 터뜨렸다.','@yuhong|…열두 번째는 안 터졌어요! 봤죠?!']},

 {t:'혼난 날',p:['o_cafe','lecture','o_gym'],n:45,ev:2,q2:()=>[

   q:[{t:'옆에 앉아 같이 지지대를 세운다',a:9,r:['해가 질 때까지 둘이서 지지대를 다시 세웠다. 살아남은 토마토가 열한 개였다.','태안이 그중 제일 빨간 걸 따서 내 손바닥에 올렸다.','@taean|약속했쥬. 제일 빨간 거.','@taean|…혼자 했으면 울었을 거여유. 같이 하니께 안 울었네유.']},
      {t:'"누가 그랬는지 찾아요."',a:5,r:['@taean|찾아서 뭐 해유.','@taean|…그래두, 화내 주니께 좀 시원하네유. 지 대신 화내 준 사람 처음이에유.']},
      {t:'"그냥 사 먹으면 되잖아요."',a:-4,r:['@taean|…그렇쥬.','그가 웃었다. 입꼬리만. 그 웃음을 어디서 봤는지 생각났다. 고함을 들을 때 그가 짓던 얼굴이었다.']}],
   q2:[{t:'"내년엔 울타리 치자."',a:4,r:['@taean|내년… 내년에도 같이 해 주실 거여유?','@taean|그럼 수박도 심을게유. 수박은 혼자 못 키우거든유.']},
       {t:'"그 토마토, 반 나눠 먹어요."',a:4,r:['방울토마토를 반으로 나누는 건 생각보다 어려웠다. 즙이 태안의 손등으로 흘렀다.','@taean|헤헤. 반띵은 처음이네유.']}]})},
 {t:'느리다는 고함',p:['o_cafe','j_gukbap'],n:45,ev:2,q2:()=>[

 {t:'이불 말리는 날',p:['o_mount','o_cafe'],n:60,run:()=>({
   s:['볕 좋은 주말. 태안이 뒷산 빨랫줄에 이불을 널고 있었다. 그런데 표정이 평소와 달랐다.','@taean|…고향 농장에서 연락 왔어유. 농장주가 지 땅을 좀 떼 준대유. 해방 보상이라구.','@taean|졸업하면 내려오라구. 땅이 있으면 먹고 살 수 있응께.','@taean|근데… 지는 처음으로 여기가 좋아졌어유. 처음으로 지가 정하고 싶은 게 생겼는디, 그게 뭔지 모르겄어유.'],
   q:[{t:'"태안 씨가 원하는 걸로 해요. 어디든 응원할게요."',a:8,r:['@taean|원하는 거.','그가 이불을 탁탁 털었다. 햇볕 냄새가 퍼졌다.','@taean|…그럼 시간을 좀 주셔유. 지는 느리니께. 그래두 꼭 정할게유.']},
      {t:'"땅 받아서, 여기서 가까운 데 밭 해요."',a:10,r:['@taean|여기서… 가까운 데?','그가 눈을 크게 떴다. 그런 생각은 한 번도 해 본 적 없는 얼굴이었다.','@taean|그럼 매주 볼 수 있겄네유. 토마토도, 당신도.','@taean|…아이고. 방금 지가 무슨 말 했대유.']},
      {t:'"고향 가는 게 낫겠네요."',a:-5,f:'home',r:['@taean|…그렇쥬. 그게 맞겄쥬.','그는 이불을 걷었다. 아직 덜 말랐는데.']}],
   q2:[{t:'말린 이불에 같이 누워 본다',a:5,r:['햇볕에 데워진 이불이 폭신했다. 태안이 옆에서 눈을 감았다.','@taean|세상에서 젤 좋은 냄새쥬? …지금은 젤 좋은 게 하나 더 생겼어유.']},
       {t:'"농장주한테 화난 적 없어요?"',a:3,r:['@taean|…있어유. 많이.','@taean|근데 땅 준다니께 고맙기도 하구. 지 맘이 지도 모르겄어유. 이게 정상이에유?']}]})},
 {t:'지가 정한 거',p:['o_cafe','o_mount','j_gukbap'],n:75,conf:true,run:()=>({
   s:['졸업식 날, 학생식당 뒤. 태안이 도시락 통을 두 손으로 들고 서 있었다. 고기가 잔뜩 든.',

 {t:'움직임',p:['o_gym','j_port'],n:30,run:()=>({

 {t:'이름',p:['j_port','o_alley'],n:60,run:()=>({

 {t:'숲 깊은 곳',p:['o_forest'],n:30,run:()=>({
   s:['목요일 새벽. 캠핑카가 숲길 끝에서 멈췄다. 나무 사이에서 눈들이 반짝였다. 야생 무리였다. 사람 모습과 짐승 모습이 섞여 있었다.','계성이 상자를 내렸다. 약, 담요, 소금. 무리의 우두머리인 늙은 곰 수인이 나를 보고 으르렁댔다.','“'+(isH()?'인간':isM()?'혼혈':'낯선 '+P.kind)+' 냄새. 왜 데려왔나, 흑랑.”','@heukrang|내 사람이야. 걱정 마.','우두머리가 나에게 다가왔다. 코를 들이밀었다.'],
   q:[{t:'가만히 서서 냄새를 맡게 둔다',a:9,r:['숨이 멎을 것 같았다. 우두머리가 한참 내 냄새를 맡더니, 고개를 끄덕였다.','“…겁은 나는데 도망은 안 가는 냄새. 됐다.”','무리의 아이들이 상자 주변으로 몰려들었다. 한 아이가 내 손에 솔방울을 쥐여 주었다.','@heukrang|하하! 통과다. 나도 처음엔 세 번 떨어졌는데.']},
      {t:'담요를 직접 아이들에게 나눠 준다',a:8,r:['아이들이 처음엔 망설였다. 내가 담요를 펼쳐 가장 작은 아이 어깨에 덮어 주자, 하나둘 다가왔다.','우두머리가 그 모습을 오래 봤다. “…흑랑, 네 사람이 맞구나.”','@heukrang|그렇다니까.']},
      {t:'계성 뒤로 숨는다',a:2,r:['@heukrang|괜찮아, 괜찮아. 안 물어.','우두머리가 콧김을 내뿜고 돌아섰다. 다음 운송부터는 차에서 기다리라고 했다.']}],
   q2:[{t:'"이 일, 위험하지 않아요?"',a:4,r:['@heukrang|위험하지. 불법이니까. 걸리면 차 뺏기고 감방.','@heukrang|근데 이 애들은 도시 오면 서류도 없고, 이름도 없고. 나처럼 될 거야. 그래서 그냥 하는 거지.']},
       {t:'솔방울을 그에게 보여 준다',a:4,r:['@heukrang|오, 그거 무리에선 친구 하자는 뜻이야.','@heukrang|…나도 9살 때 하나 받았었는데. 잃어버렸네.']}]})},
 {t:'늦가을',p:['o_forest','o_coast'],n:45,ev:2,q2:()=>[
   {t:'"이상해지는 게 뭐예요?"',a:4,r:['@heukrang|짝 찾는 계절이야. 늑대는. 본능이 시끄러워져.','@heukrang|…그래서 거리 두라고 한 거야. 근데 네가 안 가니까 큰일이다.']},
   {t:'캠핑카에서 따뜻한 차를 같이 마신다',a:5,r:['좁은 캠핑카 안. 계성이 일부러 맞은편 끝에 앉았다. 꼬리만은 자꾸 내 쪽으로 넘어왔다.','@heukrang|…저 꼬리는 내 말 안 들어. 미안.']}]},
 {t:'단속',p:['o_coast','o_forest','j_port'],n:60,run:()=>({
   s:['방파제 공터. 경찰차 두 대가 캠핑카를 둘러싸고 있었다. 기범석이 서류를 들고 있었다.','@beomseok|흑랑. 밀수 혐의다. 차 수색한다.','@heukrang|하하, 범석이. 오랜만이다. 오늘 짐 없어. 운송 끝났거든.','기범석의 눈이 나에게 왔다. “…너 이 차 탄 적 있냐.”'],
   q:[{t:'"네. 무리에 약이랑 담요 나르는 거 봤어요."',a:9,r:['계성이 나를 돌아봤다. 기범석이 한참 침묵했다.','@beomseok|…약이랑 담요.','@beomseok|흑랑. 다음 운송, 적응지원센터 통해서 해. 서류 만들어 줄 테니까. 한 번만 봐준다.','경찰차가 떠나고, 계성이 크게 웃었다.','@heukrang|정직하게 말해서 살았네. 너 진짜 대단하다.']},
      {t:'"아뇨. 처음 보는 차예요."',a:-3,f:'lie',r:['기범석이 오래 나를 봤다. 그리고 서류를 접었다.','@beomseok|…그래. 오늘은 간다.','경찰이 떠나고, 계성이 웃지 않았다.','@heukrang|거짓말 시키려고 데려간 거 아니었는데.']},
      {t:'"센터를 통해서 합법으로 할 수 있게 도와주세요."',req:{study:35},a:11,r:['@me|무리 아이들 시민 등록, 센터에서 할 수 있잖아요. 제가 서류 준비할게요.','기범석이 고개를 끄덕였다. “…그렇게 되면 나도 편하지.”','1달 뒤, 야생 무리 아이 일곱 명이 처음으로 시민증을 받았다. 계성이 그 사진을 캠핑카 운전석에 붙였다.']}],
   q2:[{t:'"계성 씨라고 불러도 돼요?"',a:5,r:['@heukrang|…계성 씨.','@heukrang|그 이름 불러 주는 사람, 그 양반 말고 처음이다. 좋네. 계속 불러.']},
       {t:'"조수석, 계속 비워 둘 거죠?"',a:4,r:['@heukrang|당연하지. 거긴 이미 주인 있어.']}]})},
 {t:'고른 건 안 바꿔',p:['o_coast','o_forest'],n:75,conf:true,run:()=>({
   s:['겨울 첫눈. 캠핑카 옆 모닥불. 계성이 솔방울 하나를 내밀었다. 무리에서 받은 것과 똑같이 생긴.',
     rf('heukrang','lie')?'@heukrang|그때 날 위해 거짓말한 거 알아. 고마웠어. 근데 다음엔 안 해도 돼. 나 그냥 감방 가도 너 기다릴 테니까.':'@heukrang|흑랑 말고 계성이라고 불러 주는 사람, 너 하나면 돼.',
     '@heukrang|'+X.heukrang.conf]})}
];

 {t:'이관될 때 받은 이름',p:['o_center','j_center'],n:0,ev:0,q2:()=>[

   {t:'"왜 판을 까세요?"',a:5,r:['@raehyang|버릇이에요. 원하는 걸 말하면 안 주니까, 상대가 먼저 주고 싶게 만드는 거.','@raehyang|…들킨 건 처음이에요. 좀 창피하네.']},
   {t:'"다음엔 그냥 말해요. 내려 달라고."',a:4,r:['@raehyang|그냥 말하면 재미없잖아요.','그래도 다음 주, 그가 정말로 “저거 좀 내려 줄래요”라고만 말했다. 손이 닿는 높이였는데도.']}]},
 {t:'통역',p:['o_center','j_center'],n:30,run:()=>({
   s:['적응지원센터 상담실. 해외로 팔려 갔다가 송환된 인간 여성이 낯선 언어로 울먹이고 있었다. 고래향이 통역하고 있었다.','“…그녀는 주인 집에서 이름이 바뀌었대요. 세 번.”','상담사가 서류에 무언가를 적었다. 고래향의 목소리가 아주 조금 흔들렸다. 그가 손목의 머리끈을 만지작거렸다.','상담이 끝나자 그가 복도로 나가 창문을 열었다. 숨을 고르고 있었다.'],
   q:[{t:'옆에 서서 같이 바람을 맞는다',a:8,r:['한참 둘 다 말이 없었다.','@raehyang|…저도 이름이 바뀌었어요. 원래 이름은 레미였어요. 엄마가 지어 준.','@raehyang|이건 아무한테도 안 한 얘기예요. 판 깐 거 아니에요. 그냥… 나와 버렸어요.']},
      {t:'"그분, 원래 이름은 뭐래요?"',a:9,r:['@raehyang|…‘솔’. 소나무 솔.','@raehyang|아무도 그걸 안 물어봤어요. 서류엔 마지막 이름만 적혀요.','그가 상담실로 돌아가 서류의 이름 칸을 고쳐 달라고 말했다. 돌아오는 그의 얼굴이 처음으로 판을 깔지 않은 얼굴이었다.']},
      {t:'"강사님 일 진짜 멋있어요."',a:2,r:['@raehyang|그래요? 고마워요.','완벽한 미소였다. 그 뒤에 무엇이 있는지는 보이지 않았다.']}],
   q2:[{t:'"머리끈, 늘 만지시네요."',a:5,r:['@raehyang|엄마 거예요. 끌려갈 때 내 손목에 묶어 주고 갔어요.','@raehyang|…이것도 판 아니에요. 오늘은 진짜만 나오네.']},
       {t:'"매운 국물 먹으러 갈래요?"',a:4,r:['@raehyang|어떻게 알았어요. 제가 그거 좋아하는 거.','@me|판 깐 거예요.','그가 소리 내서 웃었다. 처음이었다.']}]})},
 {t:'레미',p:['o_center','j_center'],n:45,ev:2,q2:()=>[
   {t:'"레미."',a:6,r:['그의 연보라 눈이 크게 떠졌다.','@raehyang|…한 번 더.','@me|레미.','@raehyang|이름을 불리는 게 이런 거였구나. 잊고 있었어요.']},
   {t:'"어머니, 찾아보고 싶어요?"',a:4,r:['@raehyang|찾아봤어요. 기록이 없어요. 혼혈 관계로 끌려간 사람은 기록이 다 지워졌대요.','@raehyang|…그래도 가끔은 찾고 싶어요. 당신이 같이 찾아 준다면.']}]},
 {t:'판을 엎는 날',p:['o_center','j_center','o_library'],n:60,run:()=>({
   s:['센터 강의실. 고래향이 칠판 앞에 서 있었다. 그런데 수강생 대신 센터 운영위원장 백성호가 앉아 있었다.','@seongho|짧게 할게. 서류 검토 중에 나왔어. 고래향 강사, 혼혈이야. 서류상 인간으로 되어 있는 거, 신고 안 하면 문제 돼.','@seongho|혼혈은 2등급이야. 3등급 지원금 받았으니까 환수야. 규정이야.','고래향이 웃었다. 늘 짓던, 판을 까는 웃음이었다. 그런데 손이 떨리고 있었다.'],
   q:[{t:'"규정이 틀렸어요. 그분 어머니가 끌려간 이유가 그 규정이잖아요."',a:10,r:['백성호가 안경을 벗었다. 오래 침묵했다.','@seongho|…맞아. 그 규정, 내가 예전에 집행했어.','@seongho|환수는 보류할게. 대신 등급 정정 신청 같이 하자. 내가 의견서 쓸게. 길게.','고래향이 나를 봤다. 웃지 않았다.','@raehyang|…판을 엎어 줬네요. 처음이에요. 누가 내 대신.']},
      {t:'고래향이 직접 말하도록 옆에서 기다린다',a:8,r:['고래향이 한참 침묵하다 입을 열었다. 판 없이.','@raehyang|맞아요. 혼혈이에요. 숨겼어요. 들키면 엄마처럼 될까 봐.','@raehyang|이제 안 숨길게요. 레미예요. 아버지는 수인이었고, 어머니는 인간이었어요.','백성호가 고개를 끄덕였다. 서류를 덮었다.']},
      {t:'"…일단 규정대로 하는 게 낫지 않아요?"',a:-6,f:'rule',r:['고래향의 웃음이 완벽해졌다. 아무것도 새어 나오지 않는.','@raehyang|그렇죠. 규정대로.','그는 다음 날 환수 서류에 서명했다. 그 주 수업은 휴강이었다.']}],

       {t:'그의 손목 머리끈을 다시 묶어 준다',a:5,r:['@raehyang|…엄마가 이렇게 묶어 줬어요. 두 번 감고, 리본으로.','@raehyang|어떻게 알았어요.','@me|판 깐 거예요.','이번엔 그가 웃다가 울었다.']}]})},
 {t:'판 없이',p:['o_center','j_center'],n:75,conf:true,run:()=>({
   s:['졸업 즈음, 센터 옥상. 고래향이 머리를 풀고 있었다. 머리끈은 손목에 있었다.',

     '@raehyang|'+X.raehyang.conf]})}
];

 {t:'호수의 처장',p:['o_lake','lecture'],n:30,run:()=>({
   s:['새벽 호수공원. 태성우가 정장 차림으로 벤치에 앉아 오리에게 빵을 주고 있었다. 그 모습이 너무 어울리지 않았다.','@seongwoo|…새벽 산책이다. 학생은 왜 여기 있나.','@seongwoo|전처가 오리를 좋아했어. 이혼하고 나서 알았지. 매일 아침 여기 왔다는 걸.','@seongwoo|같이 살 때 한 번도 따라온 적이 없었어.'],
   q:[{t:'빵을 받아 같이 오리에게 준다',a:8,r:['둘이서 말없이 빵을 뜯었다. 오리들이 몰려들었다.','@seongwoo|…이렇게 하는 거였군. 같이 하는 거.','@seongwoo|30년 늦었어. 그래도 오늘 배웠다.']},
      {t:'"아드님들한테 연락해 보세요. 오늘."',a:9,r:['@seongwoo|…무슨 말을 하나.','@me|오리 얘기요.','그가 휴대폰을 오래 봤다. 그리고 메시지 하나를 단체방에 보냈다. ‘호수공원에 오리가 많다.’','10분 뒤 답이 왔다. 태제일: ‘아버지 해킹당했어요?’ 태제한: ‘…?’ 태제강: ‘사진 보내 주세요.’','태성우가 사진을 찍었다. 손이 떨리고 있었다.']},
      {t:'"정장 입고 오리 밥 주는 거 웃겨요."',a:-2,r:['@seongwoo|…그런가.','그가 빵 봉지를 접고 일어났다. 다음 날부터 그는 호수에 오지 않았다.']}],
   q2:[{t:'"내일도 와요. 저도 올게요."',a:4,r:['@seongwoo|학생이 새벽 여섯 시에 일어나나.','@seongwoo|…조식 쿠폰 한 장 더 주지. 오면.']},

 {t:'낡은 수첩',p:['lecture'],n:45,ev:2,q2:()=>[

 {t:'가족 식사',p:['lecture','o_lake','o_center'],n:60,run:()=>({
   s:['일요일 저녁, 한식당 별실. 태성우가 세 아들을 불렀다. 15년 만이라고 했다. 그리고 왜인지 나도 불렀다.','태제강은 수첩을 펴고 있었다. 태제일은 의자를 젖히고 웃고 있었다. 태제한은 말이 없었다. 공기가 얼어붙어 있었다.','@seongwoo|…다들, 밥은 먹었나.','아무도 대답하지 않았다.'],
   q:[{t:'"처장님 수첩 얘기 해 주세요."',a:10,r:['태성우가 나를 봤다. 그리고 천천히 낡은 수첩을 꺼냈다.','@seongwoo|…제강이 10살, 142센티. 제일이 10살, 139. 제한이 10살, 145. 제일 컸지.','세 아들이 동시에 고개를 들었다. 태제일의 웃음이 멈췄다. 태제한의 오드아이가 흔들렸다.','@jegang|…그걸, 다 적으셨어요?','@seongwoo|매년. 경쟁시키면서도. …미안하다. 그 말 하려고 불렀어.']},
      {t:'분위기를 풀려고 먼저 고기를 굽는다',a:7,r:['내가 불판에 고기를 올리자, 태제일이 웃음을 터뜨렸다. “손님이 고기 굽는 집이네.”','태제한이 집게를 뺏어 갔다. “내가 할게. 너 못생기게 굽잖아.”','태성우가 그 모습을 보다가 아주 작게 웃었다. 처음으로.']},
      {t:'"저는 빠질게요. 가족끼리 하세요."',a:-4,f:'leave',r:['@seongwoo|…그래.','나는 별실을 나왔다. 그날 식사가 10분 만에 끝났다는 이야기를 나중에 들었다.']}],
   q2:[{t:'"다음 달에도 모여요."',a:4,r:['@jeil|아버지가 쏘시면요.','@seongwoo|…쏘지. 매달.','@jehan|…매달은 무리야. 2달에 한 번.']},

 {t:'따뜻한 대답',p:['lecture','o_lake'],n:75,conf:true,run:()=>({

     '@seongwoo|'+X.seongwoo.conf]})}

 {t:'옛 제자',p:['o_center','j_center'],n:30,run:()=>({
   s:['센터 법률 교실. 수강생 중 한 명이 계속 태제강을 노려보고 있었다. 수업이 끝나자 그가 다가왔다.','“…선생님. 저 기억하세요? 교육 기관 14기. 예절반.”','태제강이 수첩을 펼쳤다. 넘기는 손이 멈췄다.','@jegang|…14기 23번. 이재훈. 왼손잡이. 늘 창가 자리.','@jegang|…기억해. 전부.','“그때 왼손 쓰면 맞는다고 가르치셨죠. 지금도 오른손으로 밥 먹어요. 왼손 쓰면 몸이 굳어요.”'],
   q:[{t:'두 사람에게 차를 내오고 기다린다',a:8,r:['둘은 1시간 동안 마주 앉아 있었다. 대부분 침묵이었다.','이재훈이 떠나고, 태제강이 수첩에 무언가를 적었다. ‘14기 23번. 이재훈. 왼손잡이. 사과함. 용서 없음. 정당함.’','@jegang|…있어 줘서 고마워. 기록할게. 이것도.']},
      {t:'"오늘 왼손으로 같이 밥 먹어요. 셋이서."',a:10,r:['센터 식당. 셋이서 왼손으로 숟가락을 들었다. 태제강도. 셋 다 국을 흘렸다.','이재훈이 처음으로 웃었다. “…선생님 진짜 못하시네.”','@jegang|…응. 왼손은 처음이라.','그날 태제강의 수첩엔 이렇게 적혔다. ‘왼손 식사. 국 흘림. 23번 웃음. 처음 봄.’']},
      {t:'"선생님은 그때 시키는 대로 하신 거잖아요."',a:-4,f:'excuse',r:['이재훈의 얼굴이 굳었다. 태제강이 손을 들어 나를 막았다.','@jegang|…아니. 내가 한 거야. 내 손으로.','이재훈은 아무 말 없이 나갔다. 태제강은 그날 수첩을 펴지 않았다.']}],
   q2:[{t:'"수첩에 사과한 거 다 기록하세요?"',a:4,r:['@jegang|응. 해방 후 만난 옛 수강생 마흔일곱 명.','@jegang|용서한 사람 셋. 그 셋 이름은 매일 봐. 그게 내가 살아도 되는 이유 같아서.']},
       {t:'"오늘은 기록 말고 그냥 쉬어요."',a:5,r:['@jegang|…기록을 안 하면 뭘 해.','@me|저랑 걸어요.','그가 수첩을 닫았다. 처음으로, 펜을 꽂지 않은 채.']}]})},
 {t:'형제의 전화',p:['o_center','j_center'],n:45,ev:2,q2:()=>[
   {t:'"동생분들이랑 밥 한번 드세요."',a:4,r:['@jegang|아버지가 그러자더라. 요즘. 이상하게.','@jegang|…네가 뭐 한 거 아니지? 관찰해 보면 알게 되겠지만.']},

 {t:'관찰을 멈추는 날',p:['o_center','j_center'],n:60,run:()=>({
   s:['센터 상담실, 늦은 밤. 태제강이 수첩 한 권을 내 앞에 놓았다. 표지에 내 이름이 적혀 있었다.','@jegang|4년치. 너에 대한 기록.','@jegang|해방 전엔 이렇게 사람을 기록해서 ‘교정’했어. 무엇이 문제인지, 어디를 고칠지.','@jegang|…너한텐 고칠 게 하나도 안 적혀 있어. 처음이야. 그래서 이걸 어떻게 해야 할지 모르겠어.'],

   q2:[{t:'"서두르지 않는 거, 좋아요."',a:4,r:['@jegang|기다리는 거 잘해. 끝까지 지켜보는 거.','@jegang|…근데 너한텐 이제 좀 서두르고 싶어졌어.']},
       {t:'그의 펜을 빌려 손바닥에 하트를 그린다',a:5,r:['@jegang|…이건 무슨 기록이야.','@me|관찰 결과요.','그가 손바닥을 오래 봤다. 그날 그는 손을 씻지 않았다고, 나중에 고백했다.']}]})},
 {t:'이번엔 내가 갈게',p:['o_center','j_center'],n:75,conf:true,run:()=>({
   s:['졸업 즈음 일요일. 센터 앞 산책로. 태제강이 수첩 없이 서 있었다. 손이 허전해 보였다.',
