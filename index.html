gangsik:{s:'수영 시합 하겠습니다. 해군 출신이라 질 수 없습니다. …져 드릴까요? 아닙니다. 정정합니다. 같이 헤엄치겠습니다.',w:'귤을 열 개 까 놓았습니다. 다 드십시오. 저는 이미 스무 개 먹었습니다.',m:'보고드립니다. 결혼을 제안합니다. 4년 동안 매주 고백했으니, 이제 평생 매일 하겠습니다.',k:'…밥을 오 인분 먹었습니다. 기뻐서 배가 고픕니다. 처음입니다.',r:'잘못했습니다. 농담을 몰라서 상처를 드렸습니다. 이제부터 배우겠습니다. 오늘부터.',b:'목표가 무너졌습니다. …그래도 밥은 꼭 챙겨 드십시오. 그것만 지켜 주십시오.',o:'오늘도 말씀드리겠습니다. 좋아합니다. 마지막이라 두 번 말씀드리겠습니다. 좋아합니다.',e:'사강식은 해양경찰서장으로 은퇴했다. 퇴임식 연설은 단 한 줄이었다. “밥 잘 먹고, 사랑하는 사람한테 매일 말하십시오.”'},
dohae:{s:'남쪽 바다는 물빛이 다르다. 니 데리고 오고 싶었다, 여기.',w:'눈 오는 바다 처음 보나. 내도 니랑 보는 건 처음이다.',m:'배 한 척 샀다. 이름은 니 이름으로 붙였다. …타라. 평생.',k:'이 쪼끄만 기 우리 집 막내다. 아부지 안 돌아온 바다, 이놈한텐 좋은 바다로 만들어 줄 끼다.',r:'내가 성질이 더럽다. 알제. 그래도 니한테는 고칠라 칸다. 미안타.',b:'니 잘 가라. 바다는 넓다. 어디서든 다시 볼 일 있겠지.',o:'니 덕에 먼바다 안 갔다. 여서 니 옆에 있는 기 더 좋았다.',e:'심도해의 어선은 북항에서 가장 오래 바다에 나갔다. 선실 벽에는 국밥집 할머니 사진과 함께 찍은 가족사진이 걸려 있었다.'},
gihyeon:{s:'해외는 처음이지? 걱정 마, 형이 다 알아봤어. 너는 보기만 해.',w:'온천은 내가 통째로 빌렸어. 농담 삼, 진심 칠. …진짜 빌렸어.',m:'오래 기다렸어. 기다리는 거 잘하는데, 이건 더는 못 기다리겠다. 결혼하자, 막내야.',k:'삼키고 싶을 만큼 작네. 아니, 농담이야. 지키고 싶을 만큼 작다.',r:'숫자로 다 읽히는데, 네 속은 아직도 못 읽어. 그래서 미안하다는 말도 늦었어.',b:'22층 창가 자리, 그대로 비워 둘게. 언제든. 그게 내 마지막 숫자야.',o:'평생 숫자만 셌는데, 너랑 산 날은 세다가 그만뒀어. 너무 많아서.',e:'바 「침향」 22층 창가 자리엔 끝까지 ‘예약’ 팻말이 놓여 있었다.'},
gisan:{s:'우리 막내 수영복 예쁘다. 아니 진짜로. 사진 찍자, 백 장.',w:'눈사람 만들자. 너 닮게. …망했다. 나 닮았다. 그럼 둘이 합치자.',m:'나 원래 눈에 들어온 건 일단 잡는다고 했잖아. 근데 이번엔 평생 잡고 있을래. 결혼하자.',k:'형이 삼촌 된다고 울더라. 나는… 아니, 나도 운다. 웃기다.',r:'얼굴에 다 나와서 숨길 수가 없네. 미안해. 진짜 미안해.',b:'웃음기만 남은 얼굴로 보내 줄게. …웃는 거 맞지? 맞다고 해 줘.',o:'10년 지기처럼 굴었는데, 진짜 평생 지기가 됐네. 잘 살았다, 우리.',e:'서기산은 호텔 가람의 대표가 되었다. 신입 직원들은 그가 처음 보는 사람에게도 10년 지기처럼 웃는다고 했다.'},
jaeha:{s:'…햇빛 너무 세. 근데 너 웃는 거 보이니까, 그늘 안 들어갈래.',w:'눈 오는 밤은 조용해서 좋아. 사람도, 화면도 없고. 너만 있고.',m:'혼인신고서, 전산에 미리 넣어 뒀어. …아, 이건 물어보고 했어야 했나. 물어볼게. 결혼해 줄래?',k:'얘는 내 눈 안 피해. 처음부터 똑바로 봐. …너 닮아서.',r:'화면 말고 입으로 말할게. 미안해. 내가 숨었어.',b:'네 기록은 다 지웠어. 근데 기억은 못 지우겠다. …잘 지내.',o:'커튼 열어 줘. 마지막은 화면 말고, 진짜 빛 속에서 너 보고 싶어.',e:'‘머드’라는 이름은 업계에서 사라졌다. 대신 인간 피해자들의 기록을 되살려 주는 익명의 복원 프로그램이 생겼다.'},
sanggi:{s:'오늘 운세 대길. 바다 대길. 너 대길. …셋 다 맞았다.',w:'타로 뽑았는데 다 좋은 카드야. 이상하다. 너랑 있으면 나쁜 카드가 안 나와.',m:'주사위 굴려 봤어. 여섯 번 다 6 나왔어. …사실 6 나올 때까지 굴렸어. 결혼하자.',k:'이 애 생일, 운세 다 찾아봤어. 다 대길이야. …나 이제 운세 안 봐도 될 것 같아.',r:'주사위 대신 너한테 물어보기로 했잖아. 그 약속 어겼어. 미안해.',b:'수첩 마지막 장에 적었어. ‘친구가 떠났다. 그래도 친구였다.’',o:'오늘 운세는 안 봤어. 무슨 날이든, 너랑 있으니까 대길이야.',e:'교상기의 수첩 스물두 개 목록은 마지막 줄까지 전부 지워져 있었다. 옆에는 한 단어씩 적혀 있었다. ‘같이.’'},
husan:{s:'바다! 휴산은 바다 처음이야! 짠물이야! 너도 먹어 봐!',w:'눈 위에 발자국 봐. 휴산 거랑 너 거. 나란히 있어.',m:'무리에선 짝 되면 같이 자고 같이 먹어. 학교에선 결혼이래. 그거 하자. 휴산이랑.',k:'아기가 휴산 꼬리 잡았어! 안 놔! …휴산도 안 놓을 거야. 평생.',r:'휴산이 짐승 돼서 미안해. 근데 너 목소리는 들렸어. 그래서 돌아왔어.',b:'…냄새 기억할 거야. 너 냄새. 숲에 가도.',o:'휴산은 비 오는 날 주워졌어. 근데 너한테는 휴산이 찾아간 거야. 기억해.',e:'뒷산의 그 나무 밑엔 해마다 매끈한 돌이 하나씩 늘었다. 마지막엔 마흔일곱 개였다.'},
gunha:{s:'콩알, 수영 못 하지? 내 등에 타. 국가대표 등이다.',w:'올림픽 끝나고 첫 휴가야. 메달은 집에 두고 왔어. 너만 데려왔어.',m:'표적 대신 너 쏜다고 했지. 명중이다. 결혼하자, 콩알.',k:'아버지가 처음으로 잘했다고 하셨어. 손주 안고. …나 울어도 되냐.',r:'예전처럼 말 안 하고 버티려다가, 너 생각나서. 미안하다.',b:'0.1점 차이로 졌다. 이번엔 너한테. …잘 가, 콩알.',o:'평생 10.9만 쐈는데, 제일 잘 맞힌 건 너였다.',e:'강건하는 은퇴 후 유소년 사격 코치가 되었다. 인간 아이들을 받은 첫 사격장이었다.'},
danho:{s:'바다 처음이에요. …아니, 어릴 때 형이랑 한 번. 이번이 두 번째예요. 제가 골라서 온 첫 번째.',w:'눈길은 제가 앞에 걸을게요. 넘어지면 제가 먼저 넘어지게.',m:'제가 정했어요. 처음으로, 제일 큰 거. 결혼해 주세요.',k:'이 애한텐 고르는 법부터 가르칠게요. 메뉴판 보는 거. 제가 제일 늦게 배운 거.',r:'늦게 알아서 미안해요. 아픈 것도, 서운한 것도. 이제 말할게요.',b:'…늘 다니던 길로 갈게요. 그래도 가끔은, 돌아서 올게요.',o:'처음 정한 게 당신이었어요. 마지막까지 그거 하나는 안 바꿨어요.',e:'유단호와 유단태는 같은 동네에 살았다. 일요일마다 국밥집에서 형제가 서로 메뉴를 골라 주었다.'},
jigwang:{s:'바다 위를 날면 너 보여 주고 싶었어. 꽉 잡아.',w:'둥지에 담요 하나 더 깔았어. 겨울이니까. 너 거야.',m:'다 주워서 산 인생인데, 너는 주운 게 아니라 네가 온 거잖아. 그러니까 가둬 둘게. 평생, 탑 꼭대기에.',k:'알이 깨졌어. 검붉은 솜털. …내가 처음으로 주운 게 아니라 생긴 거야.',r:'의심해도 돼. 근데 떠나지만 마. 그거면 돼.',b:'…날개 있으니까 쫓아갈 수도 있는데. 안 갈게. 그게 맞으니까.',o:'계단 없는 탑에 너 데려온 거, 평생 제일 잘한 거야.',e:'남지광은 실종 아동 수색대의 고문이 되었다. 그가 찾아낸 아이들은 모두 이름이 적힌 깃털 하나씩을 받았다.'},
seongae:{s:'바닷가 해산물 무한리필이래요. 계산 끝났어요. 우리가 이득이에요.',w:'온천 달걀 열 개 샀어요. 다섯 개는 당신 거. …네 개요. 하나는 제가 먹었어요.',m:'장부 정리했어요. 받은 게 너무 많아서 평생 갚아야 계산이 맞아요. 그러니까 결혼해요.',k:'이 애는 배고픈 걸 몰랐으면 좋겠어요. 내일도 밥이 나온다는 걸, 처음부터 믿었으면.',r:'계산 틀렸어요. 제가. 다시 할게요. 같이 해 줘요.',b:'장부에 적어 둘게요. 갚을 거 하나 남았다고. …언젠가.',o:'계산해 봤는데요, 같이 먹은 밥이 이만 칠천 끼예요. 하나도 안 아까웠어요.',e:'유성애는 기관 출신 인간을 위한 금융 교육 재단을 세웠다. 재단 식당은 누구에게나 공짜였다.'},
jehan:{s:'선크림 다시 발라. 등은 내가 해 줄게. …못생기게 타면 안 되니까.',w:'온천은 혈액순환에 좋아. 의학적으로. …그리고 너랑 있으면 좋아. 비의학적으로.',m:'못생겼다는 말 반대말, 평생 말해 줄게. 결혼하자.',k:'뼈는 다 뼈라고 했지. 근데 이 뼈는 세상에서 제일 작고 예쁘다. …처음으로 진단이 아니라 감상이다.',r:'수술보다 어렵네, 이거. 미안하다. 못생기게 굴었어.',b:'…못생겼네. 오늘 유난히. 잘 가.',o:'평생 못생겼다고 했지. 거짓말이었어. 처음부터 끝까지.',e:'태제한은 외상센터장으로 은퇴했다. 그의 진료 기록엔 종족 칸이 없었다. 중증도 칸만 있었다.'},
haeseong:{s:'파도 소리는 괜찮습니다. 일정해서. 당신 숨소리처럼.',w:'두 잔째 보이차 따르겠습니다. 이번엔 제가 먼저.',m:'원하는 걸 하나 더 찾았습니다. 당신과 결혼하는 것. 이게 마지막 목록이길 바랍니다.',k:'이 아이는 원하는 걸 바로 말했으면 좋겠습니다. 저처럼 30살까지 기다리지 말고.',r:'손가락이 멈추질 않았습니다. 당신이 없어서. 미안합니다. 돌아와 주십시오.',b:'원하는 걸 놓아주는 것도… 원하는 것에 들어갑니까. 잘 가십시오.',o:'세지 않아도 됩니다. 당신 손 위에선, 늘 그랬습니다.',e:'이해성의 어머니는 봉제 일을 그만두고 아들 내외 옆집으로 이사 왔다. 셋은 매주 사이렌 없는 영화를 봤다.'},
yuhong:{s:'바다다아아! 꼬리가 젖어도 상관없어요! 헤헤!',w:'눈사람 만들었어요! 귀 두 개 달았어요! 늑대예요! …안 닮았다고요?',m:'저 아빠한테 먼저 보고했어요! 아빠가 잘했대요! 결혼해 주세요! 아, 대답 무서운데 그래도 들을래요!',k:'아빠가 손주 도시락 싼다고 난리예요. 저는… 아빠처럼 될 수 있을까요. 아니, 아빠보다 더 많이 사랑한다고 말할래요.',r:'으르렁거려서 미안해요. 꼬리가 다 말해 버렸죠. 저 진짜 미안해요.',b:'…꼬리가 처지는 거 안 보이게 뒤돌아 갈게요. 행복하세요.',o:'처음 옆자리 앉았을 때부터 꼬리가 말을 안 들었어요. 마지막까지 그래요. 헤헤.',e:'하유홍은 결국 한경중공에 들어가지 않았다. 직접 차린 작은 회사 이름은 ‘옆자리’였다.'},
jeil:{s:'비번이야. 사이렌 없는 휴가. 너 웃는 거 하루 종일 볼 수 있겠다.',w:'눈 오는 날은 사건이 적어. 그러니까 오늘은 너만 볼래.',m:'양심 없어진 김에 끝까지 가자. 결혼하자. 반은 농담 아니야. 전부 진심이야.',k:'이 녀석 무릎 꿇고 눈높이 맞춰서 봤어. 3년 걸려 배운 거, 처음으로 집에서 썼다.',r:'현장에선 무서운 놈이 이긴다고 했지. 집에선 아니더라. 미안해.',b:'…잘 가. 위험한 데는 가지 말고. 그건 진심이야. 전부.',o:'오늘 하루 중에 제일 결과가 좋았던 거. 평생, 매일, 너였어.',e:'태제일은 형사과장이 되었다. 신입 형사들은 첫날 무릎 꿇는 법부터 배웠다.'},
changoh:{s:'그림자 없이 햇빛 아래 서는 건 처음입니다. 당신 덕분입니다.',w:'눈 내리는 밤 산책, 이번엔 끝까지 걸어도 되겠습니까.',m:'계산은 끝났습니다. 남은 건 서명뿐입니다. 제 이름 옆에, 당신 이름을.',k:'이 아이는 순혈인 척하지 않아도 됩니다. 처음부터, 있는 그대로.',r:'숨기지 않기로 했는데, 또 숨겼습니다. 미안합니다. 다 말하겠습니다.',b:'…당신을 지키는 방법이 떠나는 것뿐이라면, 그러겠습니다.',o:'평생 계산했는데, 당신 앞에서만 계산이 안 됐습니다. 그게 제 인생에서 제일 좋은 오류였습니다.',e:'현창오는 어머니를 찾아갔다. 적응지원센터 명단 속의 늙은 인간 여성은 그를 한눈에 알아봤다.'},
seongho:{s:'바다. 짧게 말할게. 좋다.',w:'담요 두 장 가져왔어. 소파 없어도 늘어질 수 있게.',m:'관찰 결과 다시 나왔어. 결혼하자. 반복 설명 안 한다. …한 번만 더 말할게. 결혼하자.',k:'이 애 이름은 번호 말고 이름으로만 부를 거야. 서류에도, 입으로도.',r:'길게 말 안 할게. 내가 틀렸어. 미안해.',b:'짧게 할게. 고마웠어. 길게 하면 못 보낼 것 같아서.',o:'일요일 같았어. 너랑 산 거 전부. 아무것도 안 해도 좋은 날.',e:'백성호는 은퇴 후 센터에 소파 하나를 기증했다. 명패엔 ‘아무것도 안 해도 되는 자리’라고 적혀 있었다.'},
chiyeol:{s:'보고드립니다. 오늘 일정은 없습니다. 그러니까 하루 종일 {N} 씨와 있겠습니다.',w:'온천 예약 완료했습니다. 유홍 씨에게도 보고했습니다. 축하한다고 합니다.',m:'결론부터 말씀드립니다. 혼인을 신청합니다. 근거는 별첨 없이, 제 마음입니다.',k:'유홍 씨가 형이 되었습니다. 저는… 보고서에 쓸 말이 없습니다. 너무 기뻐서.',r:'감정을 지우는 훈련을 받았습니다. 그런데 당신에 대한 건 지워지지 않습니다. 미안합니다.',b:'보고드립니다. 오늘부로… 아닙니다. 이건 보고서로 못 쓰겠습니다.',o:'마지막 보고입니다. 평생 {N} 씨가 보고 싶었습니다. 이상입니다.',e:'하치열의 레시피 노트는 두 권이 되었다. 한 권은 유홍의 것, 한 권은 우리 집의 것.'},
hwasu:{s:'오늘은 안 웃어도 되는 날이에요. 근데 자꾸 웃음이 나요. 진짜로요.',w:'우유 데워 왔어요. 토끼 엄마처럼. 이번엔 제가.',m:'좋아하는 사람은 다 사라진다고 했죠. 당신은 안 사라졌어요. 그러니까 평생 옆에 있어 줘요.',k:'이 애한텐 진짜 웃음만 가르칠래요. 입꼬리만 올리는 거 말고.',r:'또 웃으면서 숨겼어요. 미안해요. 이번엔 울면서 말할게요.',b:'…웃으면서 보낼게요. 이건 연기 아니에요. 그래도 아파요.',o:'당신 앞에서 처음으로 진짜 얼굴을 했어요. 마지막도 이 얼굴이에요.',e:'금화수가 연출한 연극 『토끼 가족』은 10년 넘게 무대에 올랐다. 막내 역은 늘 인간 배우가 맡았다.'},
juyeong:{s:'야, 바다 바이크로 달리자. 무서우면 존나 꽉 잡아.',w:'눈 오는 날엔 관사에서 애니 정주행이지. 52화. 울면 비밀이다.',m:'나 응석받이라 원하는 거 꼭 가져야 돼. 평생. 결혼하자, 씨발. 아니, 결혼해 주세요.',k:'형들이 나 키운 것처럼 키울 거야. 근데 다치게는 안 할 거야. 내가 다 막을 거야.',r:'씨발, 내가 잘못했어. 응석 부릴 게 따로 있지. 미안해.',b:'…편지 열두 통, 다 가지고 있을게. 백 번씩 읽을게.',o:'보고 싶다 씨발. 그 말, 평생 너한테만 했다.',e:'백주영은 장군으로 진급하던 날, 인간 후보생 규정을 없애는 첫 문서에 서명했다.'},
taean:{s:'바다는 볕이 세네유. 그래두 이불 말리기 딱 좋겄어유.',w:'눈 오는 날엔 땅이 쉬어유. 우리두 좀 쉬어유. 같이.',m:'지가 정한 거 두 번째예유. 첫 번째는 사귀자는 거였구. 결혼해 주셔유. 진짜루.',k:'이 애는 느려도 돼유. 꼼꼼한 거니께. 지가 다 기다려 줄 거여유.',r:'화내는 법 연습했는디… 결국 미안하다는 말이 먼저 나오네유. 미안해유.',b:'…천천히 가셔유. 지는 느리니께, 잊는 것도 느릴 거여유.',o:'볕에 말린 이불보다, 당신 옆이 젤 좋았어유. 평생.',e:'지태안의 밭은 해마다 넓어졌다. 수확한 토마토 중 제일 빨간 건 늘 한 사람 몫이었다.'},
haetan:{s:'…바다는 이제 무섭지 않습니다. 쉬는 날에 보는 바다라서.',w:'눈 위를 걸으면 발소리가 안 납니다. 쫓기는 게 아니라, 산책입니다. 처음 알았습니다.',m:'사는 걸 생각하게 해 준 사람한테, 평생 같이 살자고 말하고 싶습니다. 결혼해 주십시오.',k:'이 아이는 싸우지 않아도 밥을 먹을 겁니다. 도윤이한테도 말했습니다.',r:'혼자 삭이는 게 버릇이라. 미안합니다. 이제 말하겠습니다.',b:'…살아 있겠습니다. 당신이 그러라고 했으니까.',o:'도윤이가 살라고 했고, 당신이 같이 살아 줬습니다. 고맙습니다. 둘 다.',e:'공해탄은 투기장 생존자 모임을 만들었다. 모임의 첫 행사는 바다를 보며 이름을 부르는 것이었다.'},
piljung:{s:'아가, 수평선 봐. 아무것도 기대 안 하는 거. …근데 나는 이제 너한테 기대하는 게 많아.',w:'인형 하나 더 만들었어. 눈사람 입은 너. 이름은 당연히 네 이름.',m:'인형 말고 진짜를 평생 갖고 싶어. 결혼하자, 아가.',k:'이 애한테는 관심 많은 아빠가 될 거야. 내가 못 받은 거, 다.',r:'무관심한 척했어. 버릇이야. 미안해, 아가. 사실 너한테만은 관심이 넘쳐.',b:'인형은 두고 갈게. 네 이름 붙은 거. …아니, 가져갈게. 그것까진 못 놓겠다.',o:'서른세 번째 인형이 너였어. 그 뒤로는 인형 안 만들었어. 진짜가 있으니까.',e:'이필중의 인형 서른세 개는 은퇴 후 해군 박물관에 기증되었다. 맨 앞의 두 개만은 집에 남았다.'},
yeonhu:{s:'바닷가 디저트 투어! All on me! 너는 먹기만 해!',w:'호떡 구워 왔어. 눈 오는 날엔 이게 최고야. Trust me.',m:'I can\'t wait anymore. 결혼하자. 오른쪽에서 대답해 줘. 잘 들리게.',k:'이 애 귀 봐! 나 닮아서 엄청 커. 근데 양쪽 다 잘 들려. …다행이다.',r:'Sorry. 진짜로. 영어 말고 한국어로 할게. 미안해.',b:'…It\'s fine. 원래 이래. 아니, 안 괜찮아. 그래도 보내 줄게.',o:'오른쪽에 있어 줘서 고마워. 평생. Seriously.',e:'지연후의 가판대는 ‘연후 디저트’라는 작은 가게가 되었다. 오른쪽 창가 자리는 늘 예약석이었다.'},
taegyun:{s:'파도 소리가 일정하지 않군요. 예상 밖입니다. 좋습니다.',w:'시계는 집에 두고 왔습니다. 눈 오는 날은 시간을 재고 싶지 않아서.',m:'예상이 안 되는 사람과 평생을 보내는 것. 가장 비효율적이고, 가장 흥미로운 선택입니다. 결혼해 주시겠습니까.',k:'이 아이는 정리되지 않아도 됩니다. 흐트러진 채로, 예상 밖으로 자라길.',r:'정리하려고 했습니다. 당신까지. 그게 잘못이었습니다. 미안합니다.',b:'…예상했던 결론입니다. 그런데 처음으로, 예상이 틀렸으면 했습니다.',o:'당신은 끝까지 정리가 안 됐습니다. 그래서 평생 지루하지 않았습니다.',e:'고태균이 제출한 관계감독국 기록은 해방 이전 인간 피해자 명부 복원의 핵심 자료가 되었다.'},
gyeonu:{s:'장갑 안 가져왔어. 바닷물 묻어도 괜찮아. 네 손이니까.',w:'겨울 바다 찍으러 왔는데, 사진은 안 찍어. 손 잡느라 바빠서.',m:'계산 끝났어. 너야. 결혼하자. 사진은 평생 내가 찍을게.',k:'이 애 손은 처음부터 잡았어. 장갑 없이. 한 번도 안 무서웠어.',r:'다시 장갑 꼈었어. 무서워서. 미안해. 벗을게, 지금.',b:'…손 씻을게. 네 손 감촉 지워지기 전에. 아니, 안 씻을래.',o:'평생 남의 손이 무서웠는데, 네 손은 마지막까지 따뜻했어.',e:'한견우는 마흔다섯에 처음으로 좋은 사람 역을 맡았다. 시사회 첫 줄엔 한 사람만 앉아 있었다.'},
dantae:{s:'바다까지 걸어왔어요. 아무도 안 쫓아오는 길로. 당신이랑.',w:'눈길에 발자국이 두 개예요. 서른한 번째 말, 이제 소리 내서 해요. 우리는 자유로워요.',m:'원하는 거 말하면 뺏긴다고 배웠는데, 당신은 안 뺏어 갔어요. 그러니까 한 번 더 말할게요. 결혼해요.',k:'이 애한텐 서른한 번째 말 같은 거 필요 없겠죠. 첫 번째부터 자유니까.',r:'또 숫자를 맞춰 줬어요. 버릇이. 미안해요. 다시 고칠게요.',b:'…다 보여요, 그런 거. 당신이 떠날 거라는 것도. 잘 가요.',o:'일요일마다 걸었죠. 천천히. 마지막 일요일까지.',e:'유단태가 쓴 『서른한 번째 말』은 적응지원센터의 필독서가 되었다.'},
dohan:{s:'밥은 먹었냐. 바다 왔으면 회 먹어야지. 어머니가 꼭 먹으라더라.',w:'산골 집에 눈 쌓였다. 지붕 또 고쳐야 돼. 같이 올라가자.',m:'거짓말 안 한다. 결혼하자. 어머니가 벌써 국 끓이고 계신다.',k:'어머니가 손주 업고 춤을 추신다. 나는… 밥이나 먹자. 목이 메서.',r:'거짓말한 거 아닌데, 말 안 한 것도 거짓말이더라. 미안하다.',b:'…밥은 꼭 먹고 다녀라. 그거 하나만.',o:'좁은 소파가 편하다고 했지. 너 옆이 제일 좁고, 제일 편했다.',e:'강도한은 회장직에서 물러난 뒤 산골로 돌아갔다. 마을 사람들은 그가 고장 난 경운기를 공짜로 고쳐 준다고 했다.'},
beomseok:{s:'고깃집 갔다가 바다 가자. 열 인분 먹고 수영하면 안 되나. …안 되겠지.',w:'곰은 겨울잠 자는데. 오늘은 안 잔다. 너랑 있으니까.',m:'직설적으로 할게. 결혼하자. 혼자 두기 싫어. 평생.',k:'이 작은 손. 이런 손들 찾는 게 내 일이었는데. 이젠 지키는 게 내 일이다.',r:'유머 감각 없어서 돌려 말 못 해. 내가 잘못했다.',b:'…혼자 다니지 마. 그게 다다. 걱정돼서 하는 말이다, 씨발.',o:'곰탕 농담. 그거 평생 기억했다. 하나도 안 웃긴데 웃겼어.',e:'기범석의 수사팀은 실종 사건 해결률 1위를 10년 동안 지켰다. 사무실 벽엔 이백 장짜리 전단 한 장이 액자로 걸려 있었다.'},
dosan:{s:'바다 냄새 좋다. 피 냄새 안 나서.',w:'숲 산책. 사냥 말고. 약속 지킨다, 진돗개는.',m:'한 사람만 곁에 둘 거라고 했지. 서류로 남기자. 그래야 아무도 못 뺏어 가.',k:'이 애 냄새, 평생 안 잊는다. 너 냄새랑 섞여 있어서.',r:'…말없이 화냈다. 미안하다. 말로 할게.',b:'곁에 한 사람만 둔다고 했는데. 그 자리, 비워 둔다. 평생.',o:'철문 닫은 날부터 지금까지, 네 쪽으로 걸어왔다. 잘 왔다.',e:'우도산은 남지광과 함께 실종 아동 수색대에서 일했다. 둘은 여전히 서로를 멍청한 개, 멍청한 새라고 불렀다.'},
pilyeon:{s:'바닷가에서 마지막 춤 틀자! 지는 사람이 분식 쏘기!',w:'눈싸움 내기! 이기면 소원 하나! …내 소원? 너랑 평생 떡볶이 먹기.',m:'내기 안 해. 이건 그냥 이기고 싶어. 결혼하자!',k:'얘 눈 봐! 양쪽 색이 달라! 나 닮았어! 과학이야!',r:'하하… 아니, 웃을 일 아니지. 미안해. 진짜로.',b:'…이번 판은 내가 졌다. 분식은 내가 쏠게. 마지막으로.',o:'떡볶이보다 네가 더 좋다고 했지. 과학적으로 증명됐어. 평생 걸려서.',e:'김필연은 끝내 대령까지만 진급했다. 퇴역식 날, 탈출선에 탔던 사십 명 중 열한 명이 찾아왔다.'},
jaegyun:{s:'바닷가 찻집 찾아 뒀어. 책도 가져와. 조용히 있자.',w:'눈 오는 날 녹차는 우전이 좋아. 부드러워. 너처럼.',m:'기다림 끝에 변화가 없으면 직접 움직인다고 했지. 움직인다. 결혼하자.',k:'오늘도 무사했구나. 이제 그 말, 둘한테 해야 하네.',r:'화나서 말 안 했어. 손이 먼저 나갈까 봐. 근데 그게 더 아프게 했지. 미안해.',b:'……(그는 아무 말 없이 찻잔을 하나 더 꺼냈다. 마지막 차였다.)',o:'오늘도 무사했구나. 평생 그 말 할 수 있어서 좋았다.',e:'강재균의 경비 회사는 인간 경비원 고용률 1위가 되었다. 정결은 그 회사의 인사팀장이었다.'},
taegyeong:{s:'바다 산책. 세건이 몰래. …이미 따라왔네, 저 새끼.',w:'초콜릿 반 쪽. 이제 반 말고 전부 줄게.',m:'쓸데없는 말 싫어해서 한 마디만. 결혼하자.',k:'세건이가 삼촌 된다고 난리야. 쓸데없이. …나도 좀 난리야.',r:'급소 찔렀지. 미안해. 너한텐 안 그러기로 했는데.',b:'…쓸데없는 말 안 할게. 잘 가.',o:'안경 벗으면 너만 보였어. 마지막까지.',e:'공태경과 공세건은 같은 날 은퇴했다. 송별회에서 형이 처음으로 동생보다 많이 웃었다고 한다.'},
segeon:{s:'바다에서 다이빙 내기! 형 몰래! 들키면 같이 혼나는 거야!',w:'옥상 대신 눈밭에 누워서 별 보자. 춥다고? 내가 안아 줄게. 농담 아니야.',m:'결혼하자! …안 웃기지? 그러니까 진심이야.',k:'얘가 나 보고 웃었어. 처음으로 진심으로 웃긴 걸 했나 봐, 내가.',r:'웃으면서 넘기려 했어. 그게 제일 비겁했지. 미안해.',b:'…하하. 아니, 안 웃을게. 이번엔.',o:'평생 진심일수록 웃기게 말했는데. 마지막은 그냥 말할게. 사랑해.',e:'공세건의 범죄 실화 팟캐스트는 해방 이전 미제 사건들을 다뤘다. 마지막 회의 제목은 ‘형한테 말하면 죽어’였다.'},
heukrang:{s:'조수석 비워 놨다. 해안도로 끝까지 달리자. 과속은 차 없는 데서만.',w:'캠핑카에서 첫눈 보는 거, 무리 애들한테 배웠어. 너랑 하고 싶었다.',m:'고른 건 안 바꾼다. 서류에 전계성이라고 쓰고, 그 옆에 네 이름 쓰자.',k:'무리 우두머리가 솔방울 보냈더라. 이 애 몫이래. 하하.',r:'여유 부리다가 놓칠 뻔했네. 미안하다. 이번엔 진지하다.',b:'조수석은 비워 둘게. 누가 물어보면, 주인 있다고 할 거다.',o:'계성아, 하고 불러 줘. 마지막도 그 이름으로 듣고 싶다.',e:'전계성의 캠핑카는 적응지원센터 공식 이동 지원 차량이 되었다. 운전석엔 시민증을 받은 아이들 사진이 빼곡했다.'},
raehyang:{s:'따뜻한 국물에 매운 거, 바닷가 버전으로 찾아 왔어요. 판 깐 거 아니에요.',w:'레미라고 불러 줘요. 눈 오는 날엔 그 이름이 더 듣고 싶어요.',m:'판 안 깔고 말할게요. 결혼해요. 이번엔 얼마나 있을지 안 세고 싶어요.',k:'이 애 손목에 머리끈 묶어 줬어요. 두 번 감고, 리본으로. 엄마가 해 준 것처럼.',r:'또 판 깔았어요. 버릇이. 미안해요. 이번엔 그냥 말할게요.',b:'…레미라고 한 번만 더 불러 줄래요. 그거면 돼요.',o:'평생 레미로 살았어요. 당신이 불러 줘서.',e:'고래향은 레미라는 이름으로 등급 정정 운동을 이끌었다. 혼혈 등급이 폐지되던 날, 그는 엄마의 머리끈을 풀었다.'},
seongwoo:{s:'바다엔 오리가 없군. …아, 갈매기가 있지. 빵 가져왔다.',w:'사탕 한 봉지 가져왔다. 따뜻한 말 대신.',m:'따뜻한 말 대신 행동으로 할게. 반지다. 대답은 따뜻하게 해 줘.',k:'키 재는 수첩, 새로 샀다. 이번엔 경쟁 없이. 그냥 자라는 대로.',r:'…미안하다. 이 말 하는 데 59년 걸렸는데, 너한테는 금방 나오네.',b:'사탕 하나 줄게. 마지막으로. …감정은 없어. 거짓말이다.',o:'따뜻한 말 못 한다고 했지. 마지막이니까 한 번만 할게. 사랑했다.',e:'태성우의 장례식에 세 아들이 나란히 섰다. 수첩 마지막 장엔 손주들의 키가 적혀 있었다.'},
injae:{s:'놀이공원 신상 키링 팝업. 목적: 시크릿. 과정: 데이트. 결과: 둘 다 성공.',w:'분홍색 목도리 샀어요. 두 개. 커플이에요. 비밀 아니에요.',m:'목적: 결혼. 과정: 오늘부터 평생. 결과는 당신이 정해 줘요.',k:'이 애 첫 장난감, 시크릿 키링이에요. 2년 걸려 뽑은 거. 아깝지 않아요.',r:'지는 거 싫어서 우겼어요. 근데 당신한테 지는 건 괜찮아요. 미안해요.',b:'…시크릿 하나 놓친 기분이에요. 평생 못 뽑을 거.',o:'평생 귀여운 거 좋아했는데요, 당신이 제일 귀여웠어요. 마지막까지.',e:'가인재의 캐릭터 사업부는 레오스 그룹의 가장 큰 부서가 되었다. 대표 캐릭터는 분홍 넥타이를 맨 검은 호랑이였다.'},
mugyeol:{s:'바다 가서 빵 구울래? 농담이야. 바다에선 그냥 쉬자.',w:'유자 쿠키 구웠어. 담백하게. 너 입맛대로.',m:'이름 허락했지. 무결. 이제 하나 더 허락해 줘. 평생 같이 살자.',k:'잔소리할 사람이 하나 더 늘었네. 귀찮게. …좋다.',r:'교도관 버릇 나왔어. 가두려고 했어. 미안해. 문 열어 둘게.',b:'…통금 없어. 이제. 가고 싶은 데 가.',o:'잘 잤어? 나는 못 잤어. 평생 네 생각 때문에.',e:'가무결은 출소자 지원 빵집을 열었다. 첫 번째 직원은 그가 교도관 시절 맡았던 수감자였다.'},
taehyeong:{s:'목적: 휴가. 경로: 바다. 결과: …설명이 필요 없습니다. 좋습니다.',w:'회전목마 대신 눈썰매입니다. 목적 없는 놀이. 예외 열 번째.',m:'이번엔 늦지 않겠습니다. 교제 다음 단계를 신청합니다. 결혼해 주십시오.',k:'감정을 늦게 알아채는 버릇, 이 아이 앞에서는 안 생기더군요. 처음부터 압니다. 사랑합니다.',r:'또 늦게 알아챘습니다. 미안합니다. 이번엔 바로 말씀드립니다.',b:'…이번에도 늦었습니다. 감정을 알아챘을 때는, 이미.',o:'평생 예외였습니다. 당신은. 단 하나의 예외.',e:'박태형은 그룹 부회장이 되었다. 놀이공원 회전목마는 그의 지시로 영구 보존되었다.'},
seohwan:{s:'간식 대량으로 챙겼어. 바다에서 초코파이 수프 끓이자. …농담. 진짜 요리 할게.',w:'눈 보러 왔어. 배 안 고파. 네 옆이라 머리가 맑아.',m:'여러 개 중에 고르는 거 싫다고 했지. 너 하나야. 평생. 결혼하자.',k:'이 애 앞에선 배고파도 무섭지 않아. 네가 가르쳐 준 거야.',r:'귀가 뒤로 갔었지. 미안해. 무서웠지. 이제 괜찮아.',b:'…간식 주머니, 돌려줄게. 이제 내가 채울게. 혼자.',o:'네 얼굴 보면 머리가 맑아져. 마지막까지 그래.',e:'윤서환의 PX 요리책 『초코파이 수프부터 계란말이까지』는 군 장병 사이에서 전설이 되었다.'},
pildo:{s:'바다에서 2P 하자. 방수 게임기 샀다. 존나 비쌌다.',w:'눈싸움 2P. 지는 놈이 라면 쏘기. 첫 젓가락은 네 거.',m:'감정 표현 서툴러서 그냥 말한다. 결혼하자. 존나.',k:'첫 젓가락, 이제 이 녀석 거다. 평생 양보한다. 씨발, 아깝지도 않네.',r:'씨발, 내가 잘못했어. 2P 박탈하지 마.',b:'…2P 자리, 비워 둔다. 다른 놈 안 앉힌다.',o:'평생 2P였다, 너. 최고의 파트너.',e:'이필도는 은퇴 후 PC방을 차렸다. 2인용 좌석은 늘 한 자리가 예약되어 있었다.'},
haegang:{s:'볕 좋은 데 누워서 낮잠. 너 안고. 이게 휴가야.',w:'온천에서 머리 감겨 줘. 아니, 오늘은 내가 감겨 줄게.',m:'귀찮은 거 많은데 너는 하나도 안 귀찮아. 결혼하자. 약속은 꼭 지켜.',k:'이 애 갈기도 사방으로 뻗쳐. 매일 감겨 줄 거야. 내가.',r:'방전돼서 말 안 했어. 미안. 충전은 너만 할 수 있어.',b:'…머리, 이제 누가 감겨 주지. 귀찮겠다. 그래도 잘 가.',o:'잘했으니까 상 줘야지. 평생 네가 내 상이었어.',e:'바닷가의 작은 살롱은 오래 그 자리에 있었다. 간판엔 끝까지 이름이 없었다. 손님들은 그냥 ‘사자네’라고 불렀다.'},
jegang:{s:'바다. 기록 안 할게. 그냥 볼게.',w:'눈 위 발자국, 수첩 대신 사진으로 남길래. 너랑 같이.',m:'네가 스스로 올 때까지 기다리려 했는데, 이번엔 내가 갈게. 결혼하자.',k:'이 애 키는 안 적을 거야. 아버지처럼. …아니, 적을래. 경쟁 없이, 사랑하니까.',r:'관찰만 하고 말을 안 했어. 미안해. 이번엔 말할게.',b:'…끝까지 지켜보는 게 내 버릇인데. 이번엔 못 보겠다.',o:'평생 기록했어. 웃을 때 왼쪽 눈이 먼저 감기는 거. 마지막까지 그랬어.',e:'태제강의 수첩 마흔일곱 권은 적응지원센터 기록관에 보관되었다. 마지막 권엔 한 사람의 이름만 적혀 있었다.'}
};
function aft(c,k){const a=AFTER[c.id];return a&&a[k]?'@'+c.id+'|'+fx(a[k]):loveLine(c);}

/* ===================== 애정 대사 풀 (중복 방지 순환) · 데이트 소감 =====================
 HEART: 연인·호감 상대가 건네는 말 (장소 무관)  DATEL: 데이트 후 "오늘 어땠어요?" [영화관, 바닷가, 맛집, 놀이공원] */
const HEART={
haean:['오늘 오차 범위가 넓네요. 원인은 {N} 씨입니다. 확실합니다.','커피 끊었습니다. 대신 {N} 씨 보러 왔습니다. 각성 효과는 비슷하네요.','씨발, 아니 죄송합니다. 보고 싶었다는 말을 다른 단어로 바꾸는 게 아직 서툴러서요.','계산해 봤는데요, 오늘 같이 있을 수 있는 시간 4시간 20분. 낭비하지 마시죠.','손 떨지 마세요. …아, 떨리는 건 제 쪽이군요.','기억력 나쁜 놈이라 그런지, {N} 씨 얼굴은 매일 처음 보는 것처럼 좋습니다.'],
sangyun:['야, 왜 이제 와. 기다렸잖아. …아니 안 기다렸어. 지나가던 길이야.','오늘 나 좀 멋있지? 너 보려고 셔츠 다렸어. 비밀이다.','배고프지? 내가 살게. 너한테 쓰는 건 하나도 안 아까워.','아 진짜, 너 웃으면 나 할 말 까먹어. 반칙이야.','오늘 링에서 이겼다. 근데 너 얼굴 보는 게 더 좋다. 이상하지.','뒷자리 비워 놨어. 너 거야. 다른 놈 안 태워.'],
gangsik:['오늘은 세 번 말씀드리겠습니다. 좋아합니다. 좋아합니다. 좋아합니다.','{N} 씨를 보면 배가 안 고픕니다. 이상한 일입니다. 기록해 두겠습니다.','셔츠 다렸습니다. 오늘 뵐 것 같아서요. 또 맞았습니다.','농담을 하나 배웠습니다. …까먹었습니다. 그래도 웃어 주셔서 감사합니다.','오늘 몇 번 웃으셨는지 세고 있었습니다. 일곱 번입니다. 목표는 열 번입니다.','목표 달성 이후에도 매일 보고드리겠습니다. 좋아합니다.'],
dohae:['니 오늘 얼굴 좋네. 무슨 좋은 일 있었나.','바다 보다가 니 생각 나서 왔다. 고기는 안 잡히더라.','내 옆에 있으면 니 겁 안 나나. 하하, 니는 참 이상한 아다.','오늘은 협박 안 할게. 니한테는 그냥 말할게. 보고 싶었다.','할매가 니 데리고 오라더라. 내보다 니를 더 좋아한다, 그 할매.','니 손 차다. 이리 온나. 고래는 체온이 높다.'],
gihyeon:['오늘 늦었네, 막내. 걱정했어. 진심 팔, 농담 이.','네 얼굴은 숫자로 안 읽혀. 그래서 계속 보게 돼.','형이 기다리는 건 잘한다고 했지. 근데 너는 좀 빨리 오면 좋겠어.','오늘 장사 접었어. 너 오는 날은 다른 손님 받기 싫어서.','볕 같은 애. 그 말 내가 처음 했지? 아직도 맞아.','삼키고 싶다는 말, 이제 농담 하나도 안 섞였어.'],
gisan:['우리 막내 왔다! 오늘 왜 이렇게 예뻐. 큰일 났네.','형한테 들킬까 봐 표정 관리하는데, 안 되네. 다 티 나지?','오늘 칵테일 하나 만들었어. 이름은 네 이름. 메뉴엔 안 올려.','보고 싶었어. 숨기려다 포기했어. 얼굴에 다 쓰여 있잖아.','10년 지기처럼 굴었는데, 이제 그걸로는 모자라.','막내야, 손. 그냥 잡고 싶어서.'],
jaeha:['…왔어. 오늘 눈 마주쳤다. 3초. 신기록.','화면 다 껐어. 너 오는 시간엔 다른 거 안 봐.','탄산 두 개 사 왔어. 하나는 차갑게. 네 거.','사람 많은 데는 싫은데, 너 옆이면 좀 괜찮아.','오늘 하루 기록 다 지워도, 너랑 있던 건 남겨 둘래.','…좋아. 그냥, 그 말 하고 싶었어.'],
sanggi:['오늘 운세 봤어. 너 만나면 대길이래. 맞았다.','주사위 안 굴리고 왔어. 너 보러 오는 건 정할 필요가 없어서.','수첩에 너 칸 따로 만들었어. 벌써 세 장째야.','친구 목록 스물두 개 중에 열한 개 했어. 다 너랑.','체온 낮아서 손 차지? 그래도 잡아 줄래?','타로가 그러는데, 오늘 고백 운이 좋대. …농담. 반만.'],
husan:['냄새 맡고 왔어! 너 냄새! 멀리서도 알아!','휴산 오늘 숟가락으로 밥 먹었어. 칭찬해 줘.','돌 하나 더 주웠어. 이건 제일 반짝이는 거야. 너 거.','너 옆에 있으면 짐승 안 돼. 마음이 조용해져.','휴산은 너 좋아. 무리에서 제일 센 애보다 더.','손 줘. 휴산이 따뜻하게 해 줄게.'],
gunha:['콩알, 왔냐. 오늘 기록 좋았다. 너 와서 그런가.','손은 안 떨리는데 심장이 떨린다. 이거 반칙이다.','고기 먹으러 가자. 열 인분. 넌 하나만 먹어.','오늘 아버지가 너 안부 묻더라. 친구 잘 있냐고. …친구 아닌데.','표적 보면 너 생각나. 집중 안 돼서 큰일이야.','콩알. 그냥 불러 봤어.'],
danho:['오늘은 제가 먼저 인사할게요. 안녕하세요. …연습했어요.','늘 다니던 길 말고 이쪽으로 왔어요. 혹시 만날까 봐.','배부른 거 알았어요, 오늘은. 근데 같이 한 그릇 더 먹고 싶어요.','벽 말고 당신한테 기대도 돼요? …아니, 물어보는 것만으로도 좋아요.','오늘 하루 중에 제일 잘 정한 거, 여기 온 거예요.','틀려도 된다고 해 줘서, 요즘 덜 무서워요.'],
jigwang:['내 둥지 담요 바꿨어. 너 좋아하는 색으로.','하늘에서 너 보였어. 그래서 내려왔지.','깃털 하나 더 줄까? 이번 건 제일 큰 거야.','너는 주운 게 아니라 온 거라고 했잖아. 오늘도 와 줬네.','부리로 안 쪼고 꼬리 깃으로 건드리는 거, 너한테만 해.','날개 안 추워? 들어와.'],
seongae:['오늘 같이 밥 먹을 사람 계산해 봤는데요, 결론은 당신이에요.','빵 하나 사 뒀어요. 반은 당신 거. 이자는 안 받을게요.','배고파요. …밥 말고요. 당신 보고 싶었다는 뜻이에요.','장부에 오늘 날짜 적어 둘게요. 좋은 날이라고.','숫자는 쉬운데, 당신은 어려워요. 그래서 좋아요.','같이 먹으면 반찬 두 개 줄 수 있어요. 특별히.'],
jehan:['못생겼네. 잠 못 잤지. …옆에서 자. 내가 지켜볼게.','비번이야. 너 보러 왔어. 진단은 나중에.','손목 저려. 주물러 줘. 너만 허락할게.','오늘 수술 잘 끝났어. 제일 먼저 너한테 말하고 싶었다.','못생겼다는 말 반대말, 오늘은 그냥 표정으로 할게.','밥은 먹었냐. 안 먹었으면 처방이다. 같이 먹어.'],
haeseong:['오셨습니까. 오늘도 손가락이 멈춰 있습니다. 당신 덕분입니다.','원하는 걸 하나 더 찾았습니다. 오늘 당신을 보는 것.','보이차 두 잔 준비했습니다. 한 잔은 당신 몫입니다.','…지금은, 아무 생각도 안 해도 될 것 같습니다.','당신 목소리는 방송 소리처럼 놀랍지 않습니다. 오히려 조용해집니다.','처음으로 기다리는 게 즐겁습니다.'],
yuhong:['왔다! 헤헤, 오늘 꼬리가 아침부터 난리였어요.','아빠가 도시락 두 개 싸 줬어요! 하나는 당신 거래요!','오늘 과제 칭찬받았어요! 제일 먼저 말하고 싶었어요!','옆자리 비워 뒀어요. 늘 당신 자리예요.','귀 쓰다듬어 주면 안 돼요? 기분 금방 좋아지는데.','저 오늘도 노력했어요. 당신 보려고요!'],
jeil:['어이, 오늘 얼굴 좋네. 범인 잡은 날보다 기분 좋다.','비 오면 어깨 쑤시는데, 너 보니까 덜 쑤시네.','오늘은 웃는 눈으로 웃었어. 너한테만.','내 왼쪽으로 걸어. 그게 제일 안전한 자리야.','갈기 생각보다 비 잘 막는다고 했지. 오늘도 들어와.','욕심나면 양심 없어진다더니, 진짜네.'],
changoh:['밤길이 위험하다고 했는데, 당신 보러 오는 길은 괜찮았습니다.','담배는 오늘도 들고만 있었습니다. 대신 당신 손을 잡아도 되겠습니까.','계산이 안 되는 사람을 만나러 오는 건, 이상하게 편합니다.','당신 앞에서는 순혈인 척 안 해도 돼서, 숨이 쉬어집니다.','오늘은 비키라는 말을 한 번도 안 했습니다. 당신 덕분입니다.','이름으로 불러 주세요. 오늘도.'],
seongho:['짧게 할게. 보고 싶었어.','오늘 서류 일찍 끝냈어. 이유는 길게 설명 안 해.','소파 반 비워 뒀어. 늘어질래?','관찰 결과, 너 오는 날은 커피를 덜 마셔.','오늘 하루 중에 제일 짧고 제일 좋은 시간이 지금이야.','설탕 두 개. 오늘은 네가 타 줘.'],
chiyeol:['오늘 일정표에 {N} 씨 이름을 적었습니다. 업무 칸이 아니라, 처음으로 개인 칸에.','넥타이를 조금 풀었습니다. {N} 씨 앞이라서.','소고기 무국 끓여 왔습니다. 보온병에. 드십시오.','감정을 지우는 훈련을 받았는데, 오늘은 실패했습니다. 반가워서.','유홍 씨가 {N} 씨 안부를 물었습니다. 저도 같은 걸 묻고 싶었습니다.','이상… 아닙니다. 더 있고 싶습니다.'],
hwasu:['오늘은 웃는 거 연기 아니에요. 진짜예요.','당신 보면 입꼬리가 저절로 올라가요. 억지로 안 해도.','토끼 엄마 얘기 하나 더 해 줄까요? 당신한테만 하는 거.','우유 데워 왔어요. 잠 안 올 때 마시라고.','종족 같은 거 말고, 당신이라서 좋아요.','오늘 하루 중에 진짜 얼굴로 있던 시간, 지금이 처음이에요.'],
juyeong:['야, 왜 이렇게 늦게 와. 기다렸잖아. 씨발.','바이크 뒤 비워 놨다. 네 자리야. 딴 놈 안 태워.','무전기 또 고장 났어. …아니, 너 보러 온 핑계야.','오늘 예쁘네. 반칙이다, 이 새끼.','응석 부려도 돼? 오늘 좀 힘들었어.','꼬리 감긴 거 모른 척해. 내 의지 아니야.'],
taean:['오늘 볕 좋쥬? 당신 오는 날은 꼭 볕이 좋더라구유.','토마토 익었어유. 젤 빨간 거 가져왔어유.','등 좀 긁어 주셔유. …핑계여유. 옆에 있고 싶어서.','느려도 기다려 주니께, 지는 요즘 행복해유.','볕에 말린 이불 냄새, 당신한테서도 나유.','오늘 지가 정한 거 하나 있어유. 당신 보러 오는 거.'],
haetan:['…교대 끝나자마자 왔습니다. 씻고 올 걸 그랬습니다.','쉬는 시간입니다. 당신이랑 바다 보고 싶었습니다.','오늘은 손이 안 떨립니다. 당신이 옆에 있어서.','말 안 해도 되는 사람, 편합니다. 당신입니다.','상자 무거운 건 제가 듭니다. 당신은 옆에만 있으십시오.','화요일, 목요일, 토요일. 다 당신 보는 날입니다.'],
piljung:['아가, 왔어? 오늘 관심 있는 거 하나뿐이야. 너.','인형 하나 또 만들었어. 너 웃는 얼굴로.','태로가 너 보고 싶대. 나 말고 태로가.','흥미 없는 건 무시하는데, 너는 무시가 안 돼.','바느질 하다가 손 찔렸어. 호 해 줘, 아가.','오늘은 바늘 안 잡았어. 손 비워 뒀어. 너 잡으려고.'],
yeonhu:['왔어? 오른쪽에 서. 잘 들리게.','오늘 호떡 하나 더 얹어 줄게. 단골 할인. 아니, 애인 할인.','Oh, 너 오늘 진짜 예쁘다. Seriously.','단 거 먹으면 기분 좋아지잖아. 근데 너 보면 더 좋아져.','오늘 장사 잘됐어. 근데 너 오니까 더 좋다.','오늘 새 시럽 만들었어. 이름? 당연히 네 이름이지.'],
taegyun:['정각에 오셨군요. 예상대로. …아닙니다, 예상보다 반가웠습니다.','오늘 머리가 흐트러져 있네요. 정리해 드릴까요. 아니, 그대로 두겠습니다.','비 오는 날이 좋다고 했죠. 당신 오는 날이 더 좋습니다.','당신이 웃으면 제 분류 체계가 무너집니다. 흥미롭습니다.','넥타이 비뚤어졌다고 해 주세요. 그 농담 또 듣고 싶습니다.','시계 안 봤습니다. 당신이랑 있을 때는.'],
gyeonu:['장갑 벗고 왔어. 오늘은 네 손 잡으려고.','빛 좋다. 사진 한 장만. 이건 내 거.','너 손은 하나도 안 무서워. 이상하지.','촬영 끝나자마자 왔어. 분장도 안 지웠어.','계산적인 사람이 계산 안 하고 온 거야. 대단한 거다.','깨끗한 손이 아니라 따뜻한 손이 좋더라. 너 손.'],
dantae:['오늘은 숟가락 놓는 소리까지 당신을 닮았대요. 단호가 그러더라고요.','오늘 아무도 안 쫓아오는 길로 왔어요. 당신한테.','서른한 번째 말, 오늘은 소리 내서 했어요. 당신 덕분에.','당신 동선은 다 외웠어요. 그래서 기다릴 수 있었어요.','단호가 당신 안부 물었어요. 저도 궁금했어요.','오늘은 원하는 거 말해도 될 것 같아요. 보고 싶었어요.'],
dohan:['산골에서 감 보내왔다. 제일 단 거 골라 왔어.','오늘 공장 기계 하나 고쳤다. 너한테 자랑하고 싶었어.','어머니가 너 언제 오냐고 물으시더라. 매주.','거짓말 안 한다. 오늘 하루 종일 네 생각 했다.','좁은 데 앉자. 너 옆에.','수트 소매 걷었다. 너 보는 날은 편하게 있고 싶어서.'],
beomseok:['…왔냐. 오늘은 혼자 다니지 마라. 데려다줄게.','국밥 다섯 그릇에서 멈췄다. 너랑 먹으려고.','웃었다. 방금. 너 때문이다.','오늘 사건 없다. 너만 보면 된다.','곰탕 농담 또 해 줘. 하나도 안 웃긴데 웃기다.','손 작네. 오늘도.'],
dosan:['…왔냐. 육포 반 쪼개 놨다.','오늘은 철문 앞 말고 너 앞에 있을래.','냄새로 알았다. 네가 오는 거.','곁에 한 명만 둔다고 했지. 오늘도 너다.','숲 산책 가자. 사냥 말고.','관심 받는 거 싫은데, 너한테는 받고 싶다.'],
pilyeon:['어이! 떡볶이 사 왔다! 너 거 두 배!','오늘 레코드 새로 샀어. 너랑 들으려고.','내기 하자. 내가 지면 너한테 고백할게. …이미 졌네.','오늘 진급 소식은 없는데, 너 보니까 상관없다. 과학이야.','춤출래? 아니, 출 거지?','오늘 내기 안 했다. 너한테는 그냥 지고 싶어서.'],
jaegyun:['경비실 불 켜 뒀어. 네가 지나갈 때 어둡지 않게.','녹차 우려 놨어. 오늘은 우전이야. 부드러워.','책 가져왔어? 조용히 옆에 있자.','순찰 돌다가 이 길로 왔어. 일부러.','화 안 났어. 오늘은 그냥 조용히 좋아.','네 찻잔 따로 마련했어. 다른 사람은 안 써.'],
taegyeong:['…쓸데없는 말 안 하려고 했는데. 보고 싶었다.','초콜릿 반 쪽. 세건이한텐 비밀.','안경 벗었어. 오늘은 너만 보려고.','새벽 산책, 같이 갈래.','급소 안 찌를게. 너한테는.','한 마디만 한다. 좋다.'],
segeon:['오, 왔다! 형 몰래 나왔어! 들키면 같이 혼나는 거야!','오늘 진심 하나 할게. 안 웃기게. …보고 싶었어.','옥상에서 별 보자. 오늘 맑대.','포커페이스 오늘도 실패. 너 앞에선 안 돼.','팟캐스트 끄고 왔어. 너 목소리 듣고 싶어서.','엄살 하나만 부려도 돼? 안아 줘. 농담 아니야.'],
heukrang:['하하, 왔냐. 고기 구워 놨다. 먹고 가.','조수석 비워 놨다. 오늘도 네 자리.','계성이라고 불러 줘. 오늘은 그 이름 듣고 싶다.','해안도로 끝에서 해 지는 거 봤다. 너 생각나더라.','여유 부리는 척했는데, 사실 좀 설렌다.','무리 애들이 너 안부 묻더라. 솔방울 주라고.'],
raehyang:['오늘 수업에서 학생이 제 이름 물었어요. 레미라고 했어요. 당신한테 배운 대로.','판 안 깔고 말할게요. 보고 싶었어요.','높은 데 있는 거 내려 줄래요? …핑계예요. 옆에 오라고.','따뜻한 국물에 매운 거, 오늘 같이 먹어요.','머리끈 묶어 줄래요? 당신이 해 주는 게 좋아요.','오늘은 얼마나 있을지 안 세요.'],
seongwoo:['…사탕이다. 따뜻한 말 대신.','조식 쿠폰 한 장 더 줄게. 아침 같이 먹자.','학생 지도 차원에서 묻지. 오늘 기분은 어떤가. …아니, 그냥 궁금했다.','아들놈들이 너 안부를 묻더군. 나도 궁금했다.','손이 차가운 놈이 마음은 따뜻하다던데. 오늘은 손도 따뜻하다.','호수에 오리 많더라. 같이 가자.'],
injae:['오늘 넥타이 분홍색이에요. 당신이 골라 준 거.','시크릿 나왔어요! 제일 먼저 보여 주고 싶었어요.','목적: 당신. 과정: 퇴근하자마자. 결과: 지금.','꼬리가 좌석 치는 거, 조바심 아니에요. 좋아서예요.','솜사탕 반 줄까요? 분홍색.','오늘 계약 이겼어요. 당신 생각하면서 했어요.'],
mugyeol:['사감실 불 아직 켜져 있어. 너 들어오는 거 보고 끄려고.','유자 쿠키 구웠어. 담백하게. 네 입맛.','통금 5분 전이네. 오늘은 늦어도 돼. 내가 봐줄게.','잔소리할 사람 너밖에 없어. 귀찮게.','교도관 버릇인데, 너는 감시가 아니라 그냥 보고 싶어.','커피 마실래? 유자 향 넣었어.'],
taehyeong:['오늘 회의 중에 당신 생각이 났습니다. 세 번. 업무상 비효율이지만 수정하지 않겠습니다.','목적: 대화. 경로: 바로 여기. 결과: 만족.','예외 조항 하나 더 추가했습니다. 오늘 일정 취소.','안전바 두 번 확인하는 사람, 오늘도 보고 싶었습니다.','말이 길어지네요. 호감 있을 때 버릇이라고, 가인재가 그러더군요.','회전목마 타실래요. 목적 없이.'],
seohwan:['오늘 훈련 끝나고 배 안 고팠어. 너 만날 생각에.','간식 주머니 채웠어. 너 거 따로.','오늘 귀 앞으로 와 있지? 너 와서 그래.','새 레시피 만들었어. 맛동산 볶음밥 2. …먹어 줄래?','배고파도 안 무서워. 너 생각하면.','여러 개 중에 고르는 거 싫어. 오늘도 너 하나야.'],
pildo:['야, 왔냐. 2P 자리 비워 놨다.','라면 끓였다. 첫 젓가락 네 거. 오늘만. 아니 앞으로도.','오늘 랭크 올랐다. 2P 덕분이다. 너 말이야.','게임 말고 흥미 있는 거 생겼다. 너다.','오늘 이겼다. 너 와서.','감정 표현 서툴러서 그냥 말한다. 보고 싶었다. 존나.'],
haegang:['촬영 끝났어. 갈기 엉망이지? 네가 정리해 줘.','오늘 방전이야. 충전해 줘. 너만 할 수 있어.','머리 감겨 줄래? 네 손이 좋아.','볕 좋다. 너 안고 낮잠 자고 싶다.','귀찮은 거 많은데 너는 하나도 안 귀찮아.','누가 너한테 예쁘다 그랬어? …나만 해.'],
jegang:['오늘 수강생이 처음으로 시민증 받았어. 너한테 제일 먼저 말하고 싶었어.','걸음이 빨라졌네. 나 보러 오는 길이라 그런가.','수첩 덮었어. 너 오니까.','네가 스스로 오기를 기다렸는데, 와 줬네.','관찰 결과, 오늘 제일 좋은 건 너야.','펜 놓을게. 손 잡게.']
};
const DATEL={
haean:['영화 물리 고증이 엉망이었습니다. …그래도 옆자리가 좋아서 끝까지 봤습니다.','파도 주기 계산하려다 그만뒀습니다. 당신 걸음만 세고 있었어요.','맛 평가 8점. 같이 먹은 사람 때문에 2점 추가. 10점입니다.','관람차 꼭대기에서 계산 다 날아갔습니다. 씨발, 좋았습니다.'],
sangyun:['영화? 솔직히 기억 안 나. 너 옆얼굴만 봤어.','바다 걷는 거 이렇게 좋은 줄 몰랐네. 서울엔 이런 거 없었어.','내가 낸다니까. 다음에도. 그다음에도.','롤러코스터에서 소리 지른 거 나 아니야. 진짜야. …나 맞아.'],
gangsik:['영화 중간에 울었습니다. 슬퍼서가 아니라 옆에 계셔서입니다.','파도 소리를 같이 들었습니다. 목표 하나 달성입니다.','열 인분 먹었습니다. 같이 먹어서 열한 인분 같았습니다.','관람차에서 고백하려 했는데 너무 높아서 못 했습니다. 지금 하겠습니다. 좋아합니다.'],
dohae:['영화는 졸았다. 니 어깨가 편해서.','바다는 매일 보는데, 니랑 보니까 다르네.','맛집이라 캐서 왔는데 할매 국밥이 낫다. 근데 니랑 와서 좋았다.','이 덩치로 놀이공원이라니. 하하. 니 웃는 거 보니까 됐다.'],
gihyeon:['영화 고른 거 너지? 취향 좋다. 기억해 둘게.','바닷가 걸으니까 볕 같은 네 얼굴이 더 잘 보이더라.','계산은 내가 했어. 숫자는 내 일이니까. 넌 맛만 기억해.','관람차 꼭대기에서 삼키고 싶었어. 진심 칠, 농담 삼.'],
gisan:['영화 중간에 너 손 잡을까 백 번 고민했어. 결국 잡았지?','바닷가에서 사진 백 장 찍었다. 다 너야.','접시 바꿔 먹는 거 우리 막내랑만 해.','놀이공원 오니까 막내가 진짜 막내 같다. 귀여워.'],
jaeha:['영화관 어두워서 좋았어. 네 얼굴은 잘 보이고, 내 얼굴은 안 보이고.','바닷가… 사람 적어서 좋았어. 너랑 둘만 있는 것 같아서.','뜨거운 거 식혀 줘서 고마워. 그런 거 해 주는 사람 처음이야.','사람 많은 데 처음 와 봤는데, 손 잡고 있으니까 괜찮았어.'],
sanggi:['영화 운세는 대길이었어. 맞았지?','바닷가는 물의 날이라 좋은 날이래. 너랑 와서 더 좋은 날.','포춘쿠키 안 나오는 식당인데, 그래도 좋았어.','관람차 꼭대기에서 주사위 굴리려다 말았어. 이미 정해졌으니까.'],
husan:['영화 소리 커서 놀랐어! 근데 너 손 잡으니까 괜찮았어!','바닷가 모래 발바닥이 간지러워! 또 오자!','휴산 젓가락 말고 포크로 먹었어. 잘했지?','회전목마 말이 휴산보다 느려! 그래도 재밌었어!'],
gunha:['영화 총 쏘는 장면 다 틀렸어. 근데 너 놀라는 거 보니까 재밌더라.','바닷가 걸으니까 손이 하나도 안 떨렸다. 신기하네.','고기 집 아니어도 너랑 먹으면 다 맛있다, 콩알.','사격 게임 경품 다 털었어. 다 너 거.'],
danho:['영화관 의자가 제 몸에 맞았어요. 처음이에요. 옆자리 당신이라 더 좋았어요.','바다 소리 좋네요. 같은 길만 걷다가 처음 와 봤어요.','메뉴 제가 골랐어요. 맛있었죠? …틀려도 된다고 했잖아요.','놀이기구 고르는 거 어려웠는데, 당신이 웃으니까 다 괜찮았어요.'],
jigwang:['영화관은 좁아. 날개 접느라 힘들었어. 근데 네 옆이라 참았지.','바다 위를 날고 싶었는데, 오늘은 걸었어. 네 속도로.','고기 많이 시켰어. 너 먹는 거 보는 게 좋아서.','관람차 꼭대기? 내 탑보다 낮아. 그래도 좋았다.'],
seongae:['팝콘 큰 거 시켰는데 제가 다 먹었어요. 미안해요. 다음엔 두 개.','바닷가에 핫도그 팔더라고요. 세 개 먹었어요. 당신 하나 먹고.','계산해 보니까 오늘 제가 이득이에요. 맛있는 것도, 당신도.','놀이공원 간식 다 먹어 봤어요. 제일 맛있는 건 당신이 사 준 솜사탕.'],
jehan:['영화 수술 장면 고증 엉망이었어. …옆에서 웃는 너 때문에 화를 못 냈다.','바닷바람 차다. 감기 걸리면 내가 진료할 거야. 각오해.','잘 먹었네. 혈색 좋아졌어. 의학적 소견.','놀이기구 안전 점검 다 했어. 너 탈 거니까.'],
haeseong:['영화관 조명이 낮아서 좋았습니다. 당신 숨소리만 들렸습니다.','파도 소리는 일정합니다. 당신 걸음도 일정합니다. 편했습니다.','세 번째 메뉴를 골랐습니다. 원하는 거라서.','사람 많은 데는 힘들었는데, 당신 손이 있어서 세지 않아도 됐습니다.'],
yuhong:['영화 슬퍼서 울었어요! 꼬리로 눈물 닦았어요!','바다에 꼬리 담갔어요! 짜요! 헤헤!','맛있는 거 먹으면 꼬리가 돌아가요! 봤죠?','자유이용권 뽕 뽑았어요! 다음에 또 와요!'],
jeil:['영화 범인 처음부터 알았어. 근데 말 안 했다. 너 즐거워 보여서.','바닷가 순찰 말고 산책은 처음이다. 좋네.','오늘 결과 제일 좋았던 거, 네가 웃은 거.','놀이공원 오니까 사이렌 없는 하루 같다.'],
changoh:['어두운 영화관이 편했습니다. 당신 옆이라 더.','밤바다 산책, 이번엔 끝까지 걸었습니다. 처음입니다.','사람 많은 식당에서 등 돌리고 앉지 않은 건 처음입니다.','관람차 꼭대기에서 아무도 저를 모르는 게 좋았습니다. 당신만 알고.'],
seongho:['영화. 짧게 평가할게. 좋았어. 옆자리가.','바다. 길게 말 안 해도 좋다.','맛있었어. 설명 생략.','놀이공원은 길게 줄 서는 게 문제야. 근데 너랑이면 괜찮아.'],
chiyeol:['보고드립니다. 영화는 82점. {N} 씨와 함께여서 100점입니다.','바닷가 산책 일정, 정기 일정으로 등록하겠습니다.','소고기가 좋았습니다. 다음엔 제가 만들어 드리겠습니다.','유홍 씨와 와 봤던 곳입니다. {N} 씨와 오니 다른 곳 같습니다.'],
hwasu:['영화 보면서 진짜로 울었어요. 연기 아니에요.','바닷가에서 토끼 가족 얘기 했던 거, 처음이에요.','맛있었어요. 진짜 웃음이 나올 만큼.','회전목마는 토끼 가족이랑 탄 적 있어요. 이제 당신이랑도.'],
juyeong:['씨발, 영화 또 울었다. 비밀이다.','바닷가 바이크로 왔으면 더 좋았을걸. 다음엔 태운다.','맛있었다. 계산은 내가. 막내라도 이건 한다.','롤러코스터 하나도 안 무서웠다. …꼬리 감긴 거 모른 척해.'],
taean:['영화관 의자 푹신해서 졸 뻔했어유. 당신 손 잡느라 안 졸았어유.','바다 볕은 밭 볕이랑 달라유. 그래두 좋네유.','맛있었어유. 근데 지 도시락이 더 맛있쥬? 헤헤.','놀이기구 무서웠는디, 당신이 옆에 있응께 괜찮았어유.'],
haetan:['어두운 데서 사람 많은데, 안 무서웠습니다. 처음입니다.','바다는 쉬는 날에 보니까 다릅니다. 당신이랑 보니까 더.','싸우지 않고 먹는 밥. 맛있었습니다.','놀이기구는 싸움이 아니라 노는 거라서, 좋았습니다.'],
piljung:['영화 관심 없었는데, 너 반응 보는 게 재밌었어, 아가.','바다는 아무것도 기대 안 하지. 근데 오늘은 너랑 와서 기대가 생겼어.','맛있었네. 흥미 생겼어. 너 먹는 모습에.','인형 뽑기에서 흑표범 하나 뽑았어. 태로 친구.'],
yeonhu:['영화 단 거 많이 먹었다! Perfect!','바닷가 디저트 가게 찜해 놨어. 다음엔 거기!','이 집 디저트 내 호떡보다 맛있어? …아니지?','Oh my god, 솜사탕 진짜 크다! 반 줄게!'],
taegyun:['영화 결말, 예상 밖이었습니다. 당신 반응도.','파도 소리는 불규칙하군요. 그래서 오늘은 시계를 안 봤습니다.','접시를 바꿔 먹는 건 정돈되지 않은 행위입니다. 좋았습니다.','관람차에서 흐트러진 당신 머리, 정리하지 않았습니다. 그대로가 좋아서.'],
gyeonu:['영화관 의자 닦아 놨어. 네 자리도.','바닷가에서 사진 열 장. 다 내 거.','장갑 벗고 먹었어. 네가 건네준 포크라서.','놀이공원 손잡이 다 만졌어. 네 손 잡고 있으니까 괜찮더라.'],
dantae:['영화관에서 출구 확인 안 했어요. 처음이에요.','바닷가까지 걸었어요. 아무도 안 쫓아오는 길로.','맛있었어요. 원하는 걸 말하니까 진짜 나오더라고요.','놀이공원 소리 커서 힘들었는데, 당신 목소리만 들렸어요.'],
dohan:['영화 중간에 기계 고장 장면 나오니까 고치고 싶더라.','바다 보니까 산골 생각난다. 넓은 건 다 비슷하네.','밥 잘 먹었냐. 그거면 됐다.','회전목마 처음 타 봤다. 산골엔 없었어.'],
beomseok:['영화 하나도 안 웃겼다. 근데 네가 웃어서 나도 웃었다.','바닷가 혼자 다니지 마라. 오늘처럼 나랑 와.','열 인분 시켰다. 넌 하나 먹어. 나머진 내가.','놀이공원 실종 신고 많은 데다. 손 놓지 마.'],
dosan:['영화관 냄새가 복잡했다. 네 냄새만 맡았다.','바다 냄새 좋다. 피 냄새 안 나서.','육포 말고 진짜 밥. 좋았다.','사람 많아도 네 냄새는 안 놓친다.'],
pilyeon:['영화 OST 레코드로 사야겠다! 너랑 들을 거야!','바닷가에서 춤추자! 아무도 없잖아!','떡볶이집 아니어도 괜찮네! 과학적으로 맛있었다!','범퍼카 내기 내가 이겼다! 분식 쏴!'],
jaegyun:['조용한 영화 골라 줘서 고마워. 편했다.','바닷가 찻집 있더라. 다음엔 거기 가자.','맛있었다. 오늘도 무사했고.','놀이공원은 시끄러운데, 네 옆은 조용하네.'],
taegyeong:['영화 결말 별로였다. 근데 너랑 봐서 됐다.','새벽 산책보다 좋네. 해 질 녘 바다.','초콜릿 디저트 반 쪼개 줄게.','세건이 몰래 왔는데 들킬까 봐 신경 쓰였다. 그래도 좋았다.'],

/* 같은 사람의 애정 대사가 연달아 반복되지 않도록 순환 */
function heartLine(c){
  if(!X[c.id])return '';
  const pool=[X[c.id].love,...(HEART[c.id]||[])];
  const key='hl_'+c.id;let used=(P.flags[key]||'').split(',').filter(x=>x!=='').map(Number);
  let avail=pool.map((_,i)=>i).filter(i=>!used.includes(i));
  if(!avail.length){const last=used[used.length-1];used=[last];avail=pool.map((_,i)=>i).filter(i=>i!==last);}
  const i=pick(avail);used.push(i);P.flags[key]=used.join(',');
  return '@'+c.id+'|'+fx(pool[i]);
}
function loveLine(c){return heartLine(c);}

function subSeason(){const w=Math.min(P.week||1,8);return P.sem===1?(w<=2?'s1':w<=5?'s2':'s3'):(w<=2?'a1':w<=5?'a2':'a3');}
function seasonKey(){const s=subSeason();return s==='s3'?'su':s[0]==='s'?'sp':s==='a3'?'wi':'au';}
function rotPick(arr,key){if(!arr||!arr.length)return '';P.ci=P.ci||{};let i=rnd(0,arr.length-1);if(arr.length>1&&i===P.ci[key])i=(i+1)%arr.length;P.ci[key]=i;return arr[i];}
/* 장소 장면: 도착 → 장소의 계절 묘사 → (가끔) 날씨 */
function scene(k,arrive=true){
  const out=[];let base=k,arr=null;
  if(k==='club'){const ca=CLUBA[P.club];if(ca){arr=ca.a;base=ca.s;}}
  const S=SCN[base]||SCN.club;
  if(arrive)out.push(rotPick(arr||(SCN[k]&&SCN[k].a)||S.a,'sa_'+k));
  const sk=seasonKey();out.push(rotPick(S[sk],'ss_'+base+sk));
  if(Math.random()<.45){const KW=['서리','하늘','은행','벚꽃','장마','입김','눈','낙엽','소나기','비','햇볕','바람','꽃','매미','더위','추위'];const used=KW.filter(w=>out.join(' ').includes(w));const ws=WEATHER[subSeason()].filter(l=>!used.some(w=>l.includes(w)));if(ws.length)out.push(rotPick(ws,'sw'));}
  return out.filter(Boolean);
}
function amb(k){return scene(k,false);}

const CARDKEY='cheonghae_endcards_v1';
function loadEndCards(){try{return JSON.parse(localStorage.getItem(CARDKEY)||'{}')||{};}catch(e){return {};}}
function saveEndCard(d){const all=loadEndCards();d.count=((all[d.key]&&all[d.key].count)||0)+1;all[d.key]=d;try{localStorage.setItem(CARDKEY,JSON.stringify(all));}catch(e){}}
function endCardHTML(d,n){
  return `<h3>${esc(d.title)}</h3><div class="sub">${esc(d.sub)}${n!=null?' · 모은 엔딩 '+n+'개':' · '+esc(d.date)+(d.count>1?' · '+d.count+'번 봄':'')}</div>
   <table>${d.rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}
   ${(d.ranks||[]).map(([nm,v])=>`<tr><td>${esc(nm)}</td><td><span class="hearts">${hearts(v)}</span> ${v}</td></tr>`).join('')}</table>`;
}
function endGallery(){
  const all=Object.values(loadEndCards()).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let got=[];try{got=JSON.parse(localStorage.getItem(ENDKEY)||'[]');}catch(e){}
  const old=got.length-all.length;
  sheet(`<h3 style="font-family:'Gowun Batang',serif;text-align:center;margin-bottom:4px">모은 엔딩</h3>
   <div class="note" style="text-align:center;margin-bottom:12px">카드 ${all.length}장${old>0?` · 보관함이 생기기 전에 본 엔딩 ${old}개는 이름만 기록돼 있어요`:''}</div>
   ${all.length?all.map(d=>`<details class="egal"><summary><b>${esc(d.title)}</b><span>${esc(d.sub)} · ${esc(d.date)}</span></summary><div class="end" style="margin:8px 0 4px">${endCardHTML(d)}</div></details>`).join(''):'<div class="note" style="text-align:center">아직 저장된 엔딩 카드가 없어요. 졸업까지 가 보세요!</div>'}`);
}

jaeha:{n:'재하가 눈을 꼭 감았다. 은빛 귀가 떨렸다. 그리고 아주 조심스럽게, 입술이 닿았다.',f:'…눈 떴으면 못 했어. 다음엔 뜨고 할게.',d:'이번엔 눈 뜨고 했어. …보여? 나 빨개진 거.'},
sanggi:{n:'상기가 수첩을 덮었다. 차가운 입술이 짧게 닿았다가 떨어졌다.',f:'운세에 없던 일이야. 대길보다 좋은 거.',d:'타로 안 뽑고 했어. 이건 그냥 내가 정한 거야.'},
husan:{n:'휴산이 코끝을 내 코끝에 문질렀다. 그러다 서툴게, 입술이 닿았다.',f:'이게 학교식 짝 인사야? 휴산 이거 좋아.',d:'한 번 더! 휴산은 한 번으론 모자라!'},
gunha:{n:'건하가 헤드기어를 벗어 던지고 성큼 다가왔다. 명중시키듯 정확한 입맞춤이었다.',f:'…10.9점. 아니, 만점 넘었다, 콩알.',d:'연습 더 해야겠다. 표적 말고 이거.'},
danho:{n:'단호가 한참 망설였다. “해도… 돼요?” 고개를 끄덕이자 커다란 몸이 조심스럽게 숙여졌다.',f:'제가 정한 거예요. 처음으로, 이렇게 큰 거.',d:'이번엔 안 물어보고 했어요. …괜찮았어요?'},
jigwang:{n:'지광이 날개로 나를 감쌌다. 어두운 깃털 안에서 입술이 닿았다.',f:'둥지 안에서 한 거니까, 이제 너 내 거다.',d:'날개 안이 제일 좋지? 여기선 아무도 못 봐.'},
seongae:{n:'성애가 숟가락을 내려놓았다. 고개를 기울여, 계산하듯 정확하게 입을 맞췄다.',f:'…장부에 적을게요. 첫 번째. 이자는 평생 받을 거예요.',d:'밥보다 이게 더 배불러요. 이상하죠.'},
jehan:{n:'제한이 장갑을 벗었다. 오드아이가 가까워지더니, 짧고 단호한 입맞춤이 내려왔다.',f:'못생겼네. …진짜 못생겼다. 미치겠네.',d:'처방이야. 하루 세 번.'},
haeseong:{n:'해성의 손가락이 멈춰 있었다. 그가 아주 천천히 얼굴을 기울였다.',f:'…세지 않았습니다. 처음입니다. 아무것도 세지 않은 순간.',d:'원하는 걸 하나 더 찾았습니다. 방금 것.'},
yuhong:{n:'유홍의 꼬리가 미친 듯이 흔들렸다. 눈을 질끈 감고 돌진하듯 입을 맞췄다. 코가 부딪혔다.',f:'아야! 아, 아니에요! 하나도 안 아파요! 헤헤!',d:'이번엔 코 안 부딪혔어요! 연습했어요!'},
jeil:{n:'제일이 웃는 눈 그대로 고개를 숙였다. 처음 보는, 하나도 장난스럽지 않은 입맞춤이었다.',f:'양심 없어진 김에. …아니, 이건 진심이야.',d:'비번 날엔 이거부터 하기로 했어. 방금 정했어.'},
changoh:{n:'창오가 담배를 바다에 던졌다. 그리고 내 얼굴을 두 손으로 감싸 아주 조심스럽게 입을 맞췄다.',f:'…계산이 안 됩니다. 처음으로, 계산하고 싶지 않습니다.',d:'그림자 없는 데서 하는 건 처음입니다. 좋군요.'},
seongho:{n:'성호가 안경을 벗었다. 길게 말하지 않았다. 짧은 입맞춤이 그의 대답이었다.',f:'짧게 할게. 좋았어.',d:'설명 생략. 한 번 더.'},
chiyeol:{n:'치열이 넥타이를 풀었다. “실례하겠습니다.” 말과 달리 입맞춤은 조금도 사무적이지 않았다.',f:'보고서에는… 못 쓰겠습니다. 이건.',d:'일정표에 없는 일입니다. 매일 넣겠습니다.'},
hwasu:{n:'화수의 입꼬리가 내려갔다. 연기하지 않는 얼굴로, 떨리는 입술이 닿았다.',f:'…이건 진짜예요. 연기로는 이렇게 안 떨려요.',d:'웃는 거 연습 안 해도 돼서 좋아요. 이거 할 땐.'},
juyeong:{n:'주영이 바이크에서 내리자마자 내 멱살을, 아니 옷깃을 잡아당겼다. 거칠고 짧은 입맞춤이었다.',f:'…씨발, 떨려. 비밀이다.',d:'응석 하나만. 한 번 더.'},
taean:{n:'태안이 큰 손으로 내 머리를 쓰다듬다가, 느릿하게 고개를 숙였다. 볕 냄새가 났다.',f:'지가 정한 거 세 번째예유. 이건 젤 잘 정한 거구유.',d:'천천히 했쥬? 지는 이게 젤 좋아유.'},
haetan:{n:'해탄이 흉터 난 입가를 손으로 가리려다 말았다. 대신 아주 조심스럽게 입을 맞췄다.',f:'…살아 있길 잘했습니다. 오늘 처음으로 그렇게 생각했습니다.',d:'흉터 신경 안 쓰셔도 됩니다. 당신이 안 쓰니까 저도 안 씁니다.'},
piljung:{n:'필중이 태로 인형을 옆에 내려놓았다. “아가.” 그리고 느긋하게, 입을 맞췄다.',f:'관심이 넘치네. 큰일이야, 아가.',d:'인형한텐 이거 안 해. 너한테만.'},
yeonhu:{n:'연후가 오른쪽으로 다가왔다. 귀가 붉어진 채, 시럽처럼 달게 입을 맞췄다.',f:'Oh my god. …오른쪽에서 해서 잘 들렸지? 내 심장 소리.',d:'Sweet, right? 호떡보다 달아.'},
taegyun:{n:'태균이 시계를 풀었다. 정돈된 사람답지 않게, 조금 흐트러진 입맞춤이었다.',f:'…예상 밖입니다. 제가 이렇게 할 줄은.',d:'정리가 안 됩니다. 그래서 좋습니다.'},
gyeonu:{n:'견우가 장갑을 벗었다. 맨손으로 내 뺨을 감싸고, 입술을 맞췄다.',f:'…무섭지 않아. 하나도. 이상하다.',d:'사진 말고 이걸로 남길래.'},
dantae:{n:'단태가 내 동선을 다 아는 사람처럼, 정확히 한 걸음 다가왔다. 조용한 입맞춤이었다.',f:'원하는 걸 말하지 않고 했어요. 처음이에요.',d:'아무도 안 쫓아오는 길에서 하니까 좋네요.'},
dohan:{n:'도한이 수트 소매를 걷은 손으로 내 어깨를 잡았다. 투박하고 정직한 입맞춤이었다.',f:'거짓말 안 한다. 오래 참았다.',d:'밥 먹고 하자. 아니, 지금 하자.'},
beomseok:{n:'범석이 커다란 몸을 한참 숙였다. 곰 같은 체온이 다가오고, 입술이 닿았다.',f:'…웃기지 않다. 근데 웃음이 난다.',d:'직설적으로 할게. 한 번 더.'},
dosan:{n:'도산이 냄새를 맡듯 가까이 다가왔다. 코끝이 닿고, 이어서 입술이 닿았다.',f:'…곁에 한 명만. 너로 정했다.',d:'냄새 바뀌었다. 우리 냄새로.'},
pilyeon:{n:'필연이 레코드를 걸었다. 춤추다 말고, 두 눈 색이 다른 얼굴이 가까워졌다.',f:'내기 안 했는데 이겼다! 과학이야!',d:'떡볶이 맛 나지? 하하. 아니, 좋다고.'},
jaegyun:{n:'재균이 찻잔을 내려놓았다. 말없이, 오래 기다린 사람의 입맞춤이었다.',f:'…오늘도 무사했구나. 이제 그것보다 더 좋은 날이네.',d:'녹차보다 따뜻하네.'},
taegyeong:{n:'태경이 안경을 벗어 주머니에 넣었다. 쓸데없는 말 없이, 짧게 입을 맞췄다.',f:'…세건이한테 말하면 죽어.',d:'한 마디만. 좋다.'},
segeon:{n:'세건이 농담을 하려다 멈췄다. 웃지 않는 얼굴로 입을 맞췄다.',f:'이건 안 웃기게 할게. …진심이야.',d:'형 몰래 한 거다? 들키면 같이 혼나는 거야.'},
heukrang:{n:'계성이 모닥불 너머로 손을 뻗었다. 연기 냄새 속에서 여유 없는 입맞춤이 내려왔다.',f:'하하… 여유 부리려 했는데 실패했다.',d:'계성이라고 불러 줘. 그러면 한 번 더.'},
raehyang:{n:'레미가 판을 깔지 않았다. 그냥, 다가와서 입을 맞췄다.',f:'…이번엔 계산 안 했어요. 진짜예요.',d:'레미라고 불러 주면 한 번 더 할게요.'},
seongwoo:{n:'성우가 오래 망설였다. 감정은 없다던 사람의 입맞춤은 의외로 떨렸다.',f:'…감정 없어. 거짓말이다.',d:'사탕 대신이다. 이게 더 달군.'},
injae:{n:'인재의 꼬리가 바닥을 탁탁 쳤다. 분홍빛으로 물든 얼굴이 숙여지고, 입술이 닿았다.',f:'목적 달성. 과정… 너무 좋았어요.',d:'시크릿보다 좋은 거 찾았어요. 이거요.'},
mugyeol:{n:'무결이 잔소리를 하다 말고 입을 맞췄다. 유자 향이 났다.',f:'…이러면 잔소리 못 하잖아. 귀찮게.',d:'통금 같은 건 이제 없어. 이것도 마음대로.'},
taehyeong:{n:'태형이 안전바를 두 번 확인하듯 내 손을 두 번 쥐었다. 그리고 입을 맞췄다.',f:'이번엔 늦지 않게 알아챘습니다. 좋습니다. 아주.',d:'예외 조항 열한 번째. 매일 적용.'},
seohwan:{n:'서환의 귀가 앞으로 쫑긋 섰다. 배고픈 얼굴이 아니라, 아주 맑은 얼굴로 입을 맞췄다.',f:'…머리가 맑아. 이상하게 하나도 안 배고파.',d:'간식보다 이게 좋아. 진짜로.'},
pildo:{n:'필도가 게임기를 내려놓았다. 서툴게, 그래도 망설임 없이 입을 맞췄다.',f:'…존나 떨린다. 랭크전보다.',d:'2P 특전이다. 너만.'},
haegang:{n:'해강이 샴푸 체어에서 몸을 일으켰다. 나른한 금색 눈이 가까워지고, 입술이 닿았다.',f:'잘했으니까 상 줘야지. 방금 그거.',d:'충전 완료. 한 번 더 하면 과충전.'},
jegang:{n:'제강이 펜을 내려놓았다. 기록하지 않고, 그냥 입을 맞췄다.',f:'…이건 안 적을게. 그냥 기억할게.',d:'관찰 결과, 오늘도 좋다.'}
};
const MONEY={
haean:{w:'{N} 씨, 요즘 식비 계산이 안 맞으시죠. 제 실습실 간식 드십시오. 남습니다.',d:'상환 계획표 짰습니다. 7년. 같이 하면 4년입니다. 계산 끝났습니다.',u:'쉬십시오. 고장 난 기계를 억지로 돌리면 더 망가집니다. 수리는 제가 합니다.'},
sangyun:{w:'야, 너 요즘 밥 굶지? 다 보여. 오늘 내가 산다. 토 달지 마.',d:'빚? 같이 갚으면 반이지. 내가 갚는다니까. 평생 갚는다고 했잖아.',u:'링에서도 다운되면 쉬어. 쉬어야 다시 일어나. 내가 카운트 세 줄게.'},
gangsik:{w:'{N} 씨, 식사 거르시는 거 확인했습니다. 오늘부터 제가 두 인분 챙기겠습니다.',d:'빚 상환을 목표로 설정했습니다. 목표는 반드시 달성합니다. 둘이서.',u:'오늘의 목표는 아무것도 안 하기입니다. 제가 옆에서 같이 안 하겠습니다.'},
dohae:{w:'니 요새 얼굴이 반쪽이다. 돈 때문이가. …할매 국밥집 가자. 내가 낸다.',d:'빚? 배 타면 금방 갚는다. 니는 뭍에서 기다리라.',u:'바다 보러 가자. 아무것도 안 해도 된다. 내가 노 저으께.'},
gihyeon:{w:'막내 잔고, 형 눈엔 다 보여. 걱정 마. 이자 없는 형 대출이 있으니까.',d:'숫자는 형이 다 정리할게. 넌 그냥 웃기만 해. 그게 이자야.',u:'1년쯤 쉬어도 돼. 형이 기다리는 거 잘한다고 했잖아.'},
gisan:{w:'우리 막내 표정이 안 좋다. 돈 문제지? 형이 호텔 알바 자리 하나 빼 줄게.',d:'갚을 거 있으면 같이 갚자. 웃으면서. 그게 우리 방식이잖아.',u:'웃기 힘들면 안 웃어도 돼. 내가 두 배로 웃을게.'},
jaeha:{w:'…계좌 잔고 본 거 아니야. 진짜야. 그냥, 밥은 먹어. 내가 살게.',d:'대출 이자율 제일 낮은 데 찾아 놨어. 합법적으로. …정말로 합법이야.',u:'커튼 쳐 줄게. 오늘은 아무도 안 들어와. 나만.'},
sanggi:{w:'운세에 금전운 흉이라고 나왔어. 너 거. …밥 사 줄게. 그럼 대길로 바뀔지도.',d:'빚 다 갚는 날 운세 봐 놨어. 대길이야. 그날까지 같이 가자.',u:'오늘은 흉일이야. 아무 데도 나가지 마. 나랑 있어.'},
husan:{w:'너 배고프지? 휴산이 사냥해 올까? 아, 학교에선 안 되지. 그럼 빵 사 올게!',d:'빚이 뭐야? 무리에선 다 같이 먹어. 그러니까 같이 갚아!',u:'휴산이 지켜 줄게. 나무 위에서 같이 자자. 아무것도 안 해도 돼.'},
gunha:{w:'콩알, 요즘 얼굴 반쪽이다. 고기 먹으러 가자. 내가 낸다. 대회 상금 남았어.',d:'상금 다 너 빚 갚는 데 쓸게. 다음 대회도 이길 거니까.',u:'손 떨릴 땐 쏘지 마. 쉬어. 그게 진짜 기술이야.'},
danho:{w:'저, 밥값이 좀 남아서요. …같이 먹어요. 늘 먹던 거 말고, 당신이 고른 거로.',d:'갚는 건 늦게 알아도 괜찮아요. 저도 다 늦게 알았어요. 같이 천천히 해요.',u:'아픈 거 늦게 알아도 괜찮아요. 지금 알았으니까, 지금부터 쉬어요.'},
jigwang:{w:'너 요즘 날개 처진 새 같아. 돈이지? 내 둥지에 숨겨 둔 거 있어. 가져가.',d:'옛날에 번 돈 다 털었다. 이건 깨끗한 데 쓰고 싶었어. 너 빚.',u:'탑 꼭대기로 와. 아무도 못 올라와. 쉬기엔 거기가 최고야.'},
seongae:{w:'당신 요즘 식판이 너무 가벼워요. 저 그거 알아요. 제 반찬 하나 줄게요. 두 개.',d:'상환 계획 세웠어요. 이자까지 계산했어요. 저 이거 제일 잘해요.',u:'배고프면 먹고, 졸리면 자요. 그게 다예요. 제가 기관에서 제일 늦게 배운 거.'},
jehan:{w:'못생겼네. 영양실조 직전이야. 진단이다. 밥 먹으러 가.',d:'의사 월급 생각보다 많아. 네 빚, 내 처방으로 해결한다.',u:'진단. 번아웃. 처방. 1년 휴식. 보호자는 나.'},
haeseong:{w:'…식사를 거르시는 것 같습니다. 보이차와 빵을 준비했습니다. 드십시오.',d:'원하는 게 하나 더 생겼습니다. 당신 빚을 같이 갚는 것.',u:'세지 않아도 됩니다. 오늘은 아무것도. 제가 옆에서 대신 세겠습니다.'},
yuhong:{w:'괜찮아요? 아빠가 도시락 두 개 싸 줬어요! 하나 드세요! 진짜 남는 거예요!',d:'아빠한테 재테크 배웠어요! 같이 갚아요! 저 노력할게요!',u:'아무것도 안 해도 돼요! 저 옆에서 꼬리 흔들고 있을게요! 헤헤.'},
jeil:{w:'요새 수상한데. 돈 없지? 형사 눈은 못 속여. 국밥 먹으러 가자.',d:'형사 월급 쥐꼬리지만 둘이 모으면 꼬리 두 개다. 하하. 같이 갚자.',u:'비번 날 다 몰아서 쓸게. 너 옆에 있으려고.'},
changoh:{w:'요즘 지갑이 가벼우신 것 같군요. …제 돈은 깨끗하지 않아서 드릴 수 없습니다. 대신 밥은 사겠습니다.',d:'이제 깨끗하게 번 돈입니다. 당신 빚 갚는 데 쓰게 해 주십시오.',u:'세상이 시끄러우면 쉬십시오. 문 앞은 제가 지키겠습니다.'},
seongho:{w:'짧게 할게. 근로장학 시간 늘려 줄게. 돈 걱정은 서류로 해결해.',d:'지원금 서류 다 알아. 짧게 말하면, 네 빚 절반은 줄일 수 있어.',u:'소파 비워 뒀어. 1년 늘어져. 길게 설명 안 해도 돼.'},
chiyeol:{w:'보고드립니다. {N} 씨 식사 횟수가 줄었습니다. 소고기 무국을 끓여 왔습니다.',d:'상환 계획을 엑셀로 정리했습니다. 별첨 없이, 매달 같이 하겠습니다.',u:'일정표를 비워 두었습니다. 1년. 저도 반은 비웠습니다.'},
hwasu:{w:'괜찮은 척하는 거, 저 알아요. 연기 잘하는 사람끼리는. 밥 먹으러 가요.',d:'빚 같은 거 무대 뒤에 숨기지 마요. 같이 무대에 올려요. 둘이 갚아요.',u:'오늘은 안 웃어도 돼요. 저도 안 웃을게요. 같이.'},
juyeong:{w:'야, 너 요즘 굶지? 씨발, 다 보여. PX 가자. 내가 다 산다.',d:'장교 월급 다 너 줘도 돼. 나 응석받이라 돈 쓸 데도 없어.',u:'관사에 와. 애니 정주행. 52화. 아무것도 안 하는 거야.'},
taean:{w:'요새 밥 굶쥬? 도시락 하나 더 쌌어유. 고기 많이 넣었어유.',d:'밭에서 난 거 팔면 금방 갚아유. 천천히 해두 돼유. 지는 느리니께.',u:'볕 좋은 데 누워 있어유. 이불 말려 놓을게유.'},
haetan:{w:'…식사를 거르시면 안 됩니다. 야간 하역 수당 남았습니다. 드리겠습니다.',d:'하역장 일 두 배로 하겠습니다. 갚는 건 금방입니다.',u:'싸우지 않아도 됩니다. 이제는. 쉬셔도 됩니다.'},
piljung:{w:'아가, 요즘 홀쭉해졌네. 관심 생겼어. 밥 먹자.',d:'해군 연금 생각보다 많아. 아가 빚은 내 관심사야.',u:'아무것도 기대 안 해. 너한테. 그러니까 쉬어도 돼, 아가.'},
yeonhu:{w:'오늘 호떡 공짜야! 단골 할인… 아니 애인 할인! 거절 금지!',d:'가게 매출 반은 네 빚 갚는 데 쓸게. Deal?',u:'단 거 먹고 자. 일어나면 또 단 거 줄게. 그게 휴식이야.'},
taegyun:{w:'지출 구조가 흐트러져 있군요. 정리해 드리겠습니다. 예상 밖의 일이지만.',d:'상환 일정, 정각에 맞춰 짰습니다. 당신 빚은 예상대로 끝날 겁니다.',u:'시계는 풀어 두십시오. 지금은 시간을 재지 않아도 됩니다.'},
gyeonu:{w:'너 요즘 손이 차가워. 밥 굶었지. 계산적인 사람이 밥 사 줄게.',d:'출연료 들어왔어. 계산 끝. 네 빚부터.',u:'장갑 벗고 있을게. 아무 때나 잡아.'},
dantae:{w:'당신 동선이 요즘 식당을 피해요. 다 보여요. 같이 가요.',d:'원하는 거 하나 말할게요. 당신 빚, 같이 갚게 해 줘요.',u:'아무도 안 쫓아오는 길만 골라 걸어요. 천천히.'},
dohan:{w:'밥은 먹었냐. …안 먹었구나. 회사 구내식당 같이 가자. 공짜다.',d:'거짓말 안 한다. 네 빚 다 갚아 줄 수 있다. 근데 네가 싫어하면 같이 갚자.',u:'산골 집에 가 있자. 어머니가 밥 해 주신다. 아무것도 하지 마.'},
beomseok:{w:'…너 굶었지. 국밥 다섯 그릇 시켰다. 네가 세 그릇 먹어.',d:'직설적으로 할게. 같이 갚자.',u:'혼자 있지 마. 그게 다다.'},
dosan:{w:'…육포 반 쪼갰다. 밥도 사 줄게.',d:'철문 앞에서 번 돈, 다 모아 뒀다. 쓸 데 생겼네.',u:'숲 산책만 하자. 사냥 말고. 아무것도 안 해도 돼.'},
pilyeon:{w:'떡볶이 내기! 내가 지면 내가 쏘고, 이겨도 내가 쏜다! 과학이야!',d:'떡볶이 줄이고 갚자! 아니, 떡볶이는 못 줄이겠다. 다른 거 줄이자!',u:'레코드 틀어 놓고 누워만 있자. 춤은 다음에.'},
jaegyun:{w:'오늘 경비실 녹차에 빵도 있어. 먹고 가. 남는 거야.',d:'기다림 끝에 변화가 없으면 직접 움직인다. 네 빚, 내가 움직인다.',u:'조용히 있자. 책 읽어 줄게.'},
taegyeong:{w:'…초콜릿 한 판 통째로. 세건이한텐 비밀. 밥 대신 먹지는 말고.',d:'쓸데없는 말 안 해. 같이 갚자.',u:'새벽 산책만 하자. 말 안 해도 돼.'},
segeon:{w:'오늘 포커 이겼다! 밥 산다! …농담 아니야. 진짜 밥 산다.',d:'도박은 끊었어. 대신 갚는 걸로 내기하자. 누가 먼저 다 갚나.',u:'옥상에서 별 보자. 웃기는 얘기 안 할게. 그냥 있자.'},
heukrang:{w:'하하, 배고파 보이네. 고기 구워 놨다. 먹고 가.',d:'캠핑카 하나 팔면 금방이야. 아니, 그건 못 팔지. 운송 두 배로 뛸게.',u:'캠핑카 타고 아무 데나 가자. 해안도로 끝까지.'},
raehyang:{w:'따뜻한 국물에 매운 거, 오늘 제가 살게요. 판 깐 거 아니에요.',d:'통역 일 두 배로 잡았어요. 같이 갚아요. 레미가 할게요.',u:'머리끈 풀고 쉬어요. 묶는 건 나중에 제가 해 줄게요.'},
seongwoo:{w:'…조식 쿠폰 다섯 장. 학생처장 재량이다. 감정은 없어.',d:'따뜻한 말은 못 한다. 대신 연금 통장을 주지.',u:'호수에 오리 보러 가자. 그거면 된다.'},
injae:{w:'목적: 당신 밥. 과정: 지금 바로. 결과: 배부름. 가요.',d:'캐릭터 사업 보너스 나왔어요. 목적: 당신 빚. 결과: 0원.',u:'회전목마 타요. 목적 없이. 그게 휴식이에요.'},
mugyeol:{w:'너 요즘 밥 안 먹지. 사감은 다 알아. 쿠키 말고 밥 먹어.',d:'빵집 매출 반은 네 거. 잔소리는 무료.',u:'잘 자. 오늘은 통금 없어. 늦잠도 돼.'},
taehyeong:{w:'지출 구조 분석 결과, 식비가 0원이군요. 정정하겠습니다. 오늘 저녁.',d:'상환 계획서 제출합니다. 목적: 부채 0. 기한: 늦지 않게.',u:'예외 조항입니다. 1년 동안 아무것도 안 하기.'},
seohwan:{w:'간식 주머니 반 줄게. 아니, 다. 배고픈 거 무서운 거 알아.',d:'PX 할인으로 아끼면 금방 갚아. 이상한 요리 실력도 써먹을게.',u:'배고프면 말해. 무서우면 말해. 그거면 돼.'},
pildo:{w:'라면 끓였다. 첫 젓가락 너 줄게. …굶지 마라. 존나 걱정된다.',d:'게임 상금 다 너 줄게. 2P 특전이다.',u:'게임만 하자. 아무것도 안 하는 거야. 같이.'},
haegang:{w:'너 요즘 방전됐어. 내가 밥 살게. 귀찮아도 이건 해.',d:'화보 하나 더 찍으면 돼. 귀찮지만 너라서 한다.',u:'볕 좋은 데 누워서 같이 낮잠 자자. 1년 동안.'},
jegang:{w:'관찰 결과, 요즘 식사를 거르고 있어. 기록 말고, 밥 사 줄게.',d:'네가 스스로 말할 때까지 기다렸어. 이제 같이 갚자.',u:'끝까지 지켜보는 건 내가 잘해. 너는 쉬기만 해.'}
};

function firstKiss(c){const k=KISS[c.id];return k?[k.n,'@'+c.id+'|'+fx(k.f)]:[loveLine(c)];}

titleScreen();

</script>
</body>
</html>
